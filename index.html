const ScoutDashboard = ({ scout, team, players, onSelfAction, setModal }) => {
    const energy = scout.energy !== undefined ? scout.energy : 100;
    const isExhausted = energy < 30;

    // --- LÓGICA DE XP DO OLHEIRO ---
    const xpNext = scout.level * 100;
    const progress = ((scout.xp || 0) / xpNext) * 100;

    const runPeneira = async (level, maxOvr) => {
        if (!team || team.id === 'FREE') return alert("Você precisa estar contratado por um clube para realizar peneiras!");
        
        const today = new Date().toDateString();
        const scoutsDone = scout.lastScoutDate === today ? (scout.scoutsToday || 0) : 0;
        
        if (scoutsDone >= 2) return alert("Você já realizou 2 peneiras hoje! Descanse a vista e volte amanhã.");
        if (energy < 50) return alert("Você precisa de pelo menos 50⚡ de Energia para viajar e avaliar jogadores.");

        const cost = getPeneiraCost(maxOvr);
        if ((team.balance || 0) < cost) return alert(`A diretoria não liberou verba para esta Peneira. Necessário: ${fmt(cost)} no caixa do clube.`);

        if (!confirm(`Realizar Peneira Nível ${level}?\nCusto para o Clube: ${fmt(cost)}\nEnergia gasta: -50⚡\n\nIsso apagará a lista da peneira anterior.`)) return;

        const db = firebase.firestore();
        const b = db.batch();

        // 1. Gera 5 NPCs aleatórios

    const availablePerks = DOCTOR_PERKS.filter(p => !(doctor.perks || []).some(cp => cp.id === p.id));
    const perkOptions = React.useMemo(() => availablePerks.sort(() => 0.5 - Math.random()).slice(0, 3), [doctor.pendingPerks]);

    const activePerks = doctor.perks || [];
    const hasNutri = activePerks.some(p => p.id === 'SPORTS_NUTRITION');
    const hasFastDiag = activePerks.some(p => p.id === 'FAST_DIAGNOSIS');
    const hasGoldenHands = activePerks.some(p => p.id === 'GOLDEN_HANDS');
    const hasMiracle = activePerks.some(p => p.id === 'MIRACLE_WORKER');
    const hasColdBlood = activePerks.some(p => p.id === 'COLD_BLOOD');
    const hasDiscount = activePerks.some(p => p.id === 'VIP_DISCOUNT');

    const handleStudy = async () => {
        if (energy < 20) return alert("Você está exausto! Tome um energético antes de estudar.");
        let xpGain = Math.floor(Math.random() * 15) + 10;
        
        if (hasNutri) xpGain = Math.round(xpGain * 1.2); // Bônus da Habilidade Nutrição

        let newXp = (doctor.xp || 0) + xpGain;
        let newLevel = doctor.level;
        let pending = doctor.pendingPerks || 0;

        if (newXp >= newLevel * 100) { 
            newXp -= (newLevel * 100); 
            newLevel++; 
            if (newLevel % 3 === 0) pending++; // Médico ganha habilidade a cada 3 níveis!
            alert(`🎉 Você subiu para o Nível ${newLevel} de Medicina Esportiva!`); 
        }

        await firebase.firestore().collection('users').doc(doctor.id).update({
            energy: energy - 20,
            xp: newXp,
            level: newLevel,
            pendingPerks: pending
        });
        alert(`📚 Você estudou novos tratamentos e ganhou ${xpGain} XP!`);
    };

    const handleEvaluate = async (p) => {
        const cost = hasFastDiag ? 5 : 10;
        if (energy < cost) return alert(`Energia insuficiente. (Custo: ${cost}⚡)`);
        
        const injuryName = typeof p.injury === 'object' ? p.injury.label : p.injury;
                                        const isLeve = !INJURIES_DB.MODERADA.includes(injuryName) && !INJURIES_DB.GRAVE.includes(injuryName) && !INJURIES_DB.EXTREMA.includes(injuryName);
        const baseChance = 0.20 + (doctor.level * 0.02); // 20% base + 2% por nível

        if (newXp >= newLevel * 100) {

            alert(`🎉 Nível ${newLevel} alcançado!`); 
        }

        b.update(db.collection('users').doc(doctor.id), { energy: energy - cost, xp: newXp, level: newLevel, pendingPerks: pending });

        if (isLeve && success) {
            b.update(db.collection('players').doc(p.id), { recoveryLeft: 0, injury: firebase.firestore.FieldValue.delete() });
            await b.commit();
            alert(`✨ DIAGNÓSTICO PRECISO!\nSua avaliação e aplicação de gelo curaram o jogador na hora! ${p.name} está liberado.`);
        } else {
            await b.commit();
            alert(`📋 Avaliação Concluída.\nA lesão é real. O atleta precisará cumprir o repouso ou passar por cirurgia.`);
        }
    };

   const handleSurgery = async (p) => {
        if (energy < 40) return alert("Uma cirurgia exige muita concentração! Você precisa de pelo menos 40⚡.");
        
        let category = 'LEVE';
        const injuryName = typeof p.injury === 'object' ? p.injury.label : p.injury;
        if (INJURIES_DB.MODERADA.includes(injuryName)) category = 'MODERADA';
        if (INJURIES_DB.GRAVE.includes(injuryName)) category = 'GRAVE';
        if (INJURIES_DB.EXTREMA.includes(injuryName)) category = 'EXTREMA';

        if (category === 'LEVE' || injuryName === 'Intoxicação Alimentar') return alert("Lesões clínicas não operáveis.");

        const SURGERY_OPTIONS = {
            MODERADA: [
                { name: 'Fisioterapia PRP', timeRed: 2, cost: 750000, baseSuccess: 0.85 },
            ],
            GRAVE: [
                { name: 'Artroscopia', timeRed: 3, cost: 1500000, baseSuccess: 0.80 },
                { name: 'Sutura Meniscal', timeRed: 4, cost: 3500000, baseSuccess: 0.70 }
            ],
            EXTREMA: [
                { name: 'Enxerto Ligamentar', timeRed: 6, cost: 8000000, baseSuccess: 0.65 },
                { name: 'Cirurgia Robótica', timeRed: 8, cost: 15000000, baseSuccess: 0.50 }
            ]
        };

        const options = SURGERY_OPTIONS[category];
        
        const lvlBonus = doctor.level * 0.02; 
        const exhaustionPenalty = energy < 30 ? 0.30 : (energy < 50 ? 0.15 : 0);
        
        const lista = options.map((s, idx) => {
            let finalChance = s.baseSuccess + lvlBonus - exhaustionPenalty;
            if (hasGoldenHands) finalChance += 0.10;
            finalChance = Math.min(0.99, Math.max(0.10, finalChance)); 
            
            let surgeryCost = s.cost;
            if (hasDiscount) surgeryCost = surgeryCost * 0.90;

            return `${idx + 1}) ${s.name}\nCusto do Convênio: ${fmt(surgeryCost)} | Reduz: ${s.timeRed} ${hasMiracle ? '+1' : ''} jogos\nSua Chance de Sucesso: ${(finalChance*100).toFixed(0)}%`;
        }).join('\n\n');

        const escolha = prompt(`🔪 CENTRO CIRÚRGICO - Paciente: ${p.name}\nSua Energia: ${energy}% (Fadiga afeta precisão!)\n\nEscolha o procedimento (1-${options.length}):\n\n${lista}`);
        
        if (escolha) {
            const cirurgia = options[parseInt(escolha) - 1];
            if (!cirurgia) return;

            let finalChance = cirurgia.baseSuccess + lvlBonus - exhaustionPenalty;
            if (hasGoldenHands) finalChance += 0.10;
            finalChance = Math.min(0.99, Math.max(0.10, finalChance));

            if (hasDiscount) baseCost = baseCost * 0.90;

            const teamCoverage = team?.healthPlan?.coverage || 0;
            const playerCoverage = p.healthPlan?.coverage || 0;
            const bestCoverage = Math.max(teamCoverage, playerCoverage); 
            const finalCost = baseCost - (baseCost * (bestCoverage / 100));

                return alert(`O jogador não tem fundos para pagar a cirurgia (Custos + Honorários).\nFaltam recursos!`);

            if (!confirm(`Confirmar ${cirurgia.name}?\nVocê gastará 40⚡.\nSe der certo, você receberá ${fmt(doctorFee)} de Honorários.\nSe errar, sua moral cairá.`)) return;

            const db = firebase.firestore();

            const docRef = db.collection('users').doc(doctor.id);

            let remainingCost = finalCost;
            let currentFund = p.hospitalFund || 0;

                b.update(pRef, { hospitalFund: currentFund - remainingCost });
            } else {
                remainingCost -= currentFund;
                b.update(pRef, { hospitalFund: 0, balance: firebase.firestore.FieldValue.increment(-remainingCost) });
            }

            const success = Math.random() < finalChance;

                b.update(docRef, { energy: energy - 40, balance: firebase.firestore.FieldValue.increment(doctorFee), xp: newXp, level: newLevel, pendingPerks: pending });

                }
            }
        }

  const PlayerForm = ({ initial, onSave, onDelete, isAdmin, teams, onRenew, isOwner }) => {
    // 1. Definição dos dados padrão
    const defaultState = {
        name:'', position:'ATA', overall:45, value:'', salary:'', 
        clause:'', contract:'', mood:'😐', status:'NAO_A_VENDA', 
        password:'', balance: 0, rating: '', 
        stats: {goals:0, assists:0, tackles:0, saves:0, yellows:0, reds:0},
        attributes: null 
    };

    const [f, setF] = useState({ ...defaultState, ...(initial || {}) });
    const isEditing = f.id ? true : false;
    
    // Calcula limites em tempo real baseado no Overall digitado
    const limits = getSalaryLimits(f.overall);

    const calculateRealOverall = (position, attrs) => {
        let sum = 0; let count = 0;
        const safePos = position || 'ATA'; 
        const ignoreList = safePos === 'GOL' ? ['shot', 'attack', 'dribble', 'curve', 'freeKick', 'weakFootAcc', 'weakFootFreq'] : ['gk'];
        Object.entries(attrs).forEach(([key, val]) => { if (!ignoreList.includes(key)) { sum += val; count++; } });
        return count === 0 ? 0 : Math.round(sum / count);
    };

    const handleSave = () => {
        try {
            const dataToSave = { ...f };
            const safePos = dataToSave.position || 'ATA'; 
            const ovr = parseInt(dataToSave.overall) || 50;
            
            // --- CORREÇÃO CRÍTICA: CONVERSÃO DE TIPOS ---
            // Isso impede que o saldo vire texto e cause o bug do negativo
            dataToSave.salary = parseFloat(dataToSave.salary) || 0;
            dataToSave.balance = parseFloat(dataToSave.balance) || 0; // <--- AQUI ESTAVA O PROBLEMA
            dataToSave.value = parseFloat(dataToSave.value) || 0;
            dataToSave.clause = parseFloat(dataToSave.clause) || 0;
            dataToSave.contract = parseInt(dataToSave.contract) || 0;

            // Trava de Salário (Lei do Teto)
            if (dataToSave.salary < limits.minSal || dataToSave.salary > limits.maxSal) {
                return alert(`🚫 SALÁRIO IRREGULAR!\n\nCategoria: ${limits.label} (Over ${ovr})\nPermitido: ${fmt(limits.minSal)} - ${fmt(limits.maxSal)}\nTentativa: ${fmt(dataToSave.salary)}`);
            }

            if (!dataToSave.attributes || Object.keys(dataToSave.attributes).length === 0) {
                const targetOv = parseInt(dataToSave.overall) || 60;
                const newAttrs = generateAttributes(safePos, targetOv);
                const realAvg = calculateRealOverall(safePos, newAttrs);
                
                dataToSave.attributes = newAttrs;
                dataToSave.overall = realAvg;
                dataToSave.position = safePos;
                alert(`Atributos gerados!\nOverall Real: ${realAvg}`);
            }

            onSave(dataToSave);
        } catch (error) { console.error(error); alert("Erro ao salvar: " + error.message); }
    };

    return (
        <div className="modal-bg">
            <div className="modal-content" style={{maxHeight:'90vh', overflowY:'auto'}}>
                {/* SE FOR APENAS O DONO DO TIME (NÃO ADMIN), MOSTRA O PAINEL RESUMIDO DE MERCADO */}

                        <label>Status no Mercado</label>
                        <select className="input-field" value={f.status} onChange={e=>setF({...f, status:e.target.value})}>

                        <input className="input-field" type="number" value={f.value} onChange={e=>setF({...f, value:e.target.value})} />

                        <div style={{display:'flex', gap:10, marginTop:15}}>

                        )}
                        
                        {!open && p.teamId !== 'FREE' && p.contract !== 1 && (
                            <button className="btn btn-ghost" style={{flex:1, marginBottom:0, opacity:0.5}} disabled>
                                <i className="fas fa-lock"></i> FECHADO
                            </button>
                        )}
                        
                        {false && p.teamId !== 'FREE' && parseFloat(p.clause) > 0 && (
                            <button className="btn btn-gold" style={{width:'auto', marginBottom:0}} onClick={()=>onPayClause(p)}>
                                <i className="fas fa-gavel"></i> MULTA
                            </button>
                        )}
                    </div>
                )}

                {/* BOTÃO DE INDICAÇÃO PARA TÉCNICOS */}
                {user && user.type === 'COACH' && user.data.teamId !== 'FREE' && p.teamId !== user.data.teamId && !p.preContract && (
                    <div style={{marginTop:12}}>
                        <button className="btn btn-gold" style={{width:'100%', marginBottom:0}} onClick={() => {
                            const obs = prompt("Motivo da indicação (Opcional):", "Jogador ideal para o elenco!");
                            if(confirm(`Sugerir ${p.name} para o seu presidente?`)) {
                                onIndicate(p, obs);
                            }
                        }}>
                            💡 INDICAR AO CLUBE
                        </button>
                    </div>
                )}
            </div>
        );
    };

    // 3. Renderiza a Grade de Jogadores
    const renderPlayerList = () => {
        if (filteredPlayers.length === 0) {
            return <p style={{textAlign:'center', color:'#666', marginTop:30, fontStyle:'italic'}}>Nenhum jogador encontrado com esses filtros.</p>;
        }
        return (
            <div style={{display:'grid', gap:10}}>
                <div style={{fontSize:10, color:'#aaa', textAlign:'right', marginBottom:-5}}>
                    Exibindo {filteredPlayers.length} jogador(es)
                </div>
                {filteredPlayers.map(p => renderPlayerCard(p))}
            </div>
        );
    };

    // =====================================================================
    // VIEWS DO MERCADO
    // =====================================================================

    if(view === 'MENU') {
        const isFilterActive = searchName !== '' || searchPos !== '' || minOvr > 0 || maxOvr < 99;

        return (
            <div>
                <h3 style={{display:'flex', alignItems:'center', gap:10}}>
                    Mercado Global {open ? <span style={{color:'var(--primary)', fontSize:12}}>🟢 ABERTO</span> : <span style={{color:'var(--danger)', fontSize:12}}>🔴 FECHADO</span>}
                </h3>
                
                <div style={{display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:10, marginBottom:15}}>
                    <div className="card" style={{textAlign:'center', cursor:'pointer', border:filt==='VENDA'?'2px solid var(--primary)':'1px solid #333', background: filt==='VENDA'?'rgba(0,230,118,0.1)':'var(--bg-card)'}} onClick={()=>{setFilt('VENDA'); setView('GLOBAL');}}>
                        <i className="fas fa-shopping-cart" style={{fontSize:20, marginBottom:5, color:'var(--primary)'}}></i><br/>
                        <span style={{fontSize:10, fontWeight:'bold'}}>À VENDA</span>
                    </div>
                    <div className="card" style={{textAlign:'center', cursor:'pointer', border:filt==='EMPRESTIMO'?'2px solid var(--secondary)':'1px solid #333', background: filt==='EMPRESTIMO'?'rgba(41,121,255,0.1)':'var(--bg-card)'}} onClick={()=>{setFilt('EMPRESTIMO'); setView('GLOBAL');}}>
                        <i className="fas fa-retweet" style={{fontSize:20, marginBottom:5, color:'var(--secondary)'}}></i><br/>
                        <span style={{fontSize:10, fontWeight:'bold'}}>EMPRÉST.</span>
                    </div>
                    <div className="card" style={{textAlign:'center', cursor:'pointer', border:filt==='FREE'?'2px solid var(--warning)':'1px solid #333', background: filt==='FREE'?'rgba(255,196,0,0.1)':'var(--bg-card)'}} onClick={()=>{setFilt('FREE'); setView('GLOBAL');}}>
                        <i className="fas fa-user-check" style={{fontSize:20, marginBottom:5, color:'var(--warning)'}}></i><br/>
                        <span style={{fontSize:10, fontWeight:'bold'}}>LIVRES</span>
                    </div>
                </div>

                {/* BOTÃO PARA TÉCNICOS SÓ APARECE PARA CLUBES (USERS) */}
                {isPresident && (
                    <div className="card" style={{textAlign:'center', cursor:'pointer', border:'2px solid gold', background:'rgba(255,215,0,0.1)', marginBottom:15}} onClick={()=>{setView('COACHES');}}>
                        <i className="fas fa-user-tie" style={{fontSize:20, marginBottom:5, color:'gold'}}></i><br/>
<span style={{fontSize:10, fontWeight:'bold'}}>CONTRATAR COMISSÃO</span>
                                                      </div>
                )}

                {/* --- FILTRO GLOBAL NO MENU --- */}
                {renderFilters("Busca Global Escouter")}

                {isFilterActive ? (
                    <div className="animate-in">
                        <h4 style={{marginTop: 5, color: 'var(--primary)'}}>Resultados da Busca</h4>
                        {renderPlayerList()}
                    </div>
                ) : (
                    <div className="animate-in">
                        <h4>Navegar por Séries</h4>
                        <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:10}}>
                            {['A','B','C','D'].map(s=>(
                                <div key={s} className="card" style={{textAlign:'center', cursor:'pointer', borderLeft:`4px solid var(--secondary)`}} onClick={()=>{setSerie(s); setView('LIST');}}>
                                    <b>SÉRIE {s}</b>
                                </div>
                            ))}
                            {/* BOTÃO ESPECÍFICO DA VÁRZEA */}
                            <div className="card" style={{textAlign:'center', cursor:'pointer', borderLeft:`4px solid gold`, gridColumn: 'span 2', background:'rgba(255, 215, 0, 0.05)'}} onClick={()=>{setSerie('VARZEA'); setView('LIST');}}>
                                <b>TERRÃO (VÁRZEA)</b>
                            </div>
                        </div>
                    </div>
                )}
            </div>
        );
    }

    if(view === 'LIST') return (
        <div>
            <button className="btn btn-ghost" style={{marginBottom:15, width:'auto'}} onClick={()=>setView('MENU')}>
                <i className="fas fa-chevron-left"></i> VOLTAR
            </button>
            <h3>{serie === 'VARZEA' ? 'Clubes da Várzea' : `Clubes da Série ${serie}`}</h3>
            {teams.filter(t=>t.serie===serie && t.status!=='PENDING').map(t=>(
                <div key={t.id} className="card" onClick={()=>{setSelT(t); setView('TEAM');}} style={{display:'flex', alignItems:'center', gap:15, cursor:'pointer'}}>
                    {t.logo ? <img src={t.logo} style={{width:40, height:40, borderRadius:'50%', objectFit:'cover', border:'1px solid #444'}}/> : <div style={{width:40, height:40, borderRadius:'50%', background:'#333', display:'grid', placeItems:'center'}}><i className="fas fa-shield-alt"></i></div>}
                    <b style={{fontSize:16}}>{t.name}</b>
                    <i className="fas fa-chevron-right" style={{marginLeft:'auto', color:'#555'}}></i>
                </div>
            ))}
            {teams.filter(t=>t.serie===serie && t.status!=='PENDING').length === 0 && <p style={{color:'#666', textAlign:'center'}}>Nenhum time nesta divisão.</p>}
        </div>
    );

   // --- VIEW DA COMISSÃO TÉCNICA (TÉCNICOS, MÉDICOS, ETC) ---
    if(view === 'COACHES') {
        const roleNames = { 'COACH': 'Técnico', 'DOCTOR': 'Médico', 'SCOUT': 'Olheiro', 'ASSISTANT': 'Auxiliar' };
        return (
            <div>
                <button className="btn btn-ghost" style={{marginBottom:15, width:'auto'}} onClick={()=>setView('MENU')}>
                    <i className="fas fa-chevron-left"></i> VOLTAR
                </button>
                <h3>Mercado da Comissão Técnica</h3>
                
                {availableCoaches.length === 0 && <p style={{textAlign:'center', color:'#666'}}>Nenhum profissional disponível no momento.</p>}

                <div style={{display:'grid', gridTemplateColumns:'1fr', gap:10}}>
                    {availableCoaches.map(c => (
                        <div key={c.id} className="card" style={{borderLeft:'4px solid gold'}}>
                            <div style={{display:'flex', justifyContent:'space-between', alignItems: 'center'}}>
                                <b>{c.type === 'DOCTOR' ? '🩺 Dr. ' : (c.type === 'ASSISTANT' ? '📋 ' : (c.type === 'SCOUT' ? '🕵️‍♂️ ' : '👔 '))}{c.name}</b>
                                <span style={{color:'gold', fontWeight:'bold', fontSize: 11}}>★ Nível {c.level}</span>
                            </div>
                            <div style={{fontSize:12, color:'#aaa', margin:'5px 0'}}>
                                Cargo: <b style={{color:'#fff'}}>{roleNames[c.type] || 'Técnico'}</b>
                                {c.type === 'COACH' && ` | Esp: ${c.affinities ? c.affinities[0] : 'Geral'}`}
                            </div>
                            <div style={{fontSize:12, fontWeight:'bold', color:'var(--primary)', marginBottom:10}}>
                                Salário Pretendido: {fmt(c.salary)}/sem
                            </div>
                            
                           {isPresident && (
                                <button className="btn btn-green" onClick={() => setModal({ type: 'OFFER', data: c })}>
                                    NEGOCIAR CONTRATO DE {roleNames[c.type] ? roleNames[c.type].toUpperCase() : 'PROFISSIONAL'}
                                </button>
                            )}
                        </div>
                    ))}
                </div>
            </div>
        );
    }

    // --- VIEW DE JOGADORES (GLOBAL ou TEAM) ---
    return (
        <div>
            <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom:15}}>
                <button className="btn btn-ghost" style={{width:'auto', margin:0}} onClick={()=>{
                    setSearchName(''); setSearchPos(''); setMinOvr(0); setMaxOvr(99); // Limpa ao voltar
                    view==='GLOBAL' ? setView('MENU') : setView('LIST');
                }}>
                    <i className="fas fa-chevron-left"></i> VOLTAR
                </button>
                <h3 style={{margin:0}}>{view==='GLOBAL' ? (filt === 'FREE' ? 'Mercado de Agentes Livres' : `Lista de ${filt}`) : selT.name}</h3>
            </div>
            
            {renderFilters(view==='GLOBAL' ? "Filtrar Lista" : "Filtrar Elenco")}

            {renderPlayerList()}
        </div>
    );
};

const OfferForm = ({ target, myPlayers, onSend, setModal, user }) => {
    const old = target.oldOffer || {};
    const isCounter = !!old.id;
    const isPlayerActing = user?.type === 'PLAYER' || ['COACH', 'DOCTOR', 'SCOUT', 'ASSISTANT'].includes(user?.type);
    const clubsHaveAgreed = old?.sellerAccepted === true;
    const isUrgentRenewal = old?.type === 'RENOVACAO_URGENTE';
    
    // Identifica se é Comissão Técnica ou Jogador
    const isStaff = ['COACH', 'DOCTOR', 'SCOUT', 'ASSISTANT'].includes(target.type);
    
    const isFreeAgent = target.teamId === 'FREE' || !target.teamId; 
    const isMyPlayer = user?.type === 'USER' && user.data.id === target.teamId;
    
    // Esconde a Parte 1 (Clubes) se for Staff, Agente Livre ou seu próprio funcionário
    const shouldHidePart1 = isPlayerActing || clubsHaveAgreed || isUrgentRenewal || isFreeAgent || isMyPlayer || isStaff;

    const maxLoanAllowed = parseInt(target.contract) || 1;

    // Se for Staff, os limites são abertos. Se for jogador, usa a tabela de Overall.
    const limits = isStaff ? { minSal: 1000, maxSal: 9999999 } : getSalaryLimits(target.overall);

    const [t, setT] = useState(old.type || (isMyPlayer ? 'RENOVACAO' : 'COMPRA'));
    const [v, setV] = useState(old.value || '');
    const [sal, setSal] = useState(old.meta?.newSalary || target.salary || limits.minSal);
    const [con, setCon] = useState(old.offerContract || '1');
    const [role, setRole] = useState(old.meta?.role || (isStaff ? 'STAFF' : 'ROTACAO'));
    const [hasBuyOption, setHasBuyOption] = useState(old.meta?.hasBuyOption || false);

    const [meta, setMeta] = useState(old.meta || { 
        sellOn: 0, installments: 1, signingBonus: 0, loanDuration: 1, salarySplit: 100, buyOpt: 0 
    });
    const [swaps, setSwaps] = useState(old.swapPlayerIds || []);
    

    const toggleSwap = (id) => {
        if (swaps.length >= 3 && !swaps.includes(id)) return alert("Máximo de 3 jogadores!");
        setSwaps(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]);
    };

    const isPreContract = t === 'PRE_CONTRATO';

    return (
        <div className="modal-bg">
            <div className="modal-content" style={{maxWidth: '500px'}}>
                <h3 style={{color:'var(--primary)'}}>
                    {isUrgentRenewal ? '🚨 Renovação Obrigatória' : (isPreContract ? '📝 Pré-Contrato' : (isCounter ? 'Responder Proposta' : `Negociar ${target.name}`))}
                </h3>
                
               {/* --- PAINEL DE REFERÊNCIA DE VALORES --- */}
                {!isPreContract && !isUrgentRenewal && !isStaff && (
                    <div style={{background: 'rgba(0, 0, 0, 0.3)', padding: '10px', borderRadius: '8px', marginBottom: '15px', border: '1px solid #444', fontSize: '12px'}}>
                        <div style={{display: 'flex', justifyContent: 'space-between', marginBottom: '5px'}}>
                            <span style={{color: '#aaa'}}>Valor de Mercado (OVR):</span>
                            <b style={{color: '#00E676'}}>{fmt(getRecommendedPrice(target.overall, target.position))}</b>
                        </div>
                        <div style={{display: 'flex', justifyContent: 'space-between'}}>
                            <span style={{color: '#aaa'}}>Valor Estipulado pelo Clube:</span>
                            <b style={{color: '#fff'}}>{fmt(target.value)}</b>
                        </div>
                    </div>
                )}
                
                {/* AVISO DE PRÉ-CONTRATO */}
                {isPreContract && (
                    <div style={{background:'rgba(41, 121, 255, 0.2)', padding:10, borderRadius:8, border:'1px solid var(--secondary)', marginBottom:15, fontSize:12, color:'#fff'}}>
                        ℹ️ <b>ASSINATURA LIVRE:</b> O jogador tem menos de 6 meses de contrato protegido.
                        <br/>Ele virá <b>de graça</b> para o seu time apenas no início da <b>próxima temporada</b>.
                    </div>
                )}

                {/* 1. ACORDO ENTRE CLUBES (FINANCEIRO) */}
                {/* Se for pré-contrato, esconde essa parte pois não tem taxa */}
                {!shouldHidePart1 && !isPreContract ? (
                    <div style={{borderBottom: '1px solid #444', paddingBottom: 15, marginBottom: 15}}>
                        <label style={{fontSize: '11px', color: 'gold', fontWeight: 'bold'}}>1. ACORDO ENTRE CLUBES (FINANCEIRO)</label>
                        <div style={{display:'flex', gap:5, margin:'10px 0'}}>
                            {['COMPRA','EMPRESTIMO','TROCA'].map(x=>(
                                <button key={x} className={`btn ${t===x?'btn-green':'btn-ghost'}`} onClick={()=>setT(x)} style={{flex: 1}}>{x}</button>
                            ))}
                        </div>

                        <label>{t === 'EMPRESTIMO' ? 'Taxa de Empréstimo (₣)' : 'Taxa de Transferência (₣)'}</label>
                        <input className="input-field" type="number" value={v} onChange={e=>setV(e.target.value)} />

                        {t === 'EMPRESTIMO' && (
                            <div className="card" style={{background: '#222', padding: '10px', marginTop: 10}}>
                                <label style={{fontSize: '11px'}}>Duração (Máx: {maxLoanAllowed} Temp.)</label>
                                <input 
                                    className="input-field" 
                                    type="number" 
                                    min="1" 
                                    max={maxLoanAllowed} 
                                    value={meta.loanDuration} 
                                    onChange={e=>{
                                        const val = parseInt(e.target.value);
                                        setMeta({...meta, loanDuration: val > maxLoanAllowed ? maxLoanAllowed : (val || 1)});
                                    }} 
                                />
                                
                                <div style={{margin: '10px 0', display: 'flex', alignItems: 'center', gap: 10}}>
                                    <label style={{fontSize: '11px'}}>Opção de Compra?</label>
                                    <button className={`btn ${hasBuyOption ? 'btn-green' : 'btn-ghost'}`} style={{width: '60px', padding: '5px', marginBottom:0}} onClick={() => setHasBuyOption(true)}>SIM</button>
                                    <button className={`btn ${!hasBuyOption ? 'btn-red' : 'btn-ghost'}`} style={{width: '60px', padding: '5px', marginBottom:0}} onClick={() => {setHasBuyOption(false); setMeta({...meta, buyOpt: 0});}}>NÃO</button>
                                </div>

                                {hasBuyOption && (
                                    <div>
                                        <label style={{fontSize: '11px'}}>Valor da Opção (₣)</label>
                                        <input className="input-field" type="number" value={meta.buyOpt} onChange={e=>setMeta({...meta, buyOpt: parseFloat(e.target.value)})} />
                                    </div>
                                )}

                                <label style={{marginTop:10, display:'block', fontSize: '11px'}}>Divisão Salarial (Comprador paga: {meta.salarySplit}%)</label>
                                <input type="range" min="0" max="100" step="10" value={meta.salarySplit} onChange={e=>setMeta({...meta, salarySplit: parseInt(e.target.value)})} style={{width:'100%', accentColor: 'var(--primary)'}} />
                            </div>
                        )}

                        {t === 'TROCA' && (
                            <div className="card" style={{background: '#222', padding: '10px', marginTop: 10}}>
                                <small style={{display:'block', marginBottom: 10}}>Selecionar jogadores (Máx 3):</small>
                                <div style={{maxHeight: '120px', overflowY: 'auto', display: 'flex', flexDirection: 'column', gap: 5}}>
                                    {(myPlayers || []).map(p => (
                                        <div key={p.id} onClick={() => toggleSwap(p.id)} style={{padding: '8px', borderRadius: '6px', fontSize: '11px', cursor: 'pointer', background: swaps.includes(p.id) ? 'var(--primary)' : '#333', color: swaps.includes(p.id) ? '#000' : '#fff', display: 'flex', justifyContent: 'space-between'}}>
                                            <span>{p.name}</span><b>OV: {p.overall}</b>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {t === 'COMPRA' && (
                            <div className="card" style={{background: '#222', padding: '10px', marginTop: 10}}>
                                <small>📦 PARCELAMENTO: <b>{meta.installments}x</b></small>
                                <input type="range" min="1" max="12" value={meta.installments} onChange={e=>setMeta({...meta, installments: parseInt(e.target.value)})} style={{width:'100%'}} />
                                <hr style={{borderColor: '#444', margin: '10px 0'}} />
                                <small>📈 REVENDA FUTURA: <b style={{color:'gold'}}>{meta.sellOn}%</b></small>
                                <input type="range" min="0" max="80" step="5" value={meta.sellOn} onChange={e=>setMeta({...meta, sellOn: parseInt(e.target.value)})} style={{width:'100%', accentColor: 'gold'}} />
                            </div>
                        )}
                    </div>
                ) : !isPreContract ? (
                    /* VISÃO BLOQUEADA (Normal) */
                    <div style={{background: 'rgba(0,230,118,0.05)', padding: 12, borderRadius: 8, marginBottom: 15, fontSize: 11, border: '1px solid var(--primary)'}}>
                        <b style={{color: 'gold', display: 'block', marginBottom: 5}}><i className="fas fa-lock"></i> ACORDO SELADO:</b>
                        <div style={{display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 5, color: '#ccc'}}>
                            <span>Tipo: <b>{isUrgentRenewal ? 'RENOVAÇÃO' : t}</b></span>
                            {!isUrgentRenewal && <span>Valor: <b>{fmt(v)}</b></span>}
                            {t === 'EMPRESTIMO' && <span>Duração: <b>{meta.loanDuration} Temp.</b></span>}
                            {t === 'COMPRA' && meta.sellOn > 0 && <span style={{color:'gold'}}>Revenda: <b>{meta.sellOn}%</b></span>}
                        </div>
                    </div>
                ) : null}

                {/* 2. TERMOS PESSOAIS (JOGADOR x COMPRADOR) */}
                <div>
                    <label style={{fontSize: '11px', color: 'cyan', fontWeight: 'bold'}}>2. CONTRATO PESSOAL DO ATLETA</label>
                    
                    <div style={{background: 'rgba(0,230,118,0.05)', padding: '10px', borderRadius: '8px', marginTop: 10, border: '1px dashed var(--primary)'}}>
                        <label style={{color: 'var(--primary)', fontWeight: 'bold', fontSize: '12px'}}>💰 Luvas / Bônus de Assinatura (₣)</label>
                        <input className="input-field" type="number" value={meta.signingBonus} onChange={e=>setMeta({...meta, signingBonus: parseFloat(e.target.value)})} />
                    </div>

                    {/* MOSTRADOR DE FAIXA SALARIAL */}
                    <div style={{marginTop: 10}}>
                        <label>Salário Semanal (₣)</label>
                        <div style={{fontSize:10, color:'#aaa', marginBottom:5}}>
                            Faixa Permitida: <span style={{color:'#2979FF', fontWeight:'bold'}}>{fmt(limits.minSal)} - {fmt(limits.maxSal)}</span>
                        </div>
                        <input className="input-field" type="number" value={sal} onChange={e=>setSal(e.target.value)} />
                    </div>

                    <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:10}}>
                        <div>
                            <label>{t === 'EMPRESTIMO' ? 'Duração (Fixo)' : 'Contrato (Anos)'}</label>
                            <input className="input-field" type="number" value={t === 'EMPRESTIMO' ? meta.loanDuration : con} disabled={t === 'EMPRESTIMO'} onChange={e=>setCon(e.target.value)} />
                        </div>
                        <div><label>Papel</label>
                            <select className="input-field" value={role} onChange={e=>setRole(e.target.value)}>
                                <option value="CRUCIAL">⭐ Crucial</option>
                                <option value="TITULAR">✅ Titular</option>
                                <option value="ROTACAO">🔄 Rotação</option>
                                <option value="RESERVA">💤 Reserva</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div style={{display:'flex', gap:10, marginTop:15}}>
                    <button className="btn btn-green" style={{flex: 2}} onClick={() => {
                        const finalSal = parseFloat(sal);
                        // --- TRAVA DE SALÁRIO NA NEGOCIAÇÃO ---
                        if (finalSal < limits.minSal || finalSal > limits.maxSal) {
                            return alert(`🚫 SALÁRIO INVÁLIDO!\nO valor deve estar entre ${fmt(limits.minSal)} e ${fmt(limits.maxSal)} para este jogador (Over ${target.overall}).`);
                        }

                        // Se for pré-contrato, o valor é 0
const finalVal = (isPreContract || isFreeAgent || isMyPlayer) ? 0 : v;
            onSend(target, t, finalVal, swaps, (t === 'EMPRESTIMO' ? meta.loanDuration : con), {...meta, hasBuyOption, newSalary: finalSal, role, status: 'PENDING'}, old);
                    }}>
                        {isCounter ? 'ENVIAR CONTRA-PROPOSTA' : (isMyPlayer ? 'OFERECER RENOVAÇÃO' : 'ENVIAR PROPOSTA')}
                    </button>
                    <button className="btn btn-red" style={{flex: 1}} onClick={()=>setModal(null)}>CANCELAR</button>
                </div>
            </div>
        </div>
    );
};

const ProductForm = ({ initial, onSave, onDelete, user }) => {

    const [p, setP] = useState(initial || { 
        name:'', 
        cat:'energy', 
        power:10, 
        price:'', 
        stock: 1, 
        desc:'' 
    });
    
    const isEditing = !!initial?.id;

    // =========================
    // 1️⃣ BASE ECONÔMICA POR CATEGORIA
    // =========================
    const getCategoryBaseCost = (cat) => {
        if (cat === 'energy') return 100;
        if (cat === 'training') return 500;
        if (cat === 'luxury') return 2000;
        return 100;
    };

    const getPowerMultiplier = (cat) => {
        if (cat === 'energy') return 12;
        if (cat === 'training') return 80;
        if (cat === 'luxury') return 400;
        return 10;
    };

    // =========================
    // 2️⃣ CÁLCULO UNITÁRIO INTELIGENTE
    // =========================
    const calculateUnitCost = (cat, power, quantity) => {

        const base = getCategoryBaseCost(cat);
        const multiplier = getPowerMultiplier(cat);
        const pwr = parseInt(power) || 0;

        let rawCost = base + (pwr * multiplier);

        // 🔥 Escalonamento por lote
        const escalationSteps = Math.floor(quantity / 10);
        const escalationPercent = escalationSteps * 0.02; // +2% a cada 10 unidades

        rawCost = rawCost * (1 + escalationPercent);

        return Math.ceil(rawCost);
    };

    // =========================
    // 3️⃣ QUANTIDADE SEGURA
    // =========================
    const quantityToProduce = Math.max(1, parseInt(p.stock) || 1);

    const unitCost = calculateUnitCost(p.cat, p.power, quantityToProduce);
    const totalProductionCost = unitCost * quantityToProduce;

    const companyBalance = user.data?.balance || 0;
    const hasEnoughMoney = companyBalance >= totalProductionCost;

    // =========================
    // 4️⃣ CONTROLES + / -
    // =========================
    const increaseQty = () => {
        if(quantityToProduce < 500) {
            setP({...p, stock: quantityToProduce + 1});
        }
    };

    const decreaseQty = () => {
        if(quantityToProduce > 1) {
            setP({...p, stock: quantityToProduce - 1});
        }
    };

    // =========================
    // 5️⃣ PRODUÇÃO SEGURA
    // =========================
    const handleProduction = async () => {

        if(!p.name || !p.price)
            return alert("Preencha Nome e Preço de Venda!");

        if(quantityToProduce <= 0)
            return alert("Quantidade inválida.");

        if(!hasEnoughMoney)
            return alert(`Saldo insuficiente! Necessário: ${fmt(totalProductionCost)}`);

        try {

            if (totalProductionCost > 0) {
                await db.collection('companies')
                    .doc(user.data.id)
                    .update({
                        balance: firebase.firestore.FieldValue.increment(-totalProductionCost)
                    });
            }

            const finalStockCount = isEditing 
                ? (parseInt(initial.stock || 0) + quantityToProduce)
                : quantityToProduce;

            onSave({
                ...p,
                stock: finalStockCount,
                productionCost: unitCost,
                lastProductionTotal: totalProductionCost
            });

        } catch (e) {
            alert("Erro ao processar produção: " + e.message);
        }
    };

    return (
        <div className="modal-bg">
            <div className="modal-content" style={{
                border: '2px solid var(--purple)', 
                boxShadow: '0 0 20px rgba(213,0,249,0.3)'
            }}>

                <h2 style={{marginTop:0, color:'var(--purple)'}}>
                    🏭 FÁBRICA DA EMPRESA
                </h2>

                {/* CONFIG ITEM */}
                <div style={{
                    background:'rgba(255,255,255,0.03)', 
                    padding:15, 
                    borderRadius:10, 
                    marginBottom:20
                }}>
                    <label>Nome do Produto</label>
                    <input 
                        className="input-field"
                        value={p.name}
                        onChange={e=>setP({...p, name:e.target.value})}
                        disabled={isEditing}
                    />

                    <label>Categoria</label>
                    <select 
                        className="input-field"
                        value={p.cat}
                        onChange={e=>setP({...p, cat:e.target.value})}
                        disabled={isEditing}
                    >
                        <option value="energy">⚡ Energia</option>
                        <option value="training">👟 Treino / XP</option>
                        <option value="luxury">💎 Luxo / Fama</option>
                    </select>

                    <label>
                        Potência: <b style={{color:'gold'}}>{p.power}</b>
                    </label>

                    <input 
                        type="range" 
                        min="1" 
                        max="100"
                        value={p.power}
                        onChange={e=>setP({...p, power: parseInt(e.target.value)})}
                        disabled={isEditing}
                    />
                </div>

                {/* QUANTIDADE */}
                <div style={{
                    background:'rgba(213, 0, 249, 0.08)',
                    padding:20,
                    borderRadius:12,
                    border:'1px solid var(--purple)',
                    marginBottom:20
                }}>
                    <h4 style={{marginTop:0}}>📦 PRODUÇÃO</h4>

                    <div style={{
                        display:'flex',
                        alignItems:'center',
                        justifyContent:'center',
                        gap:15,
                        marginBottom:15
                    }}>
                        <button className="btn btn-ghost" onClick={decreaseQty}>−</button>
                        <div style={{fontSize:22, fontWeight:'bold'}}>
                            {quantityToProduce}
                        </div>
                        <button className="btn btn-ghost" onClick={increaseQty}>+</button>
                    </div>

                    <input
                        type="number"
                        min="1"
                        max="500"
                        className="input-field"
                        value={quantityToProduce}
                        onChange={e=>setP({...p, stock: Math.max(1, parseInt(e.target.value) || 1)})}
                    />

                    <div style={{
                        marginTop:20,
                        fontSize:13
                    }}>
                        <div style={{display:'flex', justifyContent:'space-between'}}>
                            <span>Custo por unidade:</span>
                            <b>{fmt(unitCost)}</b>
                        </div>

                        <div style={{
                            display:'flex',
                            justifyContent:'space-between',
                            fontSize:18,
                            marginTop:10
                        }}>
                            <span>💰 TOTAL:</span>
                            <b style={{
                                color: hasEnoughMoney ? '#00E676' : '#FF1744'
                            }}>
                                {fmt(totalProductionCost)}
                            </b>
                        </div>
                    </div>
                </div>

                <label>Preço de Venda (₣)</label>
                <input 
                    type="number"
                    className="input-field"
                    value={p.price}
                    onChange={e=>setP({...p, price:e.target.value})}
                />

                <div style={{display:'flex', gap:10, marginTop:15}}>
                    <button 
                        className="btn btn-green"
                        disabled={!hasEnoughMoney}
                        onClick={handleProduction}
                        style={{flex:2}}
                    >
                        {isEditing 
                            ? `REPOR (+${quantityToProduce})`
                            : `PRODUZIR (-${fmt(totalProductionCost)})`
                        }
                    </button>

                    <button 
                        className="btn btn-ghost"
                        onClick={()=>onSave(null)}
                        style={{flex:1}}
                    >
                        CANCELAR
                    </button>
                </div>

            </div>
        </div>
    );
};

// --- COMPONENTES QUE FALTAVAM (Súmula e Tabela) ---

      
    const MatchPerformanceForm = ({ players, teams, onSaveStats, matchData }) => {
    const [mode, setMode] = useState('TEAM'); 
    
    // --- ESTADOS DO MODO SÚMULA RÁPIDA (TIME) ---
    const [selTeamId, setSelTeamId] = useState('');
    const [teamResult, setTeamResult] = useState('NENHUM');
    const [batchStats, setBatchStats] = useState({}); 

    // --- ESTADOS DO MODO INDIVIDUAL (ANTIGO) ---
    const [selP, setSelP] = useState(null);
    const [match, setMatch] = useState({ goals:0, assists:0, tackles:0, saves:0, yellows:0, reds:0, rating:'', result:'NENHUM', injuredType: 'NONE' }); 
    const [search, setSearch] = useState('');

    // --- LÓGICA DE SORTEIO DE LESÃO (SÚMULA) ---
    const rollInjury = (withAmbulance) => {
        const rand = Math.random() * 100;
        let cat = 'LEVE';
        let time = 1;

        if (withAmbulance) {
            // Se sair de ambulância: Lesões extremamente longas (Precisa de Médico urgente)
            if (rand < 10) { cat = 'LEVE'; time = Math.floor(Math.random() * 3) + 2; } // 2 a 4 jogos
            else if (rand < 35) { cat = 'MODERADA'; time = Math.floor(Math.random() * 4) + 5; } // 5 a 8 jogos
            else if (rand < 75) { cat = 'GRAVE'; time = Math.floor(Math.random() * 6) + 9; }    // 9 a 14 jogos
            else { cat = 'EXTREMA'; time = Math.floor(Math.random() * 11) + 15; }               // 15 a 25 jogos
        } else {
            // Se sair andando: Ainda machuca, mas um pouco menos
            if (rand < 50) { cat = 'LEVE'; time = Math.floor(Math.random() * 2) + 2; } // 2 a 3 jogos
            else if (rand < 85) { cat = 'MODERADA'; time = Math.floor(Math.random() * 3) + 4; } // 4 a 6 jogos
            else if (rand < 97) { cat = 'GRAVE'; time = Math.floor(Math.random() * 4) + 7; }    // 7 a 10 jogos
            else { cat = 'EXTREMA'; time = Math.floor(Math.random() * 5) + 12; }                // 12 a 16 jogos
        }

        const injuryList = INJURIES_DB[cat];
        const injuryName = injuryList[Math.floor(Math.random() * injuryList.length)];

        return { name: injuryName, time: time };
    };

    // --- LÓGICA DO MODO TIME ---
    const handleBatchChange = (pid, field, val) => {
        setBatchStats(prev => ({
            ...prev,
            [pid]: { ...prev[pid], [field]: val }
        }));
    };

    const submitBatch = () => {
        const payload = [];
        const teamPlayers = players.filter(p => p.teamId === selTeamId);
        
        teamPlayers.forEach(p => {
            const s = batchStats[p.id] || {};
            // Só adiciona se o jornalista tiver dado pelo menos a NOTA
            if (s.rating && s.rating !== '') {
                let injuryData = null;
                // Se marcou que lesionou
                if (s.injuredType && s.injuredType !== 'NONE') {
                    injuryData = rollInjury(s.injuredType === 'AMBULANCE');
                }

                payload.push({
                    player: p,
                    match: {
                        goals: parseInt(s.goals || 0),
                        assists: parseInt(s.assists || 0),
                        tackles: parseInt(s.tackles || 0),
                        saves: parseInt(s.saves || 0),
                        yellows: parseInt(s.yellows || 0),
                        reds: parseInt(s.reds || 0),
                        rating: parseFloat(s.rating),
                        result: teamResult,
                        // Novos campos de lesão
                        injury: injuryData ? injuryData.name : null,
                        recoveryLeft: injuryData ? injuryData.time : 0
                    }
                });
            }
        });

        if (payload.length === 0) return alert("Preencha a NOTA de pelo menos um jogador para salvar.");
        
        if (confirm(`Confirmar súmula para ${payload.length} jogadores?`)) {
            const homeTeamObj = matchData ? teams.find(t => t.id === matchData.homeId) : null;
            if (homeTeamObj && selTeamId === homeTeamObj.id) {
                onSaveStats(payload, null, undefined, homeTeamObj, matchData);
            } else {
                onSaveStats(payload, null, undefined, null, matchData); 
            }
        }
    };

    const filtered = players.filter(p => p.name.toLowerCase().includes(search.toLowerCase()));

    // --- RENDERIZAÇÃO ---
    return (
        <div style={{minHeight: 400}}>
            <h3 style={{color:'var(--primary)', marginTop:0}}>Lançar Desempenho</h3>
            
            <div style={{display:'flex', gap:10, marginBottom:15}}>
                <button className={`btn ${mode==='TEAM'?'btn-blue':'btn-ghost'}`} onClick={()=>setMode('TEAM')}>POR TIME (RÁPIDO)</button>
                <button className={`btn ${mode==='SEARCH'?'btn-purple':'btn-ghost'}`} onClick={()=>setMode('SEARCH')}>BUSCA INDIVIDUAL</button>
            </div>

            {/* === MODO 1: SÚMULA POR TIME (TABELA DETALHADA) === */}
            {mode === 'TEAM' && (
                <div>
                    <div style={{display:'flex', gap:10, marginBottom:10}}>
                        <div style={{flex:1}}>
                            <label style={{fontSize:10}}>Selecione o Time</label>
                            {matchData ? (
                                <div style={{display:'flex', gap:5}}>
                                    <button className={`btn ${selTeamId===matchData.homeId?'btn-green':'btn-ghost'}`} style={{margin:0, padding:'8px', fontSize:11}} onClick={()=>setSelTeamId(matchData.homeId)}>🏠 {matchData.homeName}</button>
                                    <button className={`btn ${selTeamId===matchData.awayId?'btn-green':'btn-ghost'}`} style={{margin:0, padding:'8px', fontSize:11}} onClick={()=>setSelTeamId(matchData.awayId)}>✈️ {matchData.awayName}</button>
                                </div>
                            ) : (
                                <select className="input-field" value={selTeamId} onChange={e=>setSelTeamId(e.target.value)}>
                                    <option value="">-- Escolha --</option>
                                    {teams.filter(t=>t.status!=='PENDING').map(t=><option key={t.id} value={t.id}>{t.name}</option>)}
                                </select>
                            )}
                        </div>
                        <div style={{width:120}}>
                        
                            <label style={{fontSize:10}}>Resultado Geral</label>
                            <select className="input-field" value={teamResult} onChange={e=>setTeamResult(e.target.value)}>
                                <option value="NENHUM">Neutro</option>
                                <option value="VITORIA">Vitória</option>
                                <option value="EMPATE">Empate</option>
                                <option value="DERROTA">Derrota</option>
                            </select>
                        </div>
                    </div>

                    {selTeamId && (
                        <div>
                            <div style={{maxHeight:'350px', overflowY:'auto', border:'1px solid #333', borderRadius:5}}>
                                <table style={{width:'100%', borderCollapse:'collapse', fontSize:10}}>
                                    <thead style={{background:'#222', position:'sticky', top:0, zIndex:2}}>
                                        <tr>
                                            <th style={{padding:5, textAlign:'left'}}>Jogador</th>
                                            <th style={{padding:2, width:35, textAlign:'center', color:'gold'}}>Nota</th>
                                            <th style={{padding:2, width:30, textAlign:'center'}}>GOL</th>
                                            <th style={{padding:2, width:30, textAlign:'center'}}>ASS</th>
                                            <th style={{padding:2, width:110, textAlign:'center', color:'#ff1744'}}>Ocorreu Lesão?</th>
                                            <th style={{padding:2, width:30, textAlign:'center', color:'orange'}}>DES</th>
                                            <th style={{padding:2, width:30, textAlign:'center', color:'cyan'}}>DEF</th>
                                            <th style={{padding:2, width:30, textAlign:'center', color:'yellow'}}>AMA</th>
                                            <th style={{padding:2, width:30, textAlign:'center', color:'red'}}>VER</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {players.filter(p => p.teamId === selTeamId).map(p => {
                                            const s = batchStats[p.id] || {};
                                            const hasData = s.rating && s.rating !== '';
                                            const isGK = p.position === 'GOL';

                                            return (
                                                <tr key={p.id} style={{background: hasData ? 'rgba(0,255,0,0.08)' : 'transparent', borderBottom:'1px solid #333'}}>
                                                    <td style={{padding:5}}>
                                                        <b>{p.name} {p.recoveryLeft > 0 ? '❌' : ''}</b><br/>
                                                        <span style={{color:'#888', fontSize:9}}>{p.position}</span>
                                                    </td>
                                                    <td style={{padding:2}}>
                                                        <input className="input-field" type="number" step="0.1" style={{marginBottom:0, padding:2, textAlign:'center', height:25, borderColor: hasData ? 'lime' : '#444'}} 
                                                            placeholder="-" 
                                                            value={s.rating || ''}
                                                            onChange={e=>handleBatchChange(p.id, 'rating', e.target.value)}
                                                        />
                                                    </td>
                                                    <td style={{padding:2}}>
                                                        <input className="input-field" type="number" style={{marginBottom:0, padding:2, textAlign:'center', height:25}} 
                                                            placeholder="0"
                                                            onChange={e=>handleBatchChange(p.id, 'goals', e.target.value)}
                                                        />
                                                    </td>
                                                    <td style={{padding:2}}>
                                                        <input className="input-field" type="number" style={{marginBottom:0, padding:2, textAlign:'center', height:25}} 
                                                            placeholder="0"
                                                            onChange={e=>handleBatchChange(p.id, 'assists', e.target.value)}
                                                        />
                                                    </td>
                                                    <td style={{padding:2}}>
                                                        <select className="input-field" style={{marginBottom:0, fontSize:9, padding:2, background: s.injuredType && s.injuredType !== 'NONE' ? '#440000' : 'var(--bg-input)'}} onChange={e=>handleBatchChange(p.id, 'injuredType', e.target.value)}>
                                                            <option value="NONE">✅ Saudável</option>
                                                            <option value="WALKING">🚶 Lesão s/ Ambulância</option>
                                                            <option value="AMBULANCE">🚑 Lesão c/ Ambulância</option>
                                                        </select>
                                                    </td>
                                                    <td style={{padding:2}}>
                                                        <input className="input-field" type="number" 
                                                            style={{marginBottom:0, padding:2, textAlign:'center', height:25, background: isGK ? '#111' : 'var(--bg-input)', color:'orange', opacity: isGK ? 0.3 : 1}} 
                                                            placeholder="0" 
                                                            disabled={isGK}
                                                            onChange={e=>handleBatchChange(p.id, 'tackles', e.target.value)} 
                                                        />
                                                    </td>
                                                    <td style={{padding:2}}>
                                                        <input className="input-field" type="number" 
                                                            style={{marginBottom:0, padding:2, textAlign:'center', height:25, background: !isGK ? '#111' : 'var(--bg-input)', color:'cyan', opacity: !isGK ? 0.3 : 1}} 
                                                            placeholder="0" 
                                                            disabled={!isGK}
                                                            onChange={e=>handleBatchChange(p.id, 'saves', e.target.value)} 
                                                        />
                                                    </td>
                                                    <td style={{padding:2}}>
                                                        <input className="input-field" type="number" style={{marginBottom:0, padding:2, textAlign:'center', height:25, color:'yellow'}} 
                                                            placeholder="0"
                                                            onChange={e=>handleBatchChange(p.id, 'yellows', e.target.value)}
                                                        />
                                                    </td>
                                                    <td style={{padding:2}}>
                                                        <input className="input-field" type="number" style={{marginBottom:0, padding:2, textAlign:'center', height:25, color:'red'}} 
                                                            placeholder="0"
                                                            onChange={e=>handleBatchChange(p.id, 'reds', e.target.value)}
                                                        />
                                                    </td>
                                                </tr>
                                            );
                                        })}
                                    </tbody>
                                </table>
                            </div>
                            <button className="btn btn-green" style={{marginTop:15, padding:15}} onClick={submitBatch}>
                                💾 SALVAR SÚMULA COMPLETA
                            </button>
                        </div>
                    )}
                </div>
            )}

            {/* === MODO 2: BUSCA INDIVIDUAL (Mantido e Corrigido) === */}
           {mode === 'SEARCH' && (
                <div>
                    {!selP ? (
                        <div>
                            <input className="input-field" placeholder="Buscar jogador..." value={search} onChange={e=>setSearch(e.target.value)} />
                            <div style={{maxHeight:300, overflowY:'auto'}}>
                                {search.length > 0 && filtered.map(p => (
                                    <div key={p.id} className="card" onClick={()=>{setSelP(p); setMatch({goals:0, assists:0, tackles:0, saves:0, yellows:0, reds:0, rating:'', result:'NENHUM', injuredType: 'NONE'});}}>
                                        <b>{p.name} {p.recoveryLeft > 0 ? '❌' : ''}</b> <small>({teams.find(t=>t.id===p.teamId)?.name})</small>
                                    </div>
                                ))}
                            </div>
                        </div>
                    ) : (
                        <div>
                            <h4 style={{color:'var(--primary)', margin:'0 0 10px 0'}}>Súmula: {selP.name}</h4>
                            <div style={{background:'rgba(255,255,255,0.05)', padding:10, borderRadius:8, marginBottom:10}}>
                                <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:10}}>
                                    <div><label>⚽ Gols</label><input className="input-field" type="number" value={match.goals} onChange={e=>setMatch({...match, goals:parseInt(e.target.value)})} /></div>
                                    <div><label>👟 Assist</label><input className="input-field" type="number" value={match.assists} onChange={e=>setMatch({...match, assists:parseInt(e.target.value)})} /></div>
                                    <div><label>🛡️ Desar</label><input className="input-field" type="number" value={match.tackles} onChange={e=>setMatch({...match, tackles:parseInt(e.target.value)})} /></div>
                                    <div><label>🧤 Defes</label><input className="input-field" type="number" value={match.saves} onChange={e=>setMatch({...match, saves:parseInt(e.target.value)})} /></div>
                                    <div><label>🟨 Amar</label><input className="input-field" type="number" value={match.yellows} onChange={e=>setMatch({...match, yellows:parseInt(e.target.value)})} /></div>
                                    <div><label>🟥 Verm</label><input className="input-field" type="number" value={match.reds} onChange={e=>setMatch({...match, reds:parseInt(e.target.value)})} /></div>
                                </div>
                                <hr style={{borderColor:'#444'}}/>
                                
                                {/* --- SELETOR DE LESÃO NO MODO INDIVIDUAL --- */}
                                <div style={{marginBottom:10, border:'1px dashed #ff1744', padding:5, borderRadius:5}}>
                                    <label style={{color:'#ff1744', fontSize:11}}>🚑 Ocorreu Lesão?</label>
                                    <select className="input-field" value={match.injuredType} onChange={e=>setMatch({...match, injuredType:e.target.value})}>
                                        <option value="NONE">✅ Não</option>
                                        <option value="WALKING">🚶 Sim (Leve/Moderada)</option>
                                        <option value="AMBULANCE">🚑 Sim (Grave/Ambulância)</option>
                                    </select>
                                </div>

                                <label>⭐ Nota (0.0 - 10.0)</label>
                                <input className="input-field" type="number" step="0.1" value={match.rating} onChange={e=>setMatch({...match, rating:e.target.value})} />
                                <label>🚩 Resultado</label>
                                <select className="input-field" value={match.result} onChange={e=>setMatch({...match, result:e.target.value})}>
                                    <option value="NENHUM">Neutro</option>
                                    <option value="VITORIA">Vitória</option>
                                    <option value="EMPATE">Empate</option>
                                    <option value="DERROTA">Derrota</option>
                                </select>
                            </div>
                            <div style={{display:'flex', gap:10}}>
                                <button className="btn btn-green" onClick={()=>{
                                    let finalMatch = {...match};
                                    // Processa a lesão no modo individual
                                    if(match.injuredType && match.injuredType !== 'NONE') {
                                        const inj = rollInjury(match.injuredType === 'AMBULANCE');
                                        finalMatch.injury = inj.name;
                                        finalMatch.recoveryLeft = inj.time;
                                    }
                                    onSaveStats([{ player: selP, match: finalMatch }]);
                                }}>LANÇAR</button>
                                <button className="btn" onClick={()=>setSelP(null)}>VOLTAR</button>
                            </div>
                        </div>
                    )}
                </div>
            )}
        </div>
    );
};

                            <div style={{textAlign:'center'}}><small>E</small><input className="input-field" type="number" style={{width:40, padding:5, marginBottom:0}} defaultValue={t.stats?.draws||0} id={`d-${t.id}`} /></div>
                            <div style={{textAlign:'center'}}><small>D</small><input className="input-field" type="number" style={{width:40, padding:5, marginBottom:0}} defaultValue={t.stats?.losses||0} id={`l-${t.id}`} /></div>
