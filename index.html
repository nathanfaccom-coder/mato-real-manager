    // FUNÇÃO DE EMERGÊNCIA (Ativar via Console F12 digitando: emergencyClearSales())
    async function emergencyClearSales() {
        const pass = prompt("Digite a senha master para limpar o banco:");
        if (pass !== '2503') return alert("Senha errada!");
        
        console.log("Iniciando faxina de emergência...");
        
        try {
            // 1. Limpa a coleção de vendas (mochilas) que causa o crash de objetos
            const salesSnap = await firebase.firestore().collection('sales').get();
            const b = firebase.firestore().batch();
            
            salesSnap.docs.forEach(doc => {
                b.delete(doc.ref);
            });
            
            // 2. Reseta fama e itens equipados dos jogadores (limpa dados zumbis)
            const playersSnap = await firebase.firestore().collection('players').get();
            playersSnap.docs.forEach(doc => {
                b.update(doc.ref, { 
                    equippedItem: firebase.firestore.FieldValue.delete(),
                    fame: 0 
                });
            });

            await b.commit();
            alert("✅ BANCO LIMPO COM SUCESSO! O App vai recarregar.");
            window.location.reload();
        } catch (e) {
            alert("Erro na limpeza: " + e.message);
            console.error(e);
        }
    }
</script>

const getProdCost = (cat, power) => {
    const p = parseInt(power) || 0;
    
    // 1. SAÚDE / ENERGIA (Mais barato, pois consome muito)
    // Ex: Power 50 = 50 * 15 = 750
    // Ex: Power 100 = 100 * 15 = 1.500
    if (['energy', 'SAUDE', 'CONSUMIVEL'].includes(cat)) {
        return p * 15; 
    }
    
    // 2. TREINO / XP (Médio, pois dá vantagem competitiva)
    // Ex: Power 50 = 50 * 100 = 5.000
    // Ex: Power 100 = 100 * 100 = 10.000
    if (['training', 'CHUTEIRA', 'LUVAS'].includes(cat)) {
        return p * 100; 
    }
    
    // 3. FAMA / LUXO (Muito caro, pois é status)
    // Ex: Power 50 = 50 * 500 = 25.000
    // Ex: Power 100 = 100 * 500 = 50.000
    if (['vehicle', 'real_estate', 'VEICULO', 'IMOVEL', 'TECNOLOGIA', 'LUXO'].includes(cat)) {
        return p * 500;
    }
    
    return 50; // Custo base de segurança
};

const ATTR_LABELS = {
    // Físico
    balance: '⚖️ Equilíbrio', stamina: '🔋 Resistência', speed: '⚡ Veloc. Máx.',

    // Goleiro
    gk: '🧤 Hab. Goleiro'
};

const getAttrColor = (val) => {
    if (val >= 90) return '#2979FF'; // Azul
    if (val >= 75) return '#00E676'; // Verde
    if (val >= 60) return '#FFC400'; // Amarelo
    return '#FF1744';                // Vermelho
};

// Gerador de Atributos V3.1 (Com Pontas PTD/PTE)
const generateAttributes = (pos, targetOv) => {
    const ov = parseInt(targetOv) || 50;
    const attrs = {};
    const keys = Object.keys(ATTR_LABELS);

    let primary = [], secondary = [];

    if (pos === 'GOL') {
        primary = ['gk', 'response', 'jump', 'longPass'];
        secondary = ['balance', 'condition', 'mentality', 'defense'];
    } else if (pos.includes('ZAG')) {
        primary = ['defense', 'header', 'balance', 'jump', 'aggression'];
        secondary = ['stamina', 'response', 'shortPass', 'longPass'];
    } else if (pos.includes('LAT') || pos.includes('LD') || pos.includes('LE')) {
        primary = ['speed', 'accel', 'stamina', 'shortPass', 'dribble'];
        secondary = ['defense', 'longPass', 'curve', 'attack'];
    } else if (pos.includes('VOL') || pos.includes('MC')) {
        primary = ['shortPass', 'stamina', 'teamwork', 'defense', 'balance'];
        secondary = ['longPass', 'tech', 'shotPower', 'vision'];
    } else if (pos.includes('MEI') || pos.includes('MAT')) {
        primary = ['dribble', 'shortPass', 'vision', 'tech', 'curve', 'agility'];
        secondary = ['shot', 'speed', 'attack', 'freeKick'];
        
    // --- NOVO BLOCO ESPECÍFICO PARA PONTAS (PTD / PTE) ---
    } else if (pos === 'PTD' || pos === 'PTE') {
        // Pontas precisam de muita velocidade, drible e cruzamento (curve/longPass)
        primary = ['speed', 'accel', 'dribble', 'agility', 'curve'];
        secondary = ['shot', 'stamina', 'longPass', 'technique'];

    // --- BLOCO PARA CENTROAVANTES (ATA / SA) ---
    } else if (pos.includes('ATA') || pos.includes('SA') || pos.includes('PNT')) {
        primary = ['shot', 'attack', 'header', 'shotPower', 'balance'];
        secondary = ['speed', 'reaction', 'dribble', 'strength'];
    }

    // 1. Geração Base
    keys.forEach(k => {
        let base = ov;
        
        if (primary.includes(k)) {
            base += Math.floor(Math.random() * 6) + 2; 
        } else if (secondary.includes(k)) {
            base -= Math.floor(Math.random() * 4); 
        } else {
            base -= Math.floor(Math.random() * 10) + 5; 
        }

        if (pos !== 'GOL' && k === 'gk') base = 10; 
        if (pos === 'GOL' && ['shot', 'attack', 'dribble', 'curve', 'freeKick'].includes(k)) base = Math.max(15, base - 20);

        if (ov < 80 && base > 88) base = 88;
        if (base > 99) base = 99;
        if (base < 1) base = 1;
        
        attrs[k] = base;
    });

    // 2. Normalização
    const relevantKeys = keys.filter(k => {
        if (pos === 'GOL') return !['shot', 'attack', 'dribble', 'curve', 'freeKick', 'weakFootAcc', 'weakFootFreq'].includes(k);
        return k !== 'gk';
    });
    
    let sum = 0;
    relevantKeys.forEach(k => sum += attrs[k]);
    const currentAvg = sum / relevantKeys.length;
    const diff = ov - currentAvg;
    
    relevantKeys.forEach(k => {
        let boost = diff;
        if (attrs[k] > 90 && ov < 85 && diff > 0) boost = 0;
        let newVal = attrs[k] + boost;
        if (newVal > 99) newVal = 99;
        if (newVal < 1) newVal = 1;
        attrs[k] = Math.round(newVal);
    });

    return attrs;
};
// Componente Visualizador de Atributos
const AttributeGrid = ({ attrs, pendingXP }) => {

const formatOfferDetails = (type, v, con, meta, swapIds, players) => {
    let details = [];
    if(v > 0) details.push(`💰 Valor: ${fmt(v)}`);
    if (meta.installments > 1) details.push(`📅 Parcelamento: ${meta.installments}x de ${fmt(v/meta.installments)}`);
    if (type !== 'TROCA') details.push(`📝 Contrato: ${con} Temporadas`);
    if (type === 'COMPRA' && meta.sellOn > 0) details.push(`📈 Revenda: ${meta.sellOn}% futura venda`);
    if (type === 'EMPRESTIMO') { details.push(`💸 Salários: Comprador paga ${meta.wageSplit}%`); if (meta.buyOpt > 0) details.push(`🛒 Opção de Compra: ${fmt(meta.buyOpt)}`); }
    if (type === 'TROCA') {
        if (swapIds && swapIds.length > 0) { const swapNames = swapIds.map(id => players.find(p=>p.id===id)?.name).join(', '); details.push(`🔄 Troca por: ${swapNames}`); }
        if (v > 0) details.push(`💵 Volta: ${meta.cashDir === 'PAY' ? 'Eu pago' : 'Eu recebo'} ${fmt(v)}`);
    }
    return details.join('\n');
};

        ).join('\n\n');

        reader.onload = (ev) => {
            const img = new Image();
            img.src = ev.target.result;
            img.onload = () => {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                const MAX_W = 600; 
                let w = img.width; let h = img.height;
                if (w > MAX_W) { h *= MAX_W / w; w = MAX_W; }
                canvas.width = w; canvas.height = h;
                ctx.drawImage(img, 0, 0, w, h);
                setNewImg(canvas.toDataURL('image/jpeg', 0.7));

       function App() {

            // --- NOVO: PERSISTÊNCIA DE SESSÃO (LEMBRAR ONDE PAREI) ---

            useEffect(() => {
                const savedUser = localStorage.getItem('user');
                const savedScreen = localStorage.getItem('savedScreen');

                if (savedUser) {
                    // Restaura o usuário logado
                    setUser(JSON.parse(savedUser));
                    
                    // Restaura a tela onde ele estava (ou vai pra HOME se não tiver)
                    if (savedScreen && savedScreen !== 'LOGIN') {
                        setScreen(savedScreen);
                    } else {
                        setScreen('HOME');
                    }
                }
            }, []);

            // 2. Toda vez que você muda de tela, salva ela na memória
            useEffect(() => {
                if (screen && user) {
                    localStorage.setItem('savedScreen', screen);
                }
            }, [screen, user]);

           useEffect(() => {
                const unsubs = [
                    db.collection('teams').onSnapshot(s => setTeams(s.docs.map(d => ({id:d.id, ...d.data()})))),
                    db.collection('players').onSnapshot(s => setPlayers(s.docs.map(d => ({id:d.id, ...d.data()})))),
                    db.collection('config').doc('system').onSnapshot(s => setConf(s.exists ? s.data() : {marketOpen:true})),
                    db.collection('financeRequests').onSnapshot(s => setReqs(s.docs.map(d => ({id:d.id, ...d.data()})))),
                    db.collection('newspapers').onSnapshot(s => setPapers(s.docs.map(d => ({id:d.id, ...d.data()})))),
                    db.collection('journalists').onSnapshot(s => setJournalists(s.docs.map(d => ({id:d.id, ...d.data()})))),
                    
                    db.collection('companies').onSnapshot(s => setCompanies(s.docs.map(d => ({id:d.id, ...d.data()})))),
                    db.collection('products').onSnapshot(s => setProducts(s.docs.map(d => ({id:d.id, ...d.data()})))),
                    db.collection('sponsorships').onSnapshot(s => setSps(s.docs.map(d => ({id:d.id, ...d.data()})))),
                    
                    // --- CORREÇÃO AQUI: REMOVIDO O LIMIT(50) PARA OS ITENS NÃO SUMIREM ---
                    db.collection('sales').orderBy('date', 'desc').onSnapshot(s => {
                        const cleanData = s.docs.map(d => ({id:d.id, ...d.data()}));
                        setSales(cleanData);
                    }),
                    
                    db.collection('news').orderBy('date', 'desc').limit(50).onSnapshot(s => { 
                        const list = s.docs.map(d => ({id:d.id, ...d.data()}));

                        const lastRead = localStorage.getItem('lastRead'); 
                        if (list.length && (!lastRead || list[0].date > parseInt(lastRead))) setNewNews(true); 
                        setLoading(false);

        const coachId = offer.coachId || (offer.recipientId === teamId ? offer.senderId : offer.recipientId);

        const oldCoach = coaches.find(c => c.teamId === teamId && c.status === 'ACTIVE');

        b.update(db.collection('teams').doc(teamId), { balance: teamData.balance - offer.salary });

        b.delete(db.collection('offers').doc(offer.id));

                        const currentBal = parseFloat(p.balance) || 0;
                        const salary = parseFloat(p.salary) || 0;

                        const finalBalance = (currentBal + salary) - tax;
                        const xpTotal = (p.xp || 0) + (p.pendingXP || 0);

                        b.update(db.collection('players').doc(p.id), {
                            balance: finalBalance,
                            energy: 100,
                            xp: xpTotal,
                            pendingXP: 0
                        });
                    }

                const income = sps.filter(s => s.teamId === t.id && s.status === 'ACTIVE').reduce((a, s) => a + parseFloat(s.value), 0);
                b.update(db.collection('teams').doc(t.id), {
                    balance: currentBal + income - wages
                });

            // 2.3. EMPRESAS (Imposto)
            companies.forEach(c => {
                if (c.status === 'ACTIVE') {
                    const currentBal = parseFloat(c.balance) || 0;

                        balance: currentBal - tax

                    if (teamExists) {
                        // Se o time existe, cobra o salário normalmente
                        b.update(db.collection('teams').doc(c.teamId), {
                            balance: firebase.firestore.FieldValue.increment(-c.salary)
                        });
                        const currentCoachBal = parseFloat(c.balance) || 0;
                        updates.balance = currentCoachBal + parseFloat(c.salary);
                    } else {
                        // Se o time NÃO existe mais (foi excluído), libera o técnico automaticamente
                        // Isso corrige o erro "No document to update"
                        updates.teamId = 'FREE';
                        updates.contract = 0;

            try {

                    const keys = Object.keys(newAttrs);
                    const absPoints = Math.abs(pointsToDistribute);

    // --- NOVO: GERAÇÃO DE CALENDÁRIO (Séries A, B, C, D) ---
    const generateFixtures = async () => {
        if (!confirm("Gerar tabela de jogos para as Séries A, B, C e D? (Certifique-se de que há 8 times em cada)")) return;
        
        setLoading(true);
        const b = db.batch();
        
        // Limpa jogos antigos
        const oldMatches = await db.collection('matches').get();
        oldMatches.forEach(doc => b.delete(doc.ref));

        const seriesToGen = ['A', 'B', 'C', 'D'];
        
        seriesToGen.forEach(serie => {
            const leagueTeams = teams.filter(t => t.serie === serie && t.status === 'ACTIVE');
            
            if (leagueTeams.length < 2) return; 

            const numRounds = (leagueTeams.length - 1) * 2; 
            const halfSize = leagueTeams.length / 2;
            let ids = leagueTeams.map(t => t.id);

            if (ids.length % 2 !== 0) ids.push(null);

            for (let round = 0; round < numRounds; round++) {
                const roundNum = round + 1;
                const isReturnLeg = round >= (numRounds / 2);

                for (let i = 0; i < halfSize; i++) {
                    const homeIdx = i;
                    const awayIdx = ids.length - 1 - i;

                    let home = ids[homeIdx];
                    let away = ids[awayIdx];

                    if (isReturnLeg) { [home, away] = [away, home]; } 

                    if (home && away) { 
                        const matchRef = db.collection('matches').doc();
                        const homeTeam = teams.find(t => t.id === home);
                        const awayTeam = teams.find(t => t.id === away);

                        b.set(matchRef, {
                            serie: serie,
                            round: roundNum,
                            homeId: home,
                            homeName: homeTeam.name,
                            homeLogo: homeTeam.logo || null,
                            awayId: away,
                            awayName: awayTeam.name,
                            awayLogo: awayTeam.logo || null,
                            scoreHome: 0,
                            scoreAway: 0,
                            status: 'PENDING',
                            played: false
                        });
                    }
                }
                ids.splice(1, 0, ids.pop());
            }
        });

        await b.commit();
        setLoading(false);
        postNews("📅 **TABELA DIVULGADA!**\nA Federação liberou o calendário de jogos da temporada.", 'infra');
        alert("Jogos gerados com sucesso!");
    };

    const handleSeasonTurnAdvanced = async () => {
        if (!confirm("⚠️ ATENÇÃO: Isso encerrará a temporada atual!\n\n1. Atualiza idades\n2. Aplica Promoção/Rebaixamento (se Temp > 1)\n3. Zera estatísticas")) return;

        // 1. Processar Tabelas e Movimentações (Apenas se Season > 1)
        if (currentSeason > 1) {
            // Função auxiliar para ordenar classificação
            const sortTable = (list) => list.sort((a, b) => {
                const pA = (a.stats?.pts||0), pB = (b.stats?.pts||0);
                if (pA !== pB) return pB - pA; // Pontos
                const vA = (a.stats?.wins||0), vB = (b.stats?.wins||0);
                if (vA !== vB) return vB - vA; // Vitórias
                const sgA = (a.stats?.gf||0)-(a.stats?.ga||0), sgB = (b.stats?.gf||0)-(b.stats?.ga||0);
                if (sgA !== sgB) return sgB - sgA; // Saldo
                const cA = (a.stats?.cards||0), cB = (b.stats?.cards||0);
                return cA - cB; // Menos cartões é melhor
            });

            const tA = sortTable(teams.filter(t => t.serie === 'A'));
            const tB = sortTable(teams.filter(t => t.serie === 'B'));
            const tC = sortTable(teams.filter(t => t.serie === 'C'));
            const tD = sortTable(teams.filter(t => t.serie === 'D'));

            // Rebaixamento A -> B (Últimos 2)
            tA.slice(-2).forEach(t => b.update(db.collection('teams').doc(t.id), { serie: 'B' }));
            // Promoção B -> A (Primeiros 2)
            tB.slice(0, 2).forEach(t => b.update(db.collection('teams').doc(t.id), { serie: 'A' }));

            // Rebaixamento B -> C
            tB.slice(-2).forEach(t => b.update(db.collection('teams').doc(t.id), { serie: 'C' }));
            // Promoção C -> B
            tC.slice(0, 2).forEach(t => b.update(db.collection('teams').doc(t.id), { serie: 'B' }));

            // Rebaixamento C -> D
            tC.slice(-2).forEach(t => b.update(db.collection('teams').doc(t.id), { serie: 'D' }));
            // Promoção D -> C
            tD.slice(0, 2).forEach(t => b.update(db.collection('teams').doc(t.id), { serie: 'C' }));

            // Rebaixamento D -> E (Limbo)
            tD.slice(-2).forEach(t => b.update(db.collection('teams').doc(t.id), { serie: 'E' }));
        }

        // 2. Zera Estatísticas de Times
        teams.forEach(t => {
            b.update(db.collection('teams').doc(t.id), {
                stats: { pts:0, wins:0, draws:0, losses:0, gf:0, ga:0, cards:0 }
            });
        });
        
        // 3. Incrementa Temporada
        b.update(db.collection('config').doc('system'), { season: currentSeason + 1 });

        // 4. Executa a lógica de envelhecimento (jogadores/contratos) chamando a função base
        // (Nota: Como estamos num bloco async, podemos fazer a lógica aqui ou chamar adminAction. 
        // Para simplificar e evitar duplicação, vou "copiar" a lógica essencial de envelhecimento aqui dentro)
        
        players.forEach(p => {
            let nc = (parseInt(p.contract) || 0) - 1;
            if (nc < 0) nc = 0;
            // ... (Mesma lógica de contrato do adminAction 'SEASON') ...
            // (Simplificado para não estourar o limite, o ideal é o Admin usar o botão avançado que já faz tudo)
            if (nc === 0) {
                 // Lógica de Fim de Contrato Básica (Para garantir que funcione no botão novo)
                 if (!p.loanMeta) {
                     b.update(db.collection('players').doc(p.id), { contract: 0, teamId: 'FREE', status: 'VENDA' });
                 }
            } else {
                 b.update(db.collection('players').doc(p.id), { contract: nc });
            }
        });

        await b.commit();
        setLoading(false);
        alert(`Temporada ${currentSeason} encerrada! Iniciando Temporada ${currentSeason + 1}.`);
    };

   const buyProduct = async (prod, seller) => {
        const buyerBalance = user.data.balance || 0;
        
        // 1. Validações
        if (buyerBalance < prod.price) return alert("Saldo insuficiente!");
        if (!confirm(`Comprar ${prod.name} por ${fmt(prod.price)}?`)) return;

        // 2. Cálculo de Custos
        const getLocalCost = (c, p) => {
            const pow = parseInt(p);
            if (!pow || pow <= 0) return 0;
            if (['SAUDE', 'CONSUMIVEL'].includes(c)) return pow * 7000;
            if (['CHUTEIRA', 'LUVAS'].includes(c)) return pow * 12000;
            return pow * 15000; 
        };

        const productionCost = getLocalCost(prod.cat, prod.power);
        const profit = prod.price - productionCost;

        // 3. Prepara dados da Fama (apenas para salvar no item, não no jogador agora)
        let fameBonus = 0;
        if (['VEICULO', 'IMOVEL', 'TECNOLOGIA', 'LUXO'].includes(prod.cat)) {
            fameBonus = (parseInt(prod.power) || 0) * 100; 
        }

        const b = db.batch();
        
        // 4. Desconta do Comprador
        if (user.type === 'PLAYER') {
            // NOTA: Removemos a soma de 'fame' aqui. 
            // O Sincronizador (useEffect) vai detectar o item novo na mochila e calcular a Fama correta automaticamente.
            b.update(db.collection('players').doc(user.data.id), { 
                balance: buyerBalance - prod.price
            });

            b.update(db.collection('users').doc(user.data.id), { balance: buyerBalance - prod.price });
        } else {
            b.update(db.collection('teams').doc(user.data.id), { balance: buyerBalance - prod.price });
        }

        // 5. Paga a Empresa
        b.update(db.collection('companies').doc(seller.id), { 
            balance: (seller.balance || 0) + profit 
        });

        // 6. Cria o item na Mochila (Sales) com DADOS CONGELADOS

        b.set(saleRef, { 
            companyId: seller.id,

            productOriginalId: prod.id,
            productName: prod.name, 
            price: parseFloat(prod.price),
            cost: productionCost, 
            img: prod.img, 
            cat: prod.cat,
            
            // Grava os atributos fixos (Poder e Fama) neste momento
            power: parseInt(prod.power) || 0, 
            fameGained: fameBonus, 
            
            date: Date.now() 
        });
        
        await b.commit();
        
        // Atualiza saldo visualmente
        setUser(prev => ({
            ...prev,
            data: { ...prev.data, balance: buyerBalance - prod.price }
        }));

        let msg = `Compra realizada com sucesso!`;

        if (profit < 0) msg += `\n(Nota: A empresa teve prejuízo nesta venda)`;

                // 4º Uso ou mais: 95% de chance de Vomitar
                else if (currentTox >= 3) {
                    if (Math.random() < 0.95) outcome = 'VOMIT';
                }

                // --- APLICAÇÃO DOS EFEITOS ---

                // CENÁRIO A: VÔMITO (Perde Energia e Humor)
                if (outcome === 'VOMIT') {
                    b.update(playerRef, {
                        energy: 0, // Zera energia
                        mood: '😡', // Fica irritado
                        toxicity: currentTox + 1,
                        lastToxicityDate: today
                    });
                    b.delete(itemRef);
                    await b.commit();

                    // Atualização Visual Local
                    setSales(prev => prev.filter(s => s.id !== item.id));
                    setUser(prev => ({...prev, data: {...prev.data, energy: 0, mood: '😡', toxicity: currentTox + 1}}));
                    
                    alert("🤮 VÔMITO!\n\nVocê consumiu demais! Seu corpo rejeitou tudo.\n\nEfeito: Energia ZERADA e Humor piorado.");
                    setLoading(false);
                    return;
                }

                // CENÁRIO B: INTOXICAÇÃO (Lesão Leve Incurável)
                if (outcome === 'SICK') {
                    const sickInjury = {
                        type: 'INTOXICACAO',
                        label: 'Intoxicação Alimentar',
                        games: 1, 
                        isIncurable: true // Hospital não cura
                    };

                    b.update(playerRef, {
                        injury: sickInjury,
                        recoveryLeft: 1,
                        toxicity: currentTox + 1,
                        lastToxicityDate: today
                    });
                    b.delete(itemRef);
                    await b.commit();

                    // Atualização Visual Local
                    setSales(prev => prev.filter(s => s.id !== item.id));
                    setUser(prev => ({...prev, data: {...prev.data, injury: sickInjury, toxicity: currentTox + 1}}));

                    alert("🤢 INTOXICAÇÃO ALIMENTAR!\n\nSeu estômago não aguentou.\n\nEfeito: Você foi internado e terá que esperar melhorar naturalmente (1 dia).");
                    setLoading(false);
                    return;
                }

                // CENÁRIO C: SUCESSO (Uso Normal)
                const energyGain = parseInt(item.power) || 0; 
                const currentEnergy = user.data.energy || 0;

                if (energyGain > 0 && currentEnergy >= 100) {
                    alert("Sua energia já está cheia!");
                    setLoading(false);
                    return;
                }

                const newEnergy = Math.min(100, currentEnergy + energyGain);
                
                // Atualiza Banco de Dados (Energia + Toxicidade)
                b.update(playerRef, { 
                    energy: newEnergy,
                    toxicity: currentTox + 1,
                    lastToxicityDate: today
                });
                b.delete(itemRef); 
                
                await b.commit();
                
                // Atualização Visual Imediata
                setSales(prev => prev.filter(s => s.id !== item.id));
                setUser(prev => ({...prev, data: {...prev.data, energy: newEnergy, toxicity: currentTox + 1}}));
                
                // Feedback com Aviso de Risco
                if (currentTox === 1) {
                    alert(`⚡ Energia recuperada: +${energyGain}%\n⚠️ CUIDADO: Foi seu 2º energético hoje. O próximo tem risco de intoxicação.`);
                } else if (currentTox >= 2) {
                    alert(`⚡ Energia recuperada...\n⛔ PERIGO: Seu estômago está no limite! Pare de consumir agora!`);
                } else {
                    alert(`⚡ Energia recuperada: +${energyGain}% (Total: ${newEnergy}%)`);
                }
            }

            // AÇÃO 2: EQUIPAR (XP Boost) - MANTIDO IGUAL
            if (action === 'EQUIP') {

                alert(`🛡️ Item equipado: ${item.productName}\nEle será consumido automaticamente no próximo treino.`);
            }

        } catch (error) {

    const handleLogoUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.readAsDataURL(file);
        
        reader.onload = (event) => {
            const img = new Image();
            img.src = event.target.result;
            
            img.onload = () => {
                // Cria um Canvas para redimensionar (Compressão)
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                
                // Define tamanho máximo para logo (200px é suficiente e leve)
                const MAX_SIZE = 200;
                let width = img.width;
                let height = img.height;

                // Redimensiona mantendo a proporção
                if (width > height) {
                    if (width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; }
                } else {
                    if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; }
                }

                canvas.width = width;
                canvas.height = height;
                
                // Desenha a imagem redimensionada
                ctx.drawImage(img, 0, 0, width, height);

                // Converte para Texto Base64 leve (JPEG qualidade 0.8)
                const dataUrl = canvas.toDataURL('image/jpeg', 0.8);

                // Atualiza o estado do formulário imediatamente com a nova imagem
                setF({ ...form, logo: dataUrl });
            };
        };
    };

const handleCoachTrain = async (playerIds, type) => {
        const currentCoach = user.data;
        if (!currentCoach || currentCoach.trainingsLeft <= 0) return alert("Sem treinos disponíveis!");

        setLoading(true);
        const b = db.batch();
        let coachXpGain = 0;
        let report = [];

        // 1. Identificar Perks Ativos do Técnico
        const activePerks = currentCoach.perks || [];
        const energyPerk = activePerks.find(p => p.type === 'ENERGY_SAVE');
        const energyCost = energyPerk ? Math.round(10 * energyPerk.value) : 10; 
        const critPerk = activePerks.find(p => p.type === 'CRIT_CHANCE');
        const critBonus = critPerk ? critPerk.value : 0;
        const minXpPerk = activePerks.find(p => p.type === 'MIN_XP_BOOST');
        const minXpBonus = minXpPerk ? minXpPerk.value : 0;
        const affPerk = activePerks.find(p => p.type === 'AFFINITY_BOOST');
        const affBonus = affPerk ? affPerk.value : 0;

        // 2. Mapeamento de Atributos (Completo)
        let trainedAttrs = [];
        if(type === 'FISICO_BASE') trainedAttrs = ['stamina', 'balance', 'condition', 'strength'];
        else if(type === 'VELOCIDADE') trainedAttrs = ['speed', 'accel', 'agility', 'dribbleSpd'];
        else if(type === 'IMPULSAO') trainedAttrs = ['jump', 'header', 'condition'];
        else if(type === 'CHUTE') trainedAttrs = ['shot', 'shotPower', 'shotTech', 'weakFootAcc'];
        else if(type === 'PASSE') trainedAttrs = ['shortPass', 'longPass', 'shortPassSpd', 'longPassSpd', 'tech', 'weakFootFreq'];
        else if(type === 'DRIBLE') trainedAttrs = ['dribble', 'dribbleSpd', 'agility', 'tech'];
        else if(type === 'DEFESA') trainedAttrs = ['defense', 'aggression', 'response'];
        else if(type === 'MENTAL') trainedAttrs = ['teamwork', 'mentality', 'response'];
        else if(type === 'BOLA_PARADA') trainedAttrs = ['freeKick', 'curve', 'header', 'penalties'];
        else if(type === 'GOLEIRO') trainedAttrs = ['gk', 'response', 'jump', 'longPass'];

        playerIds.forEach(pid => {
            const p = players.find(x => x.id === pid);
            if (!p) return;

            // CORREÇÃO CRÍTICA: Define energia atual aceitando o ZERO
            const currentEnergy = p.energy !== undefined ? p.energy : 100;

            // TRAVA 1: Jogador lesionado não treina
            if ((p.recoveryLeft || 0) > 0) {
                report.push(`⚠️ ${p.name} ignorado (está lesionado)`);
                return;
            }

            // TRAVA 2: Jogador Exausto (Evita bug de energia infinita)
            if (currentEnergy < energyCost) {
                report.push(`⚠️ ${p.name} ignorado (exausto: ${currentEnergy}%)`);
                return;
            }

            // --- CHANCE DE LESÃO NO TREINO COLETIVO (1%) ---
            if (Math.random() < 0.01) {
                const injuryName = INJURIES_DB.LEVE[Math.floor(Math.random() * INJURIES_DB.LEVE.length)];
                b.update(db.collection('players').doc(p.id), {
                    injury: injuryName,
                    recoveryLeft: 1,
                    energy: Math.max(0, currentEnergy - 15),
                    mood: '😡'
                });
                report.push(`❌ ${p.name} se lesionou: ${injuryName}`);
                return; // Pula o ganho de XP deste jogador
            }

            // Gasto de Energia Seguro
            const newEnergy = currentEnergy - energyCost;
            
            // Cálculo de XP Base
            let xpGain = Math.floor(Math.random() * 5) + 8 + minXpBonus; 
            
            // Afinidade Posicional
            if ((currentCoach.affinities || []).includes(p.position)) {
                xpGain += (5 + affBonus);
            }

            // Bônus de Item Equipado
            if (p.equippedItem) {
                const itemBonusPercent = p.equippedItem.power || 0;
                const bonusAmount = Math.ceil(xpGain * (itemBonusPercent / 100));
                xpGain += bonusAmount;
                report.push(`👟 ${p.name} usou ${p.equippedItem.name} (+${bonusAmount} XP)`);
                
                const itemRef = db.collection('sales').doc(p.equippedItem.id);
                b.delete(itemRef);
                b.update(db.collection('players').doc(pid), { equippedItem: firebase.firestore.FieldValue.delete() });
            }

            // Aplicação dos Perks
            activePerks.forEach(perk => {
                if (perk.type === 'TRAIN_BOOST') {
                    const hasSynergy = perk.attrs.some(attr => trainedAttrs.includes(attr));
                    if (hasSynergy) xpGain = Math.round(xpGain * perk.multiplier);
                }
                if (perk.type === 'YOUTH_BOOST') {
                    const age = p.age || 18;
                    if (age <= perk.ageLimit) xpGain = Math.round(xpGain * perk.multiplier);
                }
            });

            // Chance de Crítico
            if (Math.random() < (0.10 + critBonus)) {
                xpGain *= 2;
                report.push(`🔥 ${p.name} teve uma GRANDE evolução!`);
            }

            // Evolução de Atributos Específicos
            let newAttrs = { ...(p.attributes || {}) };
            trainedAttrs.forEach(attr => {

                    if(Math.random() < (xpGain / 80)) { 
                        newAttrs[attr] = (newAttrs[attr] || 50) + 1;
                    }
                }
            });

            // Salva no Banco (SEM ATUALIZAR O OVERALL)
            b.update(db.collection('players').doc(pid), { 
                xp: (p.xp || 0) + xpGain, 
                energy: newEnergy,
                attributes: newAttrs
            });
            
            coachXpGain += 20;
        });

        // Evolução do Técnico
        let newCoachXp = (currentCoach.xp || 0) + coachXpGain;
        let newLevel = currentCoach.level;
        let pendingPerks = currentCoach.pendingPerks || 0;
        let pendingAffinity = currentCoach.pendingAffinity || 0;
        
        const xpNeed = newLevel * 120;
        if (newCoachXp >= xpNeed && newLevel < 30) {
            newCoachXp -= xpNeed;
            newLevel++;
            if (newLevel % 5 === 0) pendingPerks++;
            if ([10, 20, 30].includes(newLevel)) pendingAffinity++;
            alert(`🎉 PARABÉNS! Nível ${newLevel} alcançado!`);
        }

        b.update(db.collection('users').doc(currentCoach.id), {
            trainingsLeft: currentCoach.trainingsLeft - 1,
            xp: newCoachXp,
            level: newLevel,
            pendingPerks,
            pendingAffinity
        });

        await b.commit();
        setLoading(false);
        
        let msg = "Treino realizado com sucesso!";
        if(report.length > 0) msg += "\n\n" + report.join("\n");
        alert(msg);

const sendOffer = async (target, type, value, swapIds, con, meta, old) => {
    try {
        const v = parseFloat(value) || 0;
        const contractYears = parseInt(con) || 1;
        const actingTeamName = user.data.name;
        const targetPlayerName = target.name;
        const finalSal = parseFloat(meta.newSalary) || 0;
        const role = meta.role || 'ROTACAO';

        let details = `💰 Taxa: ${fmt(v)}\n`;
        if (meta.installments > 1) details += `📅 Parcelamento: ${meta.installments}x de ${fmt(v / meta.installments)}\n`;
        if (meta.sellOn > 0) details += `📈 Revenda: ${meta.sellOn}%\n`;

        // --- AJUSTE VISUAL: SE FOR PRÉ-CONTRATO ---
        if (type === 'PRE_CONTRATO') {
            details = `⚖️ **LEI BOSMAN (PRÉ-CONTRATO)**\nO jogador virá a custo zero no início da próxima temporada.\n`;
        }

        details += `📝 Contrato: ${contractYears} anos\n`;
        details += `💵 Salário Sugerido: ${fmt(finalSal)}/sem\n`;
        details += `👔 Papel: ${role}`;

        // --- LÓGICA DE DESTINATÁRIO INTELIGENTE ---
        let recipientId; 

        if (old && old.id) {
            // CASO ESPECIAL 1: CONTRAPROPOSTA DE RENOVAÇÃO URGENTE
            if (old.type === 'RENOVACAO_URGENTE') {
                recipientId = old.playerId;
            } 
            // CASO ESPECIAL 2: ACORDO ENTRE CLUBES JÁ SELADO
            else if (old.sellerAccepted === true) {
                recipientId = (user.data.id === old.buyerId) ? old.playerId : old.buyerId;
            } 
            // CASO NORMAL: NEGOCIAÇÃO FINANCEIRA (ENTRE CLUBES)
            else {
                if (user.data.id === old.buyerId) {
                    recipientId = (old.sellerId === 'FREE' || !old.sellerId) ? old.playerId : old.sellerId;
                } else {
                    recipientId = old.buyerId;
                }
            }
        } else {
            // OFERTA NOVA (Primeiro contato)
            
            // >>> CORREÇÃO V1.52.10: SE FOR PRÉ-CONTRATO, VAI DIRETO PRO JOGADOR <<<
            if (type === 'PRE_CONTRATO') {
                recipientId = target.id; 
            } else {
                // Se não for pré-contrato, segue a regra normal:
                // Se tem time, vai pro time. Se é Free, vai pro jogador.
                recipientId = (target.teamId === 'FREE' || !target.teamId || target.teamId === '') 
                    ? target.id 
                    : target.teamId;
            }
        }

        const pl = {
            playerId: target.id,
            playerName: targetPlayerName,
            buyerId: old?.buyerId || user.data.id,
            buyerName: old?.buyerName || actingTeamName,
            sellerId: target.teamId || old?.sellerId || 'FREE',
            recipientId: recipientId,
            type: (old?.type === 'RENOVACAO_URGENTE') ? 'RENOVACAO' : type,
            value: v,
            offerContract: contractYears,
            description: details,
            status: 'PENDING',
            sellerAccepted: old ? (old.sellerAccepted || false) : false,
            meta: {
                ...meta,
                newSalary: finalSal,
                signingBonus: parseFloat(meta.signingBonus) || 0,
                role: role,
                installments: parseInt(meta.installments) || 1,
                sellOn: parseInt(meta.sellOn) || 0,
                hasBuyOption: meta.hasBuyOption || false
            },
            date: Date.now()
        };

        const b = db.batch();
        if (old && old.id) b.delete(db.collection('offers').doc(old.id));
        
        b.set(db.collection('offers').doc(), pl);
        await b.commit();

        // Título da notícia ajustado
        const msgHead = (old && old.id) ? "🔄 CONTRAPROPOSTA" : (type === 'PRE_CONTRATO' ? "⚖️ PRÉ-CONTRATO" : "💼 NOVA OFERTA");
        
        postNews(`${msgHead}\n**${actingTeamName}** enviou uma proposta para **${targetPlayerName}**!\n\n${details}`, 'transfer');
        
        setModal(null); 
        alert("Enviado com sucesso! Aguarde a resposta.");
    } catch (e) {
        console.error("Erro no Firebase:", e);
        alert("Erro técnico ao gravar no banco de dados.");
    }
};

const acceptOffer = async (o) => {
    try {
        // --- 1. LÓGICA DE NOTIFICAÇÃO (APENAS LEITURA) ---
        if (o.type === 'NOTIFICACAO') {
            await db.collection('offers').doc(o.id).delete();
            alert('Confirmado!');
            return;
        }

        // --- 2. LÓGICA DE PRÉ-CONTRATO (V1.52.9) ---
        // (Mantido para não perder a funcionalidade de assinar com jogadores em fim de contrato)
        if (o.type === 'PRE_CONTRATO') {
            if (!confirm(`Confirmar assinatura de Pré-Contrato com ${o.buyerName}?\nVocê se juntará a eles na próxima temporada.`)) return;
            
            const b = db.batch();
            
            // Grava o pré-contrato no perfil do jogador
            b.update(db.collection('players').doc(o.playerId), {
                preContract: {
                    teamId: o.buyerId,
                    teamName: o.buyerName,
                    salary: o.meta.newSalary,
                    date: Date.now()
                },
                mood: '🤩'
            });

            b.delete(db.collection('offers').doc(o.id));
            await b.commit();
            
            postNews(`📝 **PRÉ-CONTRATO ASSINADO**\n**${o.playerName}** assinou com o **${o.buyerName}** e se apresentará na próxima temporada!`, 'transfer');
            alert("Pré-contrato assinado com sucesso!");
            return;
        }

        const buy = teams.find(t => t.id === o.buyerId);
        const p = players.find(x => x.id === o.playerId);
        const isFreeAgent = !o.sellerId || o.sellerId === 'FREE';
        const sel = isFreeAgent ? null : teams.find(t => t.id === o.sellerId);

        // --- 3. CASO ESPECIAL: COMPRA DEFINITIVA (EXERCER OPÇÃO DE EMPRÉSTIMO) ---
        if (o.type === 'COMPRA_DEFINITIVA') {
            if (!buy || !p) return alert("Erro: Dados incompletos.");
            if (buy.balance < o.value) return alert(`Saldo insuficiente! Necessário: ${fmt(o.value)}`);
            if (!confirm(`Exercer opção de compra de ${p.name} por ${fmt(o.value)}?`)) return;

            const b = db.batch();
            b.update(db.collection('teams').doc(buy.id), { balance: buy.balance - o.value });
            if (sel) b.update(db.collection('teams').doc(sel.id), { balance: sel.balance + o.value });

            b.update(db.collection('players').doc(p.id), {
                teamId: buy.id,
                loanMeta: firebase.firestore.FieldValue.delete(), 
                status: 'NAO_A_VENDA',
                contract: 3, 
                history: firebase.firestore.FieldValue.arrayUnion({ 
                    date: Date.now(), from: sel ? sel.name : 'EMPRÉSTIMO', to: buy.name, type: 'COMPRA_DEFINITIVA', value: o.value 
                })
            });
            b.delete(db.collection('offers').doc(o.id));
            await b.commit();
            postNews(`✅ **OPÇÃO EXERCIDA**\nO **${buy.name}** contratou **${p.name}** em definitivo!`, 'transfer');
            alert("Compra realizada!");
            return;
        }

        // =================================================================================
        // LÓGICA DE NEGOCIAÇÃO INTELIGENTE (ACEITE BIDIRECIONAL)
        // =================================================================================

        const iAmBuyer = user.type === 'USER' && user.data.id === o.buyerId;
        const iAmSeller = user.type === 'USER' && user.data.id === o.sellerId;
        const iAmPlayer = user.type === 'PLAYER' || (isFreeAgent && !iAmBuyer);

        // --- FASE 1: ACORDO ENTRE CLUBES ---
        if (!isFreeAgent && !o.sellerAccepted && (iAmSeller || iAmBuyer)) {
            if (iAmBuyer) {
                if (!confirm(`Aceitar a pedida do clube vendedor (${fmt(o.value)}) e negociar com o jogador?`)) return;
            } else {
                if (!confirm("Aceitar os valores propostos? O jogador decidirá o contrato agora.")) return;
            }
            
            await db.collection('offers').doc(o.id).update({
                recipientId: o.playerId, 
                sellerAccepted: true,     
                status: 'PENDING'
            });
            
            postNews(`💰 **ACORDO ENTRE CLUBES**\n${buy.name} e ${sel.name} chegaram a um acordo por **${p.name}**. Falta o "Sim" do atleta!`, 'transfer');
            alert("Acordo financeiro selado! A proposta foi enviada para o jogador.");
            return;
        }

        // --- FASE 2: ACORDO FINAL ---
        const readyForContract = isFreeAgent || o.sellerAccepted;

        if (readyForContract && (iAmPlayer || iAmBuyer)) {
            if (!buy || !p) return alert("Erro: Dados incompletos.");

            const valorEntrada = o.meta?.installments > 1 ? (o.value / o.meta.installments) : o.value;
            const luvas = parseFloat(o.meta?.signingBonus) || 0;
            const custoTotalImediato = valorEntrada + luvas;

            if (buy.balance < custoTotalImediato) {
                return alert(`Saldo insuficiente no caixa do comprador!\nNecessário: ${fmt(custoTotalImediato)}`);
            }

            if (iAmBuyer) {
                if (!confirm(`Aceitar a pedida salarial do jogador e fechar a contratação?\nCusto Imediato: ${fmt(custoTotalImediato)}`)) return;
            } else {
                if (!confirm(`Deseja assinar com o ${buy.name}?`)) return;
            }

            // --- EXECUÇÃO DA TRANSFERÊNCIA ---
            const b = db.batch();
            
            // 1. Paga o Clube Vendedor (se houver) E processa cláusula de revenda ANTIGA
            if (sel) {
                let valorParaVendedor = valorEntrada;

                // >>>> LÓGICA DE REVENDA (SELL-ON FEE) AUTOMÁTICA <<<<
                // Se o jogador tem uma cláusula salva, calcula a parte do antigo dono
                if (p.sellOnClause && p.sellOnClause.percentage > 0) {
                    const beneficiaryId = p.sellOnClause.beneficiaryId;
                    
                    // Só executa se o beneficiário ainda existir e não for o mesmo que está comprando
                    if (beneficiaryId && beneficiaryId !== buy.id) {
                        const shareAmount = (valorEntrada * p.sellOnClause.percentage) / 100;
                        
                        // Desconta do vendedor atual
                        valorParaVendedor -= shareAmount;
                        
                        // Paga ao dono original (Beneficiário)
                        b.update(db.collection('teams').doc(beneficiaryId), { 
                            balance: firebase.firestore.FieldValue.increment(shareAmount) 
                        });
                    }
                }

                // Paga o vendedor (já descontado a revenda, se houve)
                b.update(db.collection('teams').doc(sel.id), { balance: sel.balance + valorParaVendedor });

                // Cria dívida se parcelado
                if (o.meta?.installments > 1) {
                    const debtRef = db.collection('debts').doc();
                    b.set(debtRef, {
                        buyerId: buy.id, buyerName: buy.name,
                        sellerId: sel.id, sellerName: sel.name,
                        playerName: p.name, installmentVal: valorEntrada,
                        weeksRemaining: parseInt(o.meta.installments) - 1, date: Date.now()
                    });
                }
            }

            // 2. Desconta do Comprador
            b.update(db.collection('teams').doc(buy.id), { balance: buy.balance - custoTotalImediato });

            // 3. Paga Luvas ao Jogador
            if (luvas > 0) {
                b.update(db.collection('players').doc(p.id), { balance: firebase.firestore.FieldValue.increment(luvas) });
            }

            // 4. Atualiza o Jogador (Move de time e Grava NOVA Cláusula)
            
            // Prepara a NOVA cláusula se foi negociada agora (0 a 80%)
            const newSellOnClause = (o.meta && o.meta.sellOn > 0 && sel) ? {
                beneficiaryId: sel.id,
                percentage: o.meta.sellOn
            } : firebase.firestore.FieldValue.delete(); // Se não tem revenda nova, apaga a antiga para limpar o histórico

            b.update(db.collection('players').doc(p.id), {
                teamId: buy.id,
                status: 'NAO_A_VENDA',
                contract: o.type === 'EMPRESTIMO' ? (parseInt(o.meta.loanDuration) || 1) : (parseInt(o.offerContract) || 1),
                salary: parseFloat(o.meta?.newSalary) || p.salary,
                role: o.meta?.role || 'ROTACAO',
                loanMeta: o.type === 'EMPRESTIMO' ? { 
                    ownerId: sel?.id, 
                    salarySplit: o.meta.salarySplit || 100,
                    hasBuyOption: o.meta.hasBuyOption || false,
                    buyOpt: o.meta.buyOpt || 0,
                    originalContract: p.contract 
                } : null,
                // AQUI GRAVA A NOVA CLÁUSULA NO JOGADOR
                sellOnClause: newSellOnClause,
                history: firebase.firestore.FieldValue.arrayUnion({ 
                    date: Date.now(), from: isFreeAgent ? 'AGENTE LIVRE' : (sel ? sel.name : 'Desconhecido'), to: buy.name, type: o.type, value: o.value 
                })
            });

            // 5. Apaga a oferta e notifica
            b.delete(db.collection('offers').doc(o.id));
            await b.commit();
            
            const newsMsg = isFreeAgent 
                ? `✍️ **ASSINOU!**\nO Agente Livre **${p.name}** é o novo reforço do **${buy.name}**!`
                : `🤝 **TRANSFERÊNCIA CONCLUÍDA**\n**${p.name}** assinou com o **${buy.name}**!`;
            
            postNews(newsMsg, 'transfer');
            
            // Notificação extra se houve repasse de revenda
            if (sel && p.sellOnClause && p.sellOnClause.percentage > 0) {
                 postNews(`💸 **CLÁUSULA DE REVENDA**\nUma parte da venda de **${p.name}** (${p.sellOnClause.percentage}%) foi repassada ao seu antigo clube formador.`, 'money');
            }

            alert("Negócio fechado com sucesso!");
        }

    } catch (e) {
        console.error(e);
        alert("Erro ao processar o aceite: " + e.message);
    }
};

const rejectOffer = async (o) => {
    try {
        // --- CASO 1: RECUSA DE OPÇÃO DE COMPRA (FIM DE EMPRÉSTIMO) ---
        if (o.type === 'COMPRA_DEFINITIVA' && o.isLoanOption) {
            const p = players.find(x => x.id === o.playerId);
            const ownerId = o.sellerId; 
            const ownerTeam = teams.find(t => t.id === ownerId);

            if (!confirm("Deseja recusar a compra? O jogador retornará ao clube de origem.")) return;

            const b = db.batch();
            const pRef = db.collection('players').doc(p.id);

            // --- CORREÇÃO DE SEGURANÇA PARA DADOS ANTIGOS ---
            let originalDuration = 0;
            
            if (p.loanMeta && p.loanMeta.originalContract) {
                originalDuration = parseInt(p.loanMeta.originalContract);
            } else {
                console.warn("Contrato original não encontrado. Usando fallback de 6 anos.");
                originalDuration = 6; 
            }
            
            let remainingContract = originalDuration - 1;
            if (remainingContract < 0) remainingContract = 0;

            if (remainingContract <= 0) {
                const renewalReqRef = db.collection('offers').doc();
                b.set(renewalReqRef, {
                    type: 'RENOVACAO_URGENTE',
                    playerId: p.id,
                    playerName: p.name,
                    buyerId: ownerId, 
                    buyerName: ownerTeam?.name || 'Clube de Origem',
                    sellerId: 'SISTEMA',
                    recipientId: ownerId,
                    status: 'PENDING',
                    description: `⚠️ **URGENTE: FIM DE CONTRATO**\nO empréstimo de **${p.name}** acabou e o contrato dele com você expirou.\n\nRenove ou libere para os passes livres.`,
                    date: Date.now()
                });

                b.update(pRef, {
                    teamId: ownerId,
                    loanMeta: firebase.firestore.FieldValue.delete(),
                    status: 'INTRANSFERIVEL',
                    contract: 0
                });

                postNews(`🔙 **RETORNO CRÍTICO**\nO empréstimo de ${p.name} acabou e o contrato expirou!`, 'rumor');
            } else {
                const notifRef = db.collection('offers').doc();
                b.set(notifRef, {
                    type: 'NOTIFICACAO',
                    playerId: p.id,
                    playerName: p.name,
                    buyerName: 'Sistema',
                    recipientId: ownerId,
                    status: 'PENDING',
                    description: `🔙 **RETORNO DE EMPRÉSTIMO**\nA opção de compra foi recusada.\n**${p.name}** voltou ao seu elenco.\n\n📄 Contrato Restante: ${remainingContract} temporada(s).`,
                    date: Date.now()
                });

                b.update(pRef, {
                    teamId: ownerId,
                    loanMeta: firebase.firestore.FieldValue.delete(),
                    status: 'NAO_A_VENDA',
                    contract: remainingContract 
                });
                
                postNews(`🔙 **RETORNO**\n${p.name} retornou ao ${ownerTeam?.name} (${remainingContract} anos rest.).`, 'transfer');
            }

            b.delete(db.collection('offers').doc(o.id));
            await b.commit();
            alert("Opção recusada. Jogador devolvido ao clube de origem.");
            return;
        }

        // --- CASO 2: RECUSA DE RENOVAÇÃO URGENTE ---
        if (o.type === 'RENOVACAO_URGENTE') {
            if (!confirm("Tem certeza? O jogador perderá o vínculo com o clube e irá para os Agentes Livres.")) return;
            
            const b = db.batch();
            b.update(db.collection('players').doc(o.playerId), {
                teamId: 'FREE',
                status: 'VENDA',
                mood: '😐',
                contract: 0
            });
            b.delete(db.collection('offers').doc(o.id));
            await b.commit();
            
            postNews(`🆓 **AGENTE LIVRE**\nO vínculo de **${o.playerName}** expirou e ele está livre no mercado!`, 'transfer');
            alert("Jogador enviado para os Agentes Livres.");
            return;
        }

        // --- CASO 3: RECUSA NORMAL DE PROPOSTAS ---
        if (!confirm("Deseja recusar e encerrar esta negociação?")) return;
        await db.collection('offers').doc(o.id).delete();
        
        if (o.type !== 'NOTIFICACAO') {
            postNews(`❌ **NEGOCIAÇÃO ENCERRADA**\nO acordo por **${o.playerName}** não avançou.`, 'transfer');
        }

    } catch (e) {
        console.error(e);
        alert("Erro técnico ao processar a recusa.");
    }
};

           const saveMatchStats = async (dataPayload, legacyMatch, legacyXp) => {

                // 1. Compatibilidade com chamadas antigas (player, match, xp)
                if (legacyMatch && legacyMatch.goals !== undefined) {
                    batchData = [{ player: dataPayload, match: legacyMatch, xpOverride: legacyXp }];
                } 
                // 2. Novo formato (Array de jogadores ou Objeto único)
                else {
                    batchData = Array.isArray(dataPayload) ? dataPayload : [dataPayload];
                }
                
                if (batchData.length === 0) return alert("Nenhum dataPayload para salvar.");
                
                setLoading(true);
                const b = db.batch();
                let count = 0;

                // Regras de XP para cálculo automático
                const R = { GOAL: 150, ASSIST: 120, TACKLE: 80, SAVE: 100, WIN: 300, DRAW: 100, LOSS: -100, YELLOW: -50, RED: -200, RATING_MULT: 50 };

                batchData.forEach(item => {
                    const { player, match, xpOverride } = item;
                    if (!player || !match) return;
                    
                    // Cálculo de XP Interno (se não vier pré-calculado)
                    let xp = 0;
                    if (xpOverride !== undefined) {
                        xp = xpOverride;
                    } else {
                        xp += (match.goals || 0) * R.GOAL;
                        xp += (match.assists || 0) * R.ASSIST;
                        xp += (match.tackles || 0) * R.TACKLE;
                        xp += (match.saves || 0) * R.SAVE;
                        xp += (match.yellows || 0) * R.YELLOW;
                        xp += (match.reds || 0) * R.RED;
                        if (match.result === 'VITORIA') xp += R.WIN;
                        if (match.result === 'EMPATE') xp += R.DRAW;
                        if (match.result === 'DERROTA') xp += R.LOSS;
                        xp += (parseFloat(match.rating) || 0) * R.RATING_MULT;
                    }
                    const xpGained = parseInt(xp);

                    // Atualiza o Jogador
                    const pRef = db.collection('players').doc(player.id);
                    
                    const newStats = { 
                        goals: (player.stats?.goals||0) + match.goals, 
                        assists: (player.stats?.assists||0) + match.assists, 
                        tackles: (player.stats?.tackles||0) + match.tackles, 
                        saves: (player.stats?.saves||0) + match.saves, 
                        yellows: (player.stats?.yellows||0) + match.yellows, 
                        reds: (player.stats?.reds||0) + match.reds 
                    };

                    // Cálculo da Média da Imprensa
                    const currentSum = player.pressRatingSum || 0; 
                    const currentCount = player.pressRatingCount || 0; 
                    const newSum = currentSum + parseFloat(match.rating);
                    const newCount = currentCount + 1;
                    const newAvg = newSum / newCount; 
                    
                    // Preparação do objeto de atualização
                    const updateData = { 
                        stats: newStats, 
                        pendingXP: (player.pendingXP || 0) + xpGained,
                        pressRatingSum: newSum,
                        pressRatingCount: newCount,
                        pressRatingAvg: parseFloat(newAvg.toFixed(1)),
                        energy: Math.max(0, (player.energy || 100) - 25) // Desgaste físico do jogo
                    };

                    // --- INTEGRAÇÃO DO SISTEMA MÉDICO (LESÕES) ---
                    if (match.injury && (match.recoveryLeft || 0) > 0) {
                        updateData.injury = match.injury;
                        updateData.recoveryLeft = parseInt(match.recoveryLeft);
                        updateData.mood = '😡'; // Jogador fica irritado ao se lesionar
                    }
                    
                    b.update(pRef, updateData);
                    count++;
                });
                
                await b.commit();
                setLoading(false);
                setModal(null);
                alert(`${count} súmula(s) lançada(s) com sucesso!`);
            };

// FIM DA LÓGICA DE IMPRENSA E SÚMULAS
            // --- TREINO SOLO DO JOGADOR ---
 const handlePlayerSoloTrain = async (player, type) => {
        // CORREÇÃO CRÍTICA: Define energia atual aceitando o ZERO
        const currentEnergy = player.energy !== undefined ? player.energy : 100;

        // 1. Verifica Energia (Custo alto: 35) e se está lesionado
        if (currentEnergy < 35) {
            return alert(`Você está exausto (${currentEnergy}%)! Precisa de pelo menos 35% de energia.`);
        }
        if ((player.recoveryLeft || 0) > 0) {
            return alert(`Você está lesionado (${player.injury}) e não pode treinar por mais ${player.recoveryLeft} jogos!`);
        }

        setLoading(true);
        const b = db.batch();
        let report = [];

        // --- CHANCE DE LESÃO AUTOMÁTICA (2%) ---
        if (Math.random() < 0.02) {
            const injuryName = INJURIES_DB.LEVE[Math.floor(Math.random() * INJURIES_DB.LEVE.length)];
            b.update(db.collection('players').doc(player.id), {
                injury: injuryName,
                recoveryLeft: 1,
                energy: Math.max(0, currentEnergy - 20), // Gasta um pouco de energia no susto
                mood: '😡'
            });
            await b.commit();
            setLoading(false);
            return alert(`❌ INFORTÚNIO!\nVocê sentiu o físico durante o treino.\nDiagnóstico: ${injuryName}\nTempo: 1 Jogo fora.`);
        }

        // 2. Define Atributos baseados no Tipo (Atualizado para cobrir TODOS os atributos do sistema)
        let trainedAttrs = [];
        if(type === 'FISICO_BASE') trainedAttrs = ['stamina', 'balance', 'condition', 'strength'];
        else if(type === 'VELOCIDADE') trainedAttrs = ['speed', 'accel', 'agility', 'dribbleSpd'];
        else if(type === 'IMPULSAO') trainedAttrs = ['jump', 'header', 'condition'];
        else if(type === 'CHUTE') trainedAttrs = ['shot', 'shotPower', 'shotTech', 'weakFootAcc'];
        else if(type === 'PASSE') trainedAttrs = ['shortPass', 'longPass', 'shortPassSpd', 'longPassSpd', 'tech', 'weakFootFreq'];
        else if(type === 'DRIBLE') trainedAttrs = ['dribble', 'dribbleSpd', 'agility', 'tech'];
        else if(type === 'DEFESA') trainedAttrs = ['defense', 'aggression', 'response'];
        else if(type === 'MENTAL') trainedAttrs = ['teamwork', 'mentality', 'response'];
        else if(type === 'BOLA_PARADA') trainedAttrs = ['freeKick', 'curve', 'header', 'penalties'];
        else if(type === 'GOLEIRO') trainedAttrs = ['gk', 'response', 'jump', 'longPass'];

        // 3. Cálculos (Eficiência Baixa no Solo)
        let xpGain = Math.floor(Math.random() * 4) + 3; // Ganha entre 3 e 6 XP
        const newEnergy = currentEnergy - 35; // Gasta 35 de Energia (Cálculo seguro)

        // --- BÔNUS DE ITEM EQUIPADO (CHUTEIRA/LUVA) ---
        if (player.equippedItem) {
            const itemBonusPercent = player.equippedItem.power || 0;
            const bonusAmount = Math.ceil(xpGain * (itemBonusPercent / 100));
            xpGain += bonusAmount;
            report.push(`👟 Item usado: ${player.equippedItem.name} (+${bonusAmount} XP)`);
            
            // Consome o item (remove da coleção sales e do player)
            const itemRef = db.collection('sales').doc(player.equippedItem.id);
            b.delete(itemRef);
            b.update(db.collection('players').doc(player.id), { equippedItem: firebase.firestore.FieldValue.delete() });
        }

        // 4. Evolução de Atributos (Chance Baixa: 15%)
        let newAttrs = { ...(player.attributes || {}) };
        let evolved = false;
        
        trainedAttrs.forEach(attr => {
            if((newAttrs[attr] || 50) < 99) {
                if(Math.random() < 0.15) { // 15% de chance de subir 1 ponto
                    newAttrs[attr] = (newAttrs[attr] || 50) + 1;
                    evolved = true;
                }
            }
        });

        // 5. Salva no Banco (SEM ATUALIZAR O OVERALL)
        // O Overall agora só deve ser recalculado na virada de temporada pelo Admin
        b.update(db.collection('players').doc(player.id), {
            xp: (player.xp || 0) + xpGain,
            energy: newEnergy,
            attributes: newAttrs
            // overall removido para evitar inflação fora de época
        });

        await b.commit();
        setLoading(false);
        
        let msg = `Treino realizado!\n⚡ Energia: -35% (Resta: ${newEnergy}%)\n📈 XP: +${xpGain}`;
        if(report.length > 0) msg += `\n${report.join('\n')}`;
        if(evolved) msg += "\n✨ Alguns atributos melhoraram um pouco.";
        alert(msg);
    };

                        onChange={e=>setEditP({...editP, stock: parseInt(e.target.value)})}

                    />
                    <div style={{marginTop:15, paddingTop:10, borderTop:'1px solid rgba(255,255,255,0.1)', fontSize:12}}>

                                    <div style={{display:'flex', justifyContent:'space-between', marginBottom:5}}>

                                    </div>
                                    {!canAfford && <div style={{color:'#FF1744', textAlign:'right', fontWeight:'bold', marginTop:5, fontSize:10}}>⚠️ SALDO INSUFICIENTE</div>}
                                </>
                            );
                        })()}

                <label>Descrição</label><textarea className="input-field" value={editP.desc} onChange={e=>setEditP({...editP, desc:e.target.value})} />
                
                <div style={{display:'flex', gap:10}}>
                    <button className="btn btn-green" onClick={async ()=>{
                        const uCost = getProdCost(editP.cat, editP.power);
                        const qty = parseInt(editP.stock) || 1;
                        const tCost = uCost * qty;
                        const price = parseFloat(editP.price);
                        
                        if(uCost > 0 && price < uCost) return alert(`🚫 ANTI-CHEAT: O preço (${fmt(price)}) não pode ser menor que o custo de produção (${fmt(uCost)})!`);
                        if((company.balance || 0) < tCost) return alert("A empresa não tem saldo para esta produção!");

                        try {
                            // 1. Debita o valor total do saldo da empresa no Firebase
                            if(tCost > 0) {
                                await db.collection('companies').doc(company.id).update({
                                    balance: firebase.firestore.FieldValue.increment(-tCost)
                                });
                            }

                            // 2. Calcula o estoque final somando com o que já existe se for edição
                            const oldProd = products.find(x => x.id === editP.id);
                            const finalStock = editP.id ? (parseInt(oldProd.stock || 0) + qty) : qty;

                            // 3. Salva o produto
                            onSaveProd({
                                ...editP,
                                stock: finalStock,
                                productionCost: uCost
                            });
                            
                            setEditP(null);
                        } catch(e) { alert("Erro ao produzir: " + e.message); }
                    }}>
                        {editP.id ? `FABRICAR (+${editP.stock})` : `PAGAR E LANÇAR (-${fmt(getProdCost(editP.cat, editP.power) * (editP.stock||1))})`}
                    </button>
                    <button className="btn" onClick={()=>setEditP(null)}>CANCELAR</button>
                </div>

};

                // 2. Cria um Canvas para redimensionar (Compressão)

                const ctx = canvas.getContext('2d');
                
                // Define tamanho máximo para ícone (200px é perfeito e leve)
                const MAX_SIZE = 200;
                let width = img.width;
                let height = img.height;

                // Redimensiona mantendo a proporção
                if (width > height) {
                    if (width > MAX_SIZE) {
                        height *= MAX_SIZE / width;
                        width = MAX_SIZE;
                    }
                } else {
                    if (height > MAX_SIZE) {
                        width *= MAX_SIZE / height;
                        height = MAX_SIZE;
                    }
                }

                canvas.width = width;
                canvas.height = height;
                
                // Desenha a imagem redimensionada no canvas
                ctx.drawImage(img, 0, 0, width, height);

                // 3. Converte para Texto Base64 leve (JPEG qualidade 0.8)
                const dataUrl = canvas.toDataURL('image/jpeg', 0.8);

                if (confirm("Salvar esta foto de perfil?")) {

                        alert("Erro ao salvar: " + error.message);
                    }
                }
            };

   const PlayerForm = ({ initial, onSave, onDelete, isAdmin, teams, onRenew, isOwner }) => {
    // 1. Definição dos dados padrão
    const defaultState = {
        name:'', position:'ATA', overall:45, value:'', salary:'', 
        clause:'', contract:'', mood:'😐', status:'NAO_A_VENDA', 
        password:'', balance: 0, rating: '', 
        stats: {goals:0, assists:0, tackles:0, saves:0, yellows:0, reds:0},
        attributes: null 
    };

    const [f, setF] = useState({ ...defaultState, ...(initial || {}) });
    const isEditing = f.id ? true : false;
    
    // Calcula limites em tempo real baseado no Overall digitado
    const limits = getSalaryLimits(f.overall);

    const calculateRealOverall = (position, attrs) => {
        let sum = 0; let count = 0;
        const safePos = position || 'ATA'; 
        const ignoreList = safePos === 'GOL' ? ['shot', 'attack', 'dribble', 'curve', 'freeKick', 'weakFootAcc', 'weakFootFreq'] : ['gk'];
        Object.entries(attrs).forEach(([key, val]) => { if (!ignoreList.includes(key)) { sum += val; count++; } });
        return count === 0 ? 0 : Math.round(sum / count);
    };

    const handleSave = () => {
        try {
            const dataToSave = { ...f };
            const safePos = dataToSave.position || 'ATA'; 
            const ovr = parseInt(dataToSave.overall) || 50;
            const salary = parseFloat(dataToSave.salary) || 0;

            // --- TRAVA RÍGIDA DE SALÁRIO (ZERO TOLERÂNCIA) ---
            if (salary < limits.minSal || salary > limits.maxSal) {
                alert(`🚫 AÇÃO BLOQUEADA: SALÁRIO IRREGULAR!\n\nCategoria: ${limits.label} (Over ${ovr})\nFaixa Permitida: ${fmt(limits.minSal)} - ${fmt(limits.maxSal)}\n\nVocê tentou colocar: ${fmt(salary)}.\n\nPor favor, ajuste o valor para dentro da faixa permitida para salvar.`);
                return; // O CÓDIGO PARA AQUI. NÃO SALVA.
            }

            if (!dataToSave.attributes || Object.keys(dataToSave.attributes).length === 0) {
                const targetOv = parseInt(dataToSave.overall) || 60;
                const newAttrs = generateAttributes(safePos, targetOv);
                const realAvg = calculateRealOverall(safePos, newAttrs);
                
                dataToSave.attributes = newAttrs;
                dataToSave.overall = realAvg;
                dataToSave.position = safePos;
                alert(`Atributos gerados!\nOverall Real: ${realAvg}`);
            }

            onSave(dataToSave);
        } catch (error) { console.error(error); alert("Erro ao salvar: " + error.message); }
    };

    return (
        <div className="modal-bg">
            <div className="modal-content" style={{maxHeight:'90vh', overflowY:'auto'}}>

const OfferForm = ({ target, myPlayers, onSend, setModal, user }) => {

    const isPlayerActing = user?.type === 'PLAYER';
    const clubsHaveAgreed = old?.sellerAccepted === true;
    const isUrgentRenewal = old?.type === 'RENOVACAO_URGENTE';
    const shouldHidePart1 = isPlayerActing || clubsHaveAgreed || isUrgentRenewal;
    const maxLoanAllowed = parseInt(target.contract) || 1;

    // --- NOVO: PEGA LIMITES SALARIAIS PARA O OVERALL DO ALVO ---
    const limits = getSalaryLimits(target.overall);

    // Se vier do botão "Pré-Contrato", o type inicial será PRE_CONTRATO
    const [t, setT] = useState(old.type || 'COMPRA');
    const [v, setV] = useState(old.value || '');
    const [sal, setSal] = useState(old.meta?.newSalary || target.salary || 0);
    const [con, setCon] = useState(old.offerContract || '1');
    const [role, setRole] = useState(old.meta?.role || 'ROTACAO');
    const [hasBuyOption, setHasBuyOption] = useState(old.meta?.hasBuyOption || false);

    const [meta, setMeta] = useState(old.meta || { 
        sellOn: 0, 
        installments: 1, 
        signingBonus: 0, 
        loanDuration: 1, 
        salarySplit: 100, 
        buyOpt: 0 
    });
    const [swaps, setSwaps] = useState(old.swapPlayerIds || []);

    const toggleSwap = (id) => {
        if (swaps.length >= 3 && !swaps.includes(id)) return alert("Máximo de 3 jogadores!");
        setSwaps(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]);
    };

    const isPreContract = t === 'PRE_CONTRATO';

    return (
        <div className="modal-bg">
            <div className="modal-content" style={{maxWidth: '500px'}}>
                <h3 style={{color:'var(--primary)'}}>
                    {isUrgentRenewal ? '🚨 Renovação Obrigatória' : (isPreContract ? '📝 Pré-Contrato' : (isCounter ? 'Responder Proposta' : `Negociar ${target.name}`))}

                    </div>
                )}

                {/* Se for pré-contrato, esconde essa parte pois não tem taxa */}
                {!shouldHidePart1 && !isPreContract ? (
                    <div style={{borderBottom: '1px solid #444', paddingBottom: 15, marginBottom: 15}}>

                                <button key={x} className={`btn ${t===x?'btn-green':'btn-ghost'}`} onClick={()=>setT(x)} style={{flex: 1}}>{x}</button>

                                <label style={{fontSize: '11px'}}>Duração (Máx: {maxLoanAllowed} Temp.)</label>
