        :root {

        body { background: var(--bg-dark); color: var(--text-main); font-family: 'Roboto', sans-serif; margin: 0; padding-bottom: 80px; -webkit-font-smoothing: antialiased; }
        .container { max-width: 800px; margin: 0 auto; padding: 15px; }
        .card { background: var(--bg-card); padding: 15px; border-radius: 12px; margin-bottom: 12px; border: 1px solid var(--border); box-shadow: 0 4px 6px rgba(0,0,0,0.4); position: relative; }
        .btn { width: 100%; padding: 12px; border-radius: 8px; border: none; font-weight: 800; cursor: pointer; text-transform: uppercase; font-size: 11px; letter-spacing: 0.5px; transition: 0.2s; margin-bottom: 5px; color: white; }
        .btn:active { transform: scale(0.98); }
        .btn-green { background: var(--primary); color: #000; }
        .btn-blue { background: var(--secondary); }
        .btn-red { background: var(--danger); }
        .btn-gold { background: var(--warning); color: #000; }
        .btn-purple { background: var(--purple); }
        .btn-ghost { background: transparent; border: 1px solid #666; color: #ccc; }
        .input-field { width: 100%; padding: 12px; background: var(--bg-input); border: 1px solid var(--border); color: white; border-radius: 8px; margin-bottom: 10px; box-sizing: border-box; font-family: inherit; font-size: 14px; }
        .input-field:focus { outline: 2px solid var(--primary); border-color: transparent; }
        .header { background: rgba(30, 30, 30, 0.95); backdrop-filter: blur(10px); padding: 15px; position: sticky; top: 0; z-index: 50; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .badge-pos { font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: 900; margin-right: 8px; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.8); }
        .player-ov { background: #003300; color: #00E676; border: 1px solid #00E676; padding: 2px 6px; border-radius: 4px; font-weight: 900; font-size: 14px; }
        .news-card { background: #262626; padding: 12px; border-radius: 8px; margin-bottom: 8px; border-left: 4px solid #666; font-size: 13px; line-height: 1.4; white-space: pre-wrap; }
        .news-transfer { border-color: var(--secondary); background: linear-gradient(90deg, #1a1a2e, #16213e); }
        .news-money { border-color: var(--primary); }
        .news-money-minus { border-color: var(--danger); }
        .news-admin { border-color: var(--warning); background: #2a2000; }
        .news-press { border-color: #00bcd4; background: #003333; }
        .bottom-nav { 
            position: fixed; 
            bottom: 0; 
            left: 0; 
            right: 0; 
            background: #1a1a1a; 
            border-top: 1px solid var(--border); 
            display: flex; 
            padding-bottom: env(safe-area-inset-bottom);

        .bottom-nav::-webkit-scrollbar { display: none; } /* Esconde barra no Chrome/Android */
        
        .nav-item { 
            flex: 0 0 auto; 
            min-width: 85px; /* Aumentado para facilitar o clique no iPhone */
            padding: 15px 5px; /* Mais espaço para o dedo */
            text-align: center; 
            color: #666; 
            font-size: 11px; /* Fonte mais legível */

        .scroll-hint {

        .football-field {
            width: 100%;
            aspect-ratio: 2 / 3; /* Formato vertical de campo */
            background: #2e7d32;
            background-image:

            position: relative;
            margin: 20px 0;
            overflow: hidden;

            content: '';

            top: 50%; left: 50%;

            border-radius: 50%;

    // FUNÇÃO DE EMERGÊNCIA (Ativar via Console F12 digitando: emergencyClearSales())
    async function emergencyClearSales() {
        const pass = prompt("Digite a senha master para limpar o banco:");
        if (pass !== '2503') return alert("Senha errada!");
        
        console.log("Iniciando faxina de emergência...");
        
        try {
            // 1. Limpa a coleção de vendas (mochilas) que causa o crash de objetos
            const salesSnap = await firebase.firestore().collection('sales').get();
            const b = firebase.firestore().batch();
            
            salesSnap.docs.forEach(doc => {
                b.delete(doc.ref);
            });
            
            // 2. Reseta fama e itens equipados dos jogadores (limpa dados zumbis)
            const playersSnap = await firebase.firestore().collection('players').get();
            playersSnap.docs.forEach(doc => {
                b.update(doc.ref, { 
                    equippedItem: firebase.firestore.FieldValue.delete(),
                    fame: 0 
                });
            });

            await b.commit();
            alert("✅ BANCO LIMPO COM SUCESSO! O App vai recarregar.");
            window.location.reload();
        } catch (e) {
            alert("Erro na limpeza: " + e.message);
            console.error(e);
        }
    }
</script>

// --- CALCULADORA DE SÓCIO TORCEDOR EM TEMPO REAL ---
const calculateSocios = (team, teamPlayers) => {
    if (!team) return 0;
    const baseBySerie = { 'A': 10000, 'B': 4000, 'C': 1500, 'D': 500, 'VARZEA': 100 };
    const base = baseBySerie[team.serie || 'VARZEA'] || 100;

    // 1. Fator Fama (Soma da fama do elenco / 20)
    const totalFame = teamPlayers.reduce((acc, p) => acc + (p.fame || 0), 0);
    const fameBonus = Math.floor(totalFame / 20);

    // 2. Fator Fase do Time (Últimos 5 jogos)
    const form = team.recentForm || []; // Ex: ['VITORIA', 'EMPATE', 'DERROTA']
    let formMultiplier = 1.0;
    if (form.length > 0) {
        const wins = form.filter(r => r === 'VITORIA').length;
        const losses = form.filter(r => r === 'DERROTA').length;
        if (wins > losses) formMultiplier += (wins * 0.06); // Até +30%
        if (losses > wins) formMultiplier -= (losses * 0.08); // Até -40%
    }

    const potentialSocios = Math.floor((base + fameBonus) * formMultiplier);

    // 3. Fator Ganância (Preço)
    const price = team.socioPrice || 40;
    let priceMultiplier = 1.0;
    if (price > 10) {
        // Equação linear: 10 = 100% de adesão | 150 = 10% de adesão
        priceMultiplier = 1.0 - ((price - 10) * 0.006428); 
    }
    if (priceMultiplier < 0.05) priceMultiplier = 0.05; // Mínimo de 5% de loucos que pagam qualquer preço

    return Math.max(0, Math.floor(potentialSocios * priceMultiplier));
};

const AwardsManager = ({ awards, teams, players, coaches, onClose }) => {
    const [tab, setTab] = useState('LIST');
    const [newA, setNewA] = useState({ name: '', desc: '', type: 'PLAYER', img: null });
    const [awardToGive, setAwardToGive] = useState(null);
    const [targetId, setTargetId] = useState('');
    const [tournName, setTournName] = useState('');

    const handleImgUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
            const img = new Image();
            img.src = event.target.result;
            img.onload = () => {
                const canvas = document.createElement('canvas');
                const MAX_SIZE = 150; // Compressor pesado para não pesar o banco
                let w = img.width, h = img.height;
                if (w > h) { if (w > MAX_SIZE) { h *= MAX_SIZE / w; w = MAX_SIZE; } } 
                else { if (h > MAX_SIZE) { w *= MAX_SIZE / h; h = MAX_SIZE; } }
                canvas.width = w; canvas.height = h;
                canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                setNewA({ ...newA, img: canvas.toDataURL('image/webp', 0.6) });
            };
        };
    };

    const handleCreateAward = async () => {
        if(!newA.name || !newA.img) return alert("Preencha nome e adicione uma imagem!");
        await firebase.firestore().collection('awards').add(newA);
        alert("Troféu/Prêmio criado na estante da Federação!");
        setTab('LIST'); setNewA({ name: '', desc: '', type: 'PLAYER', img: null });
    };

    const handleGiveAward = async () => {
        if(!targetId) return alert("Selecione quem vai receber o prêmio!");
        
        const payload = {
            awardId: awardToGive.id,
            name: awardToGive.name,
            desc: awardToGive.desc,
            img: awardToGive.img,
            tournament: tournName || 'Premiação de Gala',
            date: Date.now()
        };

        const col = awardToGive.type === 'TEAM' ? 'teams' : awardToGive.type === 'PLAYER' ? 'players' : 'users';
        
        await firebase.firestore().collection(col).doc(targetId).update({
            trophies: firebase.firestore.FieldValue.arrayUnion(payload)
        });

        alert("🏆 Prêmio entregue com sucesso! Já está na Sala de Troféus do vencedor.");
        setAwardToGive(null); setTargetId(''); setTournName('');
    };

    return (
        <div className="modal-overlay" style={{zIndex: 99999}}>
            <div className="modal-content" style={{border:'2px solid gold', maxWidth:'500px'}}>
                <div style={{display:'flex', justifyContent:'space-between', marginBottom:15}}>
                    <h3 style={{color:'gold', margin:0}}>🏆 Central de Premiações</h3>
                    <button className="btn btn-red" style={{width:'auto', padding:'2px 8px'}} onClick={onClose}>X</button>
                </div>

                <div style={{display:'flex', gap:5, marginBottom:15}}>
                    <button className={`btn ${tab==='LIST'?'btn-gold':'btn-ghost'}`} onClick={()=>setTab('LIST')}>ESTANTE</button>
                    <button className={`btn ${tab==='CREATE'?'btn-blue':'btn-ghost'}`} onClick={()=>setTab('CREATE')}>+ CRIAR TAÇA/MEDALHA</button>
                </div>

                {tab === 'CREATE' && (
                    <div className="animate-in">
                        <div style={{textAlign:'center', marginBottom:15}}>
                            {newA.img ? <img src={newA.img} style={{width:80, height:80, objectFit:'contain'}} /> : <div style={{width:80, height:80, background:'#222', display:'inline-flex', alignItems:'center', justifyContent:'center', borderRadius:8}}>📷</div>}
                            <label className="btn btn-ghost" style={{display:'block', width:'fit-content', margin:'10px auto', fontSize:10}}>
                                UPLOAD DA IMAGEM
                                <input type="file" style={{display:'none'}} accept="image/*" onChange={handleImgUpload} />
                            </label>
                        </div>
                        <input className="input-field" placeholder="Nome (Ex: Bola de Ouro, Taça Libertadores)" value={newA.name} onChange={e=>setNewA({...newA, name:e.target.value})} />
                        <input className="input-field" placeholder="Descrição Opcional" value={newA.desc} onChange={e=>setNewA({...newA, desc:e.target.value})} />
                        <label style={{fontSize:10, color:'#aaa'}}>Quem pode receber?</label>
                        <select className="input-field" value={newA.type} onChange={e=>setNewA({...newA, type:e.target.value})}>
                            <option value="TEAM">Clubes</option>
                            <option value="PLAYER">Jogadores</option>
                            <option value="COACH">Técnicos</option>
                        </select>
                        <button className="btn btn-green" onClick={handleCreateAward}>SALVAR PRÊMIO NO SISTEMA</button>
                    </div>
                )}

                {tab === 'LIST' && (
                    <div className="animate-in">
                        {awardToGive ? (
                            <div className="card" style={{border:'1px solid var(--primary)'}}>
                                <h4 style={{marginTop:0, color:'var(--primary)'}}>Entregar: {awardToGive.name}</h4>
                                <input className="input-field" placeholder="Nome do Campeonato/Evento (Ex: Série A 2026)" value={tournName} onChange={e=>setTournName(e.target.value)} />
                                <select className="input-field" value={targetId} onChange={e=>setTargetId(e.target.value)}>
                                    <option value="">-- Selecione o Vencedor --</option>
                                    {awardToGive.type === 'TEAM' && teams.map(t=><option key={t.id} value={t.id}>{t.name}</option>)}
                                    {awardToGive.type === 'PLAYER' && players.map(p=><option key={p.id} value={p.id}>{p.name} ({teams.find(x=>x.id===p.teamId)?.name||'Livre'})</option>)}
                                    {awardToGive.type === 'COACH' && coaches.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
                                </select>
                                <div style={{display:'flex', gap:5, marginTop:10}}>
                                    <button className="btn btn-green" onClick={handleGiveAward}>ENTREGAR 🏆</button>
                                    <button className="btn btn-red" onClick={()=>setAwardToGive(null)}>CANCELAR</button>
                                </div>

                        ) : (
                            <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:10, maxHeight:'350px', overflowY:'auto'}}>
                                {awards.map(a => (
                                    <div key={a.id} className="card" style={{textAlign:'center', padding:10}}>
                                        <img src={a.img} style={{width:50, height:50, objectFit:'contain', marginBottom:5}} />

                                        <div style={{fontSize:9, color:'#888', margin:'5px 0'}}>{a.type === 'TEAM' ? 'Para Clubes' : a.type === 'PLAYER' ? 'Para Jogadores' : 'Para Técnicos'}</div>
                                        <div style={{display:'flex', gap:5}}>
                                            <button className="btn btn-gold" style={{fontSize:9, padding:'5px'}} onClick={()=>setAwardToGive(a)}>PREMIAR ALGUÉM</button>
                                            <button className="btn btn-red" style={{fontSize:9, padding:'5px', width:'30px'}} onClick={async ()=>{ if(confirm("Apagar molde do prêmio?")) await firebase.firestore().collection('awards').doc(a.id).delete(); }}>X</button>

                                {awards.length === 0 && <p style={{gridColumn:'span 2', textAlign:'center', color:'#666', fontSize:11}}>Nenhum prêmio criado ainda.</p>}

const getProdCost = (cat, power) => {
    const p = parseInt(power) || 0;
    
    // 1. SAÚDE / ENERGIA (Mais barato, pois consome muito)
    // Ex: Power 50 = 50 * 15 = 750
    // Ex: Power 100 = 100 * 15 = 1.500
    if (['energy', 'SAUDE', 'CONSUMIVEL'].includes(cat)) {
        return p * 15; 
    }
    
    // 2. TREINO / XP (Médio, pois dá vantagem competitiva)
    // Ex: Power 50 = 50 * 100 = 5.000
    // Ex: Power 100 = 100 * 100 = 10.000
    if (['training', 'CHUTEIRA', 'LUVAS'].includes(cat)) {
        return p * 100; 
    }
    
    // 3. FAMA / LUXO (Muito caro, pois é status)
    // Ex: Power 50 = 50 * 500 = 25.000
    // Ex: Power 100 = 100 * 500 = 50.000
    if (['vehicle', 'real_estate', 'VEICULO', 'IMOVEL', 'TECNOLOGIA', 'LUXO'].includes(cat)) {
        return p * 500;
    }
    
    return 50; // Custo base de segurança
};

// Gerador de Atributos V3.1 (Com Pontas PTD/PTE)
const generateAttributes = (pos, targetOv) => {
    const ov = parseInt(targetOv) || 50;
    const attrs = {};
    const keys = Object.keys(ATTR_LABELS);

    let primary = [], secondary = [];

    if (pos === 'GOL') {
        primary = ['gk', 'response', 'jump', 'longPass'];
        secondary = ['balance', 'condition', 'mentality', 'defense'];
    } else if (pos.includes('ZAG')) {
        primary = ['defense', 'header', 'balance', 'jump', 'aggression'];
        secondary = ['stamina', 'response', 'shortPass', 'longPass'];
    } else if (pos.includes('LAT') || pos.includes('LD') || pos.includes('LE')) {
        primary = ['speed', 'accel', 'stamina', 'shortPass', 'dribble'];
        secondary = ['defense', 'longPass', 'curve', 'attack'];
    } else if (pos.includes('VOL') || pos.includes('MC') || pos === 'MD' || pos === 'ME') {
        primary = ['shortPass', 'stamina', 'teamwork', 'defense', 'balance'];
        secondary = ['longPass', 'tech', 'shotPower', 'vision'];
    } else if (pos.includes('MEI') || pos.includes('MAT')) {
        primary = ['dribble', 'shortPass', 'vision', 'tech', 'curve', 'agility'];
        secondary = ['shot', 'speed', 'attack', 'freeKick'];
        
    // --- NOVO BLOCO ESPECÍFICO PARA PONTAS (PTD / PTE) ---
    } else if (pos === 'PTD' || pos === 'PTE') {
        // Pontas precisam de muita velocidade, drible e cruzamento (curve/longPass)
        primary = ['speed', 'accel', 'dribble', 'agility', 'curve'];
        secondary = ['shot', 'stamina', 'longPass', 'technique'];

    // --- BLOCO PARA CENTROAVANTES (ATA / SA) ---
    } else if (pos.includes('ATA') || pos.includes('SA') || pos.includes('PNT')) {
        primary = ['shot', 'attack', 'header', 'shotPower', 'balance'];
        secondary = ['speed', 'reaction', 'dribble', 'strength'];
    }

    // 1. Geração Base
    keys.forEach(k => {
        let base = ov;
        
        if (primary.includes(k)) {
            base += Math.floor(Math.random() * 6) + 2; 
        } else if (secondary.includes(k)) {
            base -= Math.floor(Math.random() * 4); 
        } else {
            base -= Math.floor(Math.random() * 10) + 5; 
        }

        if (pos !== 'GOL' && k === 'gk') base = 10; 
        if (pos === 'GOL' && ['shot', 'attack', 'dribble', 'curve', 'freeKick'].includes(k)) base = Math.max(15, base - 20);

        if (ov < 80 && base > 88) base = 88;
        if (base > 99) base = 99;
        if (base < 1) base = 1;
        
        attrs[k] = base;
    });

    // 2. Normalização
    const relevantKeys = keys.filter(k => {
        if (pos === 'GOL') return !['shot', 'attack', 'dribble', 'curve', 'freeKick', 'weakFootAcc', 'weakFootFreq'].includes(k);
        return k !== 'gk';
    });
    
    let sum = 0;
    relevantKeys.forEach(k => sum += attrs[k]);
    const currentAvg = sum / relevantKeys.length;
    const diff = ov - currentAvg;
    
    relevantKeys.forEach(k => {
        let boost = diff;
        if (attrs[k] > 90 && ov < 85 && diff > 0) boost = 0;
        let newVal = attrs[k] + boost;
        if (newVal > 99) newVal = 99;
        if (newVal < 1) newVal = 1;
        attrs[k] = Math.round(newVal);
    });

    return attrs;
};

        if (!nextDb) return;

        if (confirm(`Evoluir para ${nextDb.name} por ${fmt(db.upgCost)}?\n\nA manutenção semanal passará a ser de ${fmt(nextDb.maint)}.`)) {
            await firebase.firestore().collection('teams').doc(team.id).update({
                balance: firebase.firestore.FieldValue.increment(-db.upgCost),

                ticketPrice: nextDb.minTic
            });

            onClose();
        }

    const handleFinanceStadium = async () => {
        if (!nextDb) return;
        if (team.stadiumLoan && team.stadiumLoan.installments > 0) return alert("🚫 Você já possui um financiamento de estádio em andamento. Quite-o antes de fazer outra obra.");
        
        const upgCost = db.upgCost;
        const totalOwed = upgCost * 1.10;

            await firebase.firestore().collection('teams').doc(team.id).update({
                stadiumLevel: lvl + 1,
                ticketPrice: nextDb.minTic,

    const handleWithdrawStore = async () => {

            await firebase.firestore().collection('teams').doc(team.id).update({

            img.onload = async () => {

                const MAX_WIDTH = 800; 
                let width = img.width;

                if (width > MAX_WIDTH) {
                    height *= MAX_WIDTH / width;
                    width = MAX_WIDTH;
                }

                canvas.width = width;
                canvas.height = height;
                ctx.drawImage(img, 0, 0, width, height);

        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();

        reader.onload = (ev) => {
            const img = new Image();
            img.src = ev.target.result;
            img.onload = () => {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                const MAX_W = 600; 
                let w = img.width; let h = img.height;
                if (w > MAX_W) { h *= MAX_W / w; w = MAX_W; }
                canvas.width = w; canvas.height = h;
                ctx.drawImage(img, 0, 0, w, h);
                setNewImg(canvas.toDataURL('image/jpeg', 0.7));

const GameCalendar = ({ calendar }) => {
    if (!calendar || !calendar.date) return null;

    // Formata a data (Ex: 2026-03-15 vira 15/03/2026)
    const [ano, mes, dia] = calendar.date.split('-');
    const dateBr = `${dia}/${mes}/${ano}`;

    // Pega o nome do mês para ficar bonito
    const monthNames = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];
    const monthName = monthNames[parseInt(mes) - 1];

    // Filtra os eventos para mostrar apenas os de hoje em diante (e ordena por data)
    const upcomingEvents = (calendar.events || [])
        .filter(e => e.date >= calendar.date)
        .sort((a, b) => new Date(a.date) - new Date(b.date));

    return (
        <div className="card" style={{background:'linear-gradient(45deg, #1a1a1a, #001a00)', border:'1px solid var(--primary)', marginBottom: 20, display:'flex', gap:15, alignItems:'stretch'}}>
            {/* Bloco do Dia Atual */}
            <div style={{background:'#000', padding:'10px', borderRadius:8, textAlign:'center', minWidth:'80px', border:'1px solid #333', display:'flex', flexDirection:'column', justifyContent:'center'}}>
                <div style={{fontSize:10, color:'var(--primary)', textTransform:'uppercase', fontWeight:'bold'}}>{monthName}</div>
                <div style={{fontSize:30, fontWeight:'900', color:'#fff', lineHeight:1}}>{dia}</div>
                <div style={{fontSize:10, color:'#888'}}>{ano}</div>
            </div>
            
            {/* Bloco de Eventos */}
            <div style={{flex:1, display:'flex', flexDirection:'column', justifyContent:'center'}}>
                <div style={{fontSize:11, color:'#aaa', marginBottom:5, fontWeight:'bold'}}>
                    <i className="fas fa-calendar-alt"></i> PRÓXIMOS EVENTOS:
                </div>
                {upcomingEvents.length === 0 ? (
                    <div style={{fontSize:12, color:'#666', fontStyle:'italic'}}>Nenhum evento agendado.</div>
                ) : (
                    <div style={{display:'flex', flexDirection:'column', gap:4, maxHeight:'60px', overflowY:'auto'}}>
                        {upcomingEvents.slice(0, 3).map((ev, i) => {
                            const isToday = ev.date === calendar.date;
                            return (
                                <div key={i} style={{fontSize:11, display:'flex', gap:5, alignItems:'center', color: isToday ? 'gold' : '#ddd'}}>
                                    <b style={{color: isToday ? 'gold' : 'var(--primary)'}}>
                                        {isToday ? 'HOJE' : `${ev.date.split('-')[2]}/${ev.date.split('-')[1]}`}
                                    </b> 
                                    <span>- {ev.text}</span>
                                </div>
                            );
                        })}
                    </div>
                )}
            </div>
        </div>
    );
};

    // Isso garante que a Fama seja SEMPRE a soma dos itens na mochila.
    // Se o jogador tiver 2 bonés (200), e estiver mostrando 300, isso corrige para 200 na hora.
   useEffect(() => {
        if (!user || user.type !== 'PLAYER' || !sales || sales.length === 0) return;

        const myInventory = sales.filter(s => s.buyerId === user.data.id);

            // Verifica se é um item que dá fama (Luxo, Veículo, etc)
            if (['VEICULO', 'IMOVEL', 'TECNOLOGIA', 'LUXO'].includes(item.cat)) {
                // Garante que estamos somando apenas NÚMEROS para evitar erro de [object Object]
                const gained = parseInt(item.fameGained) || 0;
                return total + gained;
            }
            return total;
        }, 0);

        // 3. Se o valor no perfil estiver errado, corrige no Banco de Dados
        if (typeof realFame === 'number' && (user.data.fame || 0) !== realFame) {

                }

                if (loginId === 'admin' && loginPass === '2503') { 
                    foundUser = { name: 'Admin' }; foundType = 'ADMIN';

            // 3. FINALIZA O LOGIN
            if (foundUser) {
                if(foundUser.status === 'PENDING') {
                     alert("Conta em análise pela Federação. Aguarde aprovação.");
                } else if(foundUser.status === 'BLOCKED') {
                     alert("Conta bloqueada.");

            return cA - cB; // Menos cartões é melhor
        });

        // Pega as tabelas finais filtrando times ativos
        const tA = sortTable(teams.filter(t => t.serie === 'A' && t.status !== 'PENDING'));
        const tB = sortTable(teams.filter(t => t.serie === 'B' && t.status !== 'PENDING'));
        const tC = sortTable(teams.filter(t => t.serie === 'C' && t.status !== 'PENDING'));
        const tD = sortTable(teams.filter(t => t.serie === 'D' && t.status !== 'PENDING'));
        const tVarzea = sortTable(teams.filter(t => t.serie === 'VARZEA' && t.status !== 'PENDING'));

        // =========================================
        // 1. DISTRIBUIÇÃO DAS PREMIAÇÕES DE FIM DE ANO (DINÂMICA)
        // =========================================
        const activePrizes = conf.prizes || DEFAULT_PRIZES;

        const calculatePrize = (serie, index, totalTeams) => {
            const pos = index + 1;
            const isRelegated = (serie === 'A' || serie === 'B' || serie === 'C') && index >= totalTeams - 2;
            const isRelegatedD = serie === 'D' && index >= totalTeams - 3;
            const p = activePrizes[serie] || DEFAULT_PRIZES[serie];

            if (serie === 'A') {
                if (pos === 1) return p.champ;
                if (pos === 2) return p.vice;
                if (pos === 3) return p.third;
                if (isRelegated) return p.rel; 
                return p.mid; 
            }
            if (serie === 'B' || serie === 'C') {
                if (pos === 1) return p.champ;
                if (pos === 2) return p.vice;
                if (isRelegated) return p.rel; 
                return p.mid; 
            }
            if (serie === 'D') {
                if (pos === 1) return p.champ;
                if (pos === 2) return p.vice;
                if (isRelegatedD) return p.rel; 
                return p.mid; 
            }
            if (serie === 'VARZEA') {
                if (pos === 1) return p.champ;
                if (pos === 2) return p.vice;
                if (pos === 3) return p.third;
                return p.mid; 
            }
            return 0;
        };

        const awardPrizes = (teamList, serieName) => {
            teamList.forEach((t, i) => {
                const prize = calculatePrize(serieName, i, teamList.length);
                b.update(db.collection('teams').doc(t.id), {
                    balance: firebase.firestore.FieldValue.increment(prize)
                });
            });
        };

        awardPrizes(tA, 'A');
        awardPrizes(tB, 'B');
        awardPrizes(tC, 'C');
        awardPrizes(tD, 'D');
        awardPrizes(tVarzea, 'VARZEA');

        const champA = tA[0]?.name || 'Ninguém';
        const champB = tB[0]?.name || 'Ninguém';
        const champC = tC[0]?.name || 'Ninguém';
        const champD = tD[0]?.name || 'Ninguém';
        
        postNews(`🏆 **FIM DA TEMPORADA ${currentSeason}!**\nAs premiações foram depositadas! Parabéns aos campeões:\n\n🥇 Série A: ${champA}\n🥈 Série B: ${champB}\n🥉 Série C: ${champC}\n🏅 Série D: ${champD}`, 'finance');

        // =========================================
        // 2. PROMOÇÃO E REBAIXAMENTO
        // =========================================
        if (tA.length > 0 || tB.length > 0) {
            tA.slice(-2).forEach(t => b.update(db.collection('teams').doc(t.id), { serie: 'B' }));
            tB.slice(0, 2).forEach(t => b.update(db.collection('teams').doc(t.id), { serie: 'A' }));
            tB.slice(-2).forEach(t => b.update(db.collection('teams').doc(t.id), { serie: 'C' }));
            tC.slice(0, 2).forEach(t => b.update(db.collection('teams').doc(t.id), { serie: 'B' }));
            tC.slice(-2).forEach(t => b.update(db.collection('teams').doc(t.id), { serie: 'D' }));
            tD.slice(0, 2).forEach(t => b.update(db.collection('teams').doc(t.id), { serie: 'C' }));
            tD.slice(-3).forEach(t => b.update(db.collection('teams').doc(t.id), { serie: 'VARZEA' }));
            tVarzea.slice(0, 3).forEach(t => b.update(db.collection('teams').doc(t.id), { serie: 'D' }));
        }

        // =========================================
        // 3. ZERA ESTATÍSTICAS DOS TIMES
        // =========================================
        teams.forEach(t => {
            b.update(db.collection('teams').doc(t.id), {
                stats: { pts:0, wins:0, draws:0, losses:0, gf:0, ga:0, cards:0 }
            });

        // =========================================
        players.forEach(p => {
            // 4.1. APLICAÇÃO DOS BOOSTS DE NOVA POSIÇÃO (TREINO DO CT)
            if (p.pendingPosBoosts && p.attributes) {
                let newAttrs = { ...p.attributes };
                p.pendingPosBoosts.forEach(pos => {
                    const map = POS_TRAINING_MAP[pos];
                    if (map) {
                        // Dá +3 pontos pesados nas habilidades chave daquela posição
                        map.attrs.forEach(a => {
                            if (newAttrs[a] < 99) newAttrs[a] = Math.min(99, newAttrs[a] + 3);
                        });
                    }
                });
                
                // Recalcula o Overall Real
                const vals = Object.values(newAttrs);
                let newOvr = Math.round(vals.reduce((a,b)=>a+b,0)/vals.length);
                
                b.update(db.collection('players').doc(p.id), {
                    attributes: newAttrs,
                    overall: newOvr,
                    pendingPosBoosts: firebase.firestore.FieldValue.delete()
                });
            }
            let nc = (parseInt(p.contract) || 0) - 1;
            if (nc < 0) nc = 0;
            
            if (nc === 0) {
                 if (!p.loanMeta || !p.loanMeta.ownerId) {
                     // Fim de contrato definitivo (Cai nos Agentes Livres)
                     b.update(db.collection('players').doc(p.id), { contract: 0, teamId: 'FREE', status: 'VENDA' });
                 } else {
                     // Fim de empréstimo: Volta pro time original
                     b.update(db.collection('players').doc(p.id), { 
                         teamId: p.loanMeta.ownerId, 
                         contract: parseInt(p.loanMeta.originalContract) > 0 ? parseInt(p.loanMeta.originalContract) : 1,

                     });

                 b.update(db.collection('players').doc(p.id), { contract: nc });

                    b.update(doc.ref, { teamId: 'FREE', contract: 0, salary: 2500 });
                } else {
                    b.update(doc.ref, { contract: newContract });
                }
            }
        });

        await b.commit();
        setLoading(false);
        alert(`Temporada ${currentSeason} encerrada com sucesso!\n\nPremiações pagas, acessos e descensos definidos!`);
    };

   const buyProduct = async (prod, seller) => {
        const buyerBalance = user.data.balance || 0;
        const price = parseFloat(prod.price);
        const currentStock = parseInt(prod.stock) || 0;

        // 1. Validações
        if (currentStock <= 0) return alert("Produto Esgotado!");
        if (buyerBalance < price) return alert("Saldo insuficiente!");
        if (!confirm(`Comprar ${prod.name} por ${fmt(price)}?`)) return;

        setLoading(true);

        // 2. Recupera o custo histórico que foi salvo no produto para cálculo de relatório
        // (Nota: Isso é apenas visual para o histórico, não afeta o saldo)
        const historicCost = parseFloat(prod.productionCost) || 0; 
        // O custo unitário aproximado é o custo do lote / quantidade total original... 
        // Mas para simplificar o log, vamos considerar que o lucro bruto agora é o preço cheio,
        // já que o custo saiu do caixa da empresa lá atrás (na fabricação).
        
        // Se quiser ser muito preciso contabilmente: Lucro da Operação = Preço.
        // O "Lucro Líquido" real a empresa vê no balanço geral.
        
        const b = db.batch();
        
        // 3. MOVIMENTAÇÃO FINANCEIRA
        
        // A. Tira do Comprador (Jogador/Time)
        if (user.type === 'PLAYER') {
            b.update(db.collection('players').doc(user.data.id), { 
                balance: firebase.firestore.FieldValue.increment(-price) 
            });
        } else if (user.type === 'COACH') { 
            b.update(db.collection('users').doc(user.data.id), { 
                balance: firebase.firestore.FieldValue.increment(-price) 
            });
        } else {
            b.update(db.collection('teams').doc(user.data.id), { 
                balance: firebase.firestore.FieldValue.increment(-price) 
            });
        }

        // B. Paga a Empresa (VALOR CHEIO, pois o custo já foi pago na fábrica)
        b.update(db.collection('companies').doc(seller.id), { 
            balance: firebase.firestore.FieldValue.increment(price) 
        });

        // 4. BAIXA NO ESTOQUE (Diminui 1 unidade)
        b.update(db.collection('products').doc(prod.id), {
            stock: firebase.firestore.FieldValue.increment(-1)
        });

        // 5. Gera o Item na Mochila do Jogador
        // Recalcula Fama/Poder visual para salvar no item
        let fameBonus = 0;
        if (['VEICULO', 'IMOVEL', 'TECNOLOGIA', 'LUXO'].includes(prod.cat)) {
            fameBonus = (parseInt(prod.power) || 0) * 100;
        }

        const saleRef = db.collection('sales').doc();
        b.set(saleRef, { 
            companyId: seller.id, 
            buyerId: user.data.id, 
            buyerName: user.data.name, 
            
            productOriginalId: prod.id,
            productName: prod.name, 
            price: price,
            cost: 0, // Custo é 0 nesta transação pois já foi pago na fábrica
            profit: price, // Lucro de caixa imediato é o preço cheio
            
            img: prod.img, 
            cat: prod.cat,
            
            // Grava os atributos fixos
            power: parseInt(prod.power) || 0, 
            fameGained: fameBonus, 
            
            date: Date.now() 
        });
        
        try {
            await b.commit();
            
            // Atualiza saldo visualmente na hora
            setUser(prev => ({
                ...prev,
                data: { ...prev.data, balance: buyerBalance - price }
            }));

            let msg = `✅ Compra realizada com sucesso!`;
            if (fameBonus > 0) msg += `\n🌟 FAMA +${fameBonus} (Verifique seu perfil)`;
            alert(msg);
        } catch (error) {
            console.error(error);
            alert("Erro ao processar compra: " + error.message);
        }
        setLoading(false);
    };

            else if (currentTox >= 3) {

                b.update(coachRef, {

            // CENÁRIO B: SUCESSO (Deu Bom)
            else {
                const energyGain = parseInt(item.power) || 0;

                });

                if (currentTox === 1) {

                    alert(`⚡ Energia recuperada: +${energyGain}%\n⛔ PERIGO: Seu estômago está no limite! Pare de consumir agora!`);
                } else {
                    alert(`⚡ Energia recuperada: +${energyGain}% (Total: ${newEnergy}%)`);
                }
            }

        }

    const handleLogoUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.readAsDataURL(file);
        
        reader.onload = (event) => {
            const img = new Image();
            img.src = event.target.result;
            
            img.onload = () => {
                // Cria um Canvas para redimensionar (Compressão)
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                
                // Define tamanho máximo para logo (200px é suficiente e leve)
                const MAX_SIZE = 200;
                let width = img.width;
                let height = img.height;

                // Redimensiona mantendo a proporção
                if (width > height) {
                    if (width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; }
                } else {
                    if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; }
                }

                canvas.width = width;
                canvas.height = height;
                
                // Desenha a imagem redimensionada
                ctx.drawImage(img, 0, 0, width, height);

                // Converte para Texto Base64 leve (JPEG qualidade 0.8)
                const dataUrl = canvas.toDataURL('image/jpeg', 0.8);

                // Atualiza o estado do formulário imediatamente com a nova imagem
                setF({ ...form, logo: dataUrl });
            };
        };
    };

            return alert(`Você está muito cansado para realizar esta atividade! Energia atual: ${coachEnergy}% (Necessário: ${coachEnergyCost}%)`);
        }

        setLoading(true);
        const b = db.batch();
        let coachXpGain = 0;
        let report = [];

        const activePerks = currentCoach.perks || [];
        const energyPerk = activePerks.find(p => p.type === 'ENERGY_SAVE');
        const playerEnergyCost = energyPerk ? Math.round(10 * energyPerk.value) : 10; 
        const critPerk = activePerks.find(p => p.type === 'CRIT_CHANCE');
        const critBonus = critPerk ? critPerk.value : 0;
        const minXpPerk = activePerks.find(p => p.type === 'MIN_XP_BOOST');
        const minXpBonus = minXpPerk ? minXpPerk.value : 0;
        const affPerk = activePerks.find(p => p.type === 'AFFINITY_BOOST');
        const affBonus = affPerk ? affPerk.value : 0;

        // Bônus do CT do Time
        const currentTeam = teams.find(t => t.id === currentCoach.teamId);
        const ctLvl = currentTeam?.ctLevel || 1;
        const ctBonusMult = CT_DB[ctLvl].bonusXP / 100;

        let trainedAttrs = [];
        if(type === 'FISICO_BASE') trainedAttrs = ['stamina', 'balance', 'condition', 'strength'];
        else if(type === 'VELOCIDADE') trainedAttrs = ['speed', 'accel', 'agility', 'dribbleSpd'];
        else if(type === 'IMPULSAO') trainedAttrs = ['jump', 'header', 'condition'];
        else if(type === 'CHUTE') trainedAttrs = ['shot', 'shotPower', 'shotTech', 'weakFootAcc'];
        else if(type === 'PASSE') trainedAttrs = ['shortPass', 'longPass', 'shortPassSpd', 'longPassSpd', 'tech', 'weakFootFreq'];
        else if(type === 'DRIBLE') trainedAttrs = ['dribble', 'dribbleSpd', 'agility', 'tech'];
        else if(type === 'DEFESA') trainedAttrs = ['defense', 'aggression', 'response'];
        else if(type === 'MENTAL') trainedAttrs = ['teamwork', 'mentality', 'response'];
        else if(type === 'BOLA_PARADA') trainedAttrs = ['freeKick', 'curve', 'header', 'penalties'];
        else if(type === 'GOLEIRO') trainedAttrs = ['gk', 'response', 'jump', 'longPass'];
        else if(type === 'STUDY') trainedAttrs = [];

        playerIds.forEach(pid => {
            const p = players.find(x => x.id === pid);
            if (!p) return;

            const currentEnergy = p.energy !== undefined ? p.energy : 100;

            if ((p.recoveryLeft || 0) > 0) {
                report.push(`⚠️ ${p.name} ignorado (está lesionado)`);
                return;
            }
            if (currentEnergy < playerEnergyCost) {
                report.push(`⚠️ ${p.name} ignorado (exausto: ${currentEnergy}%)`);
                return;
            }

            if (Math.random() < 0.01) {
                const injuryName = INJURIES_DB.LEVE[Math.floor(Math.random() * INJURIES_DB.LEVE.length)];
                b.update(db.collection('players').doc(p.id), {
                    injury: injuryName,
                    recoveryLeft: 1,
                    energy: Math.max(0, currentEnergy - 15),
                    mood: '😡'
                });
                report.push(`❌ ${p.name} se lesionou no treino: ${injuryName}`);
                return; 
            }

            const newEnergy = currentEnergy - playerEnergyCost;
            let baseGain = Math.floor(Math.random() * 5) + 8 + minXpBonus; 
            
            // Aplica Bônus do CT
            let xpGain = baseGain + Math.floor(baseGain * ctBonusMult);

            if ((currentCoach.affinities || []).includes(p.position)) xpGain += (5 + affBonus);

            if (p.equippedItem) {
                const itemBonusPercent = p.equippedItem.power || 0;
                const bonusAmount = Math.ceil(xpGain * (itemBonusPercent / 100));
                xpGain += bonusAmount;
                report.push(`👟 ${p.name} usou ${p.equippedItem.name} (+${bonusAmount} XP)`);
                b.delete(db.collection('sales').doc(p.equippedItem.id));
                b.update(db.collection('players').doc(pid), { equippedItem: firebase.firestore.FieldValue.delete() });
            }

            activePerks.forEach(perk => {
                if (perk.type === 'TRAIN_BOOST') {
                    const hasSynergy = perk.attrs.some(attr => trainedAttrs.includes(attr));
                    if (hasSynergy) xpGain = Math.round(xpGain * perk.multiplier);
                }
                if (perk.type === 'YOUTH_BOOST') {
                    const age = p.age || 18;
                    if (age <= perk.ageLimit) xpGain = Math.round(xpGain * perk.multiplier);
                }
            });

            if (Math.random() < (0.10 + critBonus)) {
                xpGain *= 2;
                report.push(`🔥 ${p.name} teve uma GRANDE evolução (+${xpGain} XP)!`);
            }

            let newAttrs = { ...(p.attributes || {}) };
            trainedAttrs.forEach(attr => {
                if((newAttrs[attr] || 50) < 99) {
                    if(Math.random() < (xpGain / 80)) newAttrs[attr] = (newAttrs[attr] || 50) + 1;
                }
            });

            let updates = { 
                xp: (p.xp || 0) + xpGain, 
                energy: newEnergy,
                attributes: newAttrs
            };

            // --- LÓGICA DE APRENDER NOVA POSIÇÃO ---
            if (p.learningPosition) {
                if (type === POS_TRAINING_MAP[p.learningPosition.target].train) {
                    let posProgress = 10; // Progresso base
                    if ((currentCoach.affinities || []).includes(p.learningPosition.target)) posProgress += 5; // Bônus do técnico
                    posProgress += (ctLvl * 2); // Bônus do CT
                    
                    const newCur = p.learningPosition.current + posProgress;
                    if (newCur >= p.learningPosition.required) {
                        report.push(`🌟 ${p.name} APRENDEU a jogar de ${p.learningPosition.target}! (O Boost de atributos entrará na próxima temporada)`);
                        updates.secondaryPositions = firebase.firestore.FieldValue.arrayUnion(p.learningPosition.target);
                        updates.learningPosition = firebase.firestore.FieldValue.delete();
                        updates.pendingPosBoosts = firebase.firestore.FieldValue.arrayUnion(p.learningPosition.target);
                    } else {
                        updates['learningPosition.current'] = newCur;
                        report.push(`🔄 ${p.name} adaptando para ${p.learningPosition.target}: ${Math.min(100, Math.floor((newCur/p.learningPosition.required)*100))}%`);
                    }
                } else {
                    report.push(`⚠️ ${p.name} precisa do treino de ${POS_TRAINING_MAP[p.learningPosition.target].train} para evoluir na nova posição.`);
                }
            }

            b.update(db.collection('players').doc(pid), updates);
            coachXpGain += 20;
        });

        if (type === 'STUDY') {
            coachXpGain = Math.floor(Math.random() * 10) + 15;
            report.push("📚 Você dedicou tempo estudando novas táticas e evoluiu como treinador.");
        }

        let newCoachXp = (currentCoach.xp || 0) + coachXpGain;
        let newLevel = currentCoach.level;
        let pendingPerks = currentCoach.pendingPerks || 0;
        let pendingAffinity = currentCoach.pendingAffinity || 0;
        
        const xpNeed = newLevel * 120;
        if (newCoachXp >= xpNeed && newLevel < 30) {
            newCoachXp -= xpNeed;
            newLevel++;
            if (newLevel % 5 === 0) pendingPerks++;
            if ([10, 20, 30].includes(newLevel)) pendingAffinity++;
            alert(`🎉 PARABÉNS! Nível ${newLevel} alcançado!`);
        }

        b.update(db.collection('users').doc(currentCoach.id), {
            energy: coachEnergy - coachEnergyCost,
            xp: newCoachXp,
            level: newLevel,
            pendingPerks,
            pendingAffinity
        });

        // GRAVA NO MURAL DO CLUBE
        if (currentTeam) {
            let newLogs = currentTeam.trainingLogs || [];
            newLogs.unshift({ date: Date.now(), type, report: report.join('\n') });
            if (newLogs.length > 5) newLogs.pop(); // Mantém só os últimos 5
            b.update(db.collection('teams').doc(currentTeam.id), { trainingLogs: newLogs });
        }

        await b.commit();
        setLoading(false);
        
        let msg = type === 'STUDY' ? "Estudo concluído!" : "Treino realizado com sucesso!";
        if(report.length > 0) msg += "\n\n" + report.join("\n");
        alert(msg);
    };

    const handleEvolveCoachPerk = async (perk) => {
        // Atualiza no Banco de Dados
        await db.collection('users').doc(user.data.id).update({
            perks: firebase.firestore.FieldValue.arrayUnion(perk),
            pendingPerks: firebase.firestore.FieldValue.increment(-1)
        });

        // ATUALIZAÇÃO VISUAL IMEDIATA (Para a tela sumir na hora)
        setUser(prev => ({
            ...prev,
            data: {
                ...prev.data,
                perks: [...(prev.data.perks || []), perk],
                pendingPerks: (prev.data.pendingPerks || 1) - 1
            }
        }));

        alert(`Habilidade "${perk.name}" aprendida!`);
    };
            //FIM

const sendOffer = async (target, type, value, swapIds, con, meta, old) => {
    try {
        const v = parseFloat(value) || 0;
        const contractYears = parseInt(con) || 1;
        const actingTeamName = user.data.name;
        const targetPlayerName = target.name;
        const finalSal = parseFloat(meta.newSalary) || 0;
        const role = meta.role || 'ROTACAO';

        let details = `💰 Taxa: ${fmt(v)}\n`;
        if (meta.installments > 1) details += `📅 Parcelamento: ${meta.installments}x de ${fmt(v / meta.installments)}\n`;
        if (meta.sellOn > 0) details += `📈 Revenda: ${meta.sellOn}%\n`;

        // --- AJUSTE VISUAL: SE FOR PRÉ-CONTRATO OU RENOVAÇÃO ---
        if (type === 'PRE_CONTRATO') {
            details = `⚖️ **LEI BOSMAN (PRÉ-CONTRATO)**\nO jogador virá a custo zero no início da próxima temporada.\n`;
        } else if (type === 'RENOVACAO') {
            details = `📝 **PROPOSTA DE RENOVAÇÃO**\nA diretoria ofereceu um novo contrato.\n`;
        }

        details += `📝 Contrato: ${contractYears} anos\n`;
        details += `💵 Salário Sugerido: ${fmt(finalSal)}/sem\n`;
        details += `👔 Papel: ${role}`;

        // --- LÓGICA DE DESTINATÁRIO INTELIGENTE ---
        let recipientId; 

        if (old && old.id) {
            // CASO ESPECIAL 1: CONTRAPROPOSTA DE RENOVAÇÃO URGENTE
            if (old.type === 'RENOVACAO_URGENTE') {
                recipientId = old.playerId;
            } 
            // CASO ESPECIAL 2: ACORDO ENTRE CLUBES JÁ SELADO
            else if (old.sellerAccepted === true) {
                recipientId = (user.data.id === old.buyerId) ? old.playerId : old.buyerId;
            } 
            // CASO NORMAL: NEGOCIAÇÃO FINANCEIRA (ENTRE CLUBES)
            else {
                if (user.data.id === old.buyerId) {
                    recipientId = (old.sellerId === 'FREE' || !old.sellerId) ? old.playerId : old.sellerId;
                } else {
                    recipientId = old.buyerId;
                }
            }
        } else {
            // OFERTA NOVA (Primeiro contato)
            // >>> CORREÇÃO: SE FOR PRÉ-CONTRATO OU RENOVAÇÃO, VAI DIRETO PRO JOGADOR <<<
            if (type === 'PRE_CONTRATO' || type === 'RENOVACAO') {
                recipientId = target.id; 
            } else {
                // Se não for pré-contrato/renovação, segue a regra normal:
                // Se tem time, vai pro time. Se é Free, vai pro jogador.
                recipientId = (target.teamId === 'FREE' || !target.teamId || target.teamId === '') 
                    ? target.id 
                    : target.teamId;
            }
        }

        const pl = {
            playerId: target.id,
            playerName: targetPlayerName,
            buyerId: old?.buyerId || user.data.id,
            buyerName: old?.buyerName || actingTeamName,
            sellerId: target.teamId || old?.sellerId || 'FREE',
            recipientId: recipientId,
            type: (old?.type === 'RENOVACAO_URGENTE') ? 'RENOVACAO' : type,
            value: v,
            offerContract: contractYears,
            description: details,
            status: 'PENDING',
            sellerAccepted: old ? (old.sellerAccepted || false) : false,
            meta: {
                ...meta,
                newSalary: finalSal,
                signingBonus: parseFloat(meta.signingBonus) || 0,
                role: role,
                installments: parseInt(meta.installments) || 1,
                sellOn: parseInt(meta.sellOn) || 0,
                hasBuyOption: meta.hasBuyOption || false
            },
            date: Date.now()
        };

        const b = db.batch();
        if (old && old.id) b.delete(db.collection('offers').doc(old.id));
        
        b.set(db.collection('offers').doc(), pl);
        await b.commit();

        // Título da notícia ajustado
        const msgHead = (old && old.id) ? "🔄 CONTRAPROPOSTA" : (type === 'PRE_CONTRATO' ? "⚖️ PRÉ-CONTRATO" : (type === 'RENOVACAO' ? "📝 RENOVAÇÃO" : "💼 NOVA OFERTA"));
        
        postNews(`${msgHead}\n**${actingTeamName}** enviou uma proposta para **${targetPlayerName}**!\n\n${details}`, 'transfer');
        
        setModal(null); 
        alert("Enviado com sucesso! Aguarde a resposta.");
    } catch (e) {
        console.error("Erro no Firebase:", e);
        alert("Erro técnico ao gravar no banco de dados.");
    }
};

const acceptOffer = async (o) => {
    try {
        // --- 1. LÓGICA DE NOTIFICAÇÃO (APENAS LEITURA) ---
        if (o.type === 'NOTIFICACAO') {
            await db.collection('offers').doc(o.id).delete();
            alert('Confirmado!');
            return;
        }

        // --- 2. LÓGICA DE PRÉ-CONTRATO (V1.52.9) ---
        // (Mantido para não perder a funcionalidade de assinar com jogadores em fim de contrato)
        if (o.type === 'PRE_CONTRATO') {
            if (!confirm(`Confirmar assinatura de Pré-Contrato com ${o.buyerName}?\nVocê se juntará a eles na próxima temporada.`)) return;
            
            const b = db.batch();
            
            // Grava o pré-contrato no perfil do jogador
            b.update(db.collection('players').doc(o.playerId), {
                preContract: {
                    teamId: o.buyerId,
                    teamName: o.buyerName,
                    salary: o.meta.newSalary,
                    date: Date.now()
                },
                mood: '🤩'
            });

            b.delete(db.collection('offers').doc(o.id));
            await b.commit();
            
            postNews(`📝 **PRÉ-CONTRATO ASSINADO**\n**${o.playerName}** assinou com o **${o.buyerName}** e se apresentará na próxima temporada!`, 'transfer');
            alert("Pré-contrato assinado com sucesso!");
            return;
        }

        const buy = teams.find(t => t.id === o.buyerId);
        const p = players.find(x => x.id === o.playerId);
        const isFreeAgent = !o.sellerId || o.sellerId === 'FREE';
        const sel = isFreeAgent ? null : teams.find(t => t.id === o.sellerId);

        // --- 3. CASO ESPECIAL: COMPRA DEFINITIVA (EXERCER OPÇÃO DE EMPRÉSTIMO) ---
        if (o.type === 'COMPRA_DEFINITIVA') {
            if (!buy || !p) return alert("Erro: Dados incompletos.");
            if (buy.balance < o.value) return alert(`Saldo insuficiente! Necessário: ${fmt(o.value)}`);
            if (!confirm(`Exercer opção de compra de ${p.name} por ${fmt(o.value)}?`)) return;

            const b = db.batch();
            b.update(db.collection('teams').doc(buy.id), { balance: buy.balance - o.value });
            if (sel) b.update(db.collection('teams').doc(sel.id), { balance: sel.balance + o.value });

            b.update(db.collection('players').doc(p.id), {
                teamId: buy.id,
                loanMeta: firebase.firestore.FieldValue.delete(), 
                status: 'NAO_A_VENDA',
                contract: 3, 
                history: firebase.firestore.FieldValue.arrayUnion({ 
                    date: Date.now(), from: sel ? sel.name : 'EMPRÉSTIMO', to: buy.name, type: 'COMPRA_DEFINITIVA', value: o.value 
                })
            });
            b.delete(db.collection('offers').doc(o.id));
            await b.commit();
            postNews(`✅ **OPÇÃO EXERCIDA**\nO **${buy.name}** contratou **${p.name}** em definitivo!`, 'transfer');
            alert("Compra realizada!");
            return;
        }

        // =================================================================================
        // LÓGICA DE NEGOCIAÇÃO INTELIGENTE (ACEITE BIDIRECIONAL)
        // =================================================================================

        const iAmBuyer = user.type === 'USER' && user.data.id === o.buyerId;
        const iAmSeller = user.type === 'USER' && user.data.id === o.sellerId;
        const iAmPlayer = user.type === 'PLAYER' || (isFreeAgent && !iAmBuyer);

        // --- FASE 1: ACORDO ENTRE CLUBES ---
        if (!isFreeAgent && !o.sellerAccepted && (iAmSeller || iAmBuyer)) {
            if (iAmBuyer) {
                if (!confirm(`Aceitar a pedida do clube vendedor (${fmt(o.value)}) e negociar com o jogador?`)) return;
            } else {
                if (!confirm("Aceitar os valores propostos? O jogador decidirá o contrato agora.")) return;
            }
            
            await db.collection('offers').doc(o.id).update({
                recipientId: o.playerId, 
                sellerAccepted: true,     
                status: 'PENDING'
            });
            
            postNews(`💰 **ACORDO ENTRE CLUBES**\n${buy.name} e ${sel.name} chegaram a um acordo por **${p.name}**. Falta o "Sim" do atleta!`, 'transfer');
            alert("Acordo financeiro selado! A proposta foi enviada para o jogador.");
            return;
        }

        // --- FASE 2: ACORDO FINAL ---
        const readyForContract = isFreeAgent || o.sellerAccepted;

        if (readyForContract && (iAmPlayer || iAmBuyer)) {
            if (!buy || !p) return alert("Erro: Dados incompletos.");

            const valorEntrada = o.meta?.installments > 1 ? (o.value / o.meta.installments) : o.value;
            const luvas = parseFloat(o.meta?.signingBonus) || 0;
            const custoTotalImediato = valorEntrada + luvas;

            if (buy.balance < custoTotalImediato) {
                return alert(`Saldo insuficiente no caixa do comprador!\nNecessário: ${fmt(custoTotalImediato)}`);
            }

            if (iAmBuyer) {
                if (!confirm(`Aceitar a pedida salarial do jogador e fechar a contratação?\nCusto Imediato: ${fmt(custoTotalImediato)}`)) return;
            } else {
                if (!confirm(`Deseja assinar com o ${buy.name}?`)) return;
            }

            // --- EXECUÇÃO DA TRANSFERÊNCIA ---
            const b = db.batch();
            
            // 1. Paga o Clube Vendedor (se houver) E processa cláusula de revenda ANTIGA
            if (sel) {
                let valorParaVendedor = valorEntrada;

                // >>>> LÓGICA DE REVENDA (SELL-ON FEE) AUTOMÁTICA <<<<
                // Se o jogador tem uma cláusula salva, calcula a parte do antigo dono
                if (p.sellOnClause && p.sellOnClause.percentage > 0) {
                    const beneficiaryId = p.sellOnClause.beneficiaryId;
                    
                    // Só executa se o beneficiário ainda existir e não for o mesmo que está comprando
                    if (beneficiaryId && beneficiaryId !== buy.id) {
                        const shareAmount = (valorEntrada * p.sellOnClause.percentage) / 100;
                        
                        // Desconta do vendedor atual
                        valorParaVendedor -= shareAmount;
                        
                        // Paga ao dono original (Beneficiário)
                        b.update(db.collection('teams').doc(beneficiaryId), { 
                            balance: firebase.firestore.FieldValue.increment(shareAmount) 
                        });
                    }
                }

                // Paga o vendedor (já descontado a revenda, se houve)
                b.update(db.collection('teams').doc(sel.id), { balance: sel.balance + valorParaVendedor });

                // Cria dívida se parcelado
                if (o.meta?.installments > 1) {
                    const debtRef = db.collection('debts').doc();
                    b.set(debtRef, {
                        buyerId: buy.id, buyerName: buy.name,
                        sellerId: sel.id, sellerName: sel.name,
                        playerName: p.name, installmentVal: valorEntrada,
                        weeksRemaining: parseInt(o.meta.installments) - 1, date: Date.now()
                    });
                }
            }

            // 2. Desconta do Comprador
            b.update(db.collection('teams').doc(buy.id), { balance: buy.balance - custoTotalImediato });

            // 3. Paga Luvas ao Jogador
            if (luvas > 0) {
                b.update(db.collection('players').doc(p.id), { balance: firebase.firestore.FieldValue.increment(luvas) });
            }

            // 4. Atualiza o Jogador (Move de time e Grava NOVA Cláusula)
            
            // Prepara a NOVA cláusula se foi negociada agora (0 a 80%)
            const newSellOnClause = (o.meta && o.meta.sellOn > 0 && sel) ? {
                beneficiaryId: sel.id,
                percentage: o.meta.sellOn
            } : firebase.firestore.FieldValue.delete(); // Se não tem revenda nova, apaga a antiga para limpar o histórico

            b.update(db.collection('players').doc(p.id), {
                teamId: buy.id,
                status: 'NAO_A_VENDA',
                contract: o.type === 'EMPRESTIMO' ? (parseInt(o.meta.loanDuration) || 1) : (parseInt(o.offerContract) || 1),
                salary: parseFloat(o.meta?.newSalary) || p.salary,
                role: o.meta?.role || 'ROTACAO',
                loanMeta: o.type === 'EMPRESTIMO' ? { 
                    ownerId: sel?.id, 
                    salarySplit: o.meta.salarySplit || 100,
                    hasBuyOption: o.meta.hasBuyOption || false,
                    buyOpt: o.meta.buyOpt || 0,
                    originalContract: p.contract 
                } : null,
                // AQUI GRAVA A NOVA CLÁUSULA NO JOGADOR
                sellOnClause: newSellOnClause,
                history: firebase.firestore.FieldValue.arrayUnion({ 
                    date: Date.now(), from: isFreeAgent ? 'AGENTE LIVRE' : (sel ? sel.name : 'Desconhecido'), to: buy.name, type: o.type, value: o.value 
                })
            });

            // 5. Apaga a oferta e notifica
            b.delete(db.collection('offers').doc(o.id));
            await b.commit();
            
            const newsMsg = isFreeAgent 
                ? `✍️ **ASSINOU!**\nO Agente Livre **${p.name}** é o novo reforço do **${buy.name}**!`
                : `🤝 **TRANSFERÊNCIA CONCLUÍDA**\n**${p.name}** assinou com o **${buy.name}**!`;
            
            postNews(newsMsg, 'transfer');
            
            // Notificação extra se houve repasse de revenda
            if (sel && p.sellOnClause && p.sellOnClause.percentage > 0) {
                 postNews(`💸 **CLÁUSULA DE REVENDA**\nUma parte da venda de **${p.name}** (${p.sellOnClause.percentage}%) foi repassada ao seu antigo clube formador.`, 'money');
            }

            alert("Negócio fechado com sucesso!");
        }

    } catch (e) {
        console.error(e);
        alert("Erro ao processar o aceite: " + e.message);
    }
};

const rejectOffer = async (o) => {
    try {
        // --- CASO 1: RECUSA DE OPÇÃO DE COMPRA (FIM DE EMPRÉSTIMO) ---
        if (o.type === 'COMPRA_DEFINITIVA' && o.isLoanOption) {
            const p = players.find(x => x.id === o.playerId);
            const ownerId = o.sellerId; 
            const ownerTeam = teams.find(t => t.id === ownerId);

            if (!confirm("Deseja recusar a compra? O jogador retornará ao clube de origem.")) return;

            const b = db.batch();
            const pRef = db.collection('players').doc(p.id);

            // --- CORREÇÃO DE SEGURANÇA PARA DADOS ANTIGOS ---
            let originalDuration = 0;
            
            if (p.loanMeta && p.loanMeta.originalContract) {
                originalDuration = parseInt(p.loanMeta.originalContract);
            } else {
                console.warn("Contrato original não encontrado. Usando fallback de 6 anos.");
                originalDuration = 6; 
            }
            
            let remainingContract = originalDuration - 1;

                });

                    contract: remainingContract 
                });
                
                postNews(`🔙 **RETORNO**\n${p.name} retornou ao ${ownerTeam?.name} (${remainingContract} anos rest.).`, 'transfer');
            }

            b.delete(db.collection('offers').doc(o.id));
            await b.commit();
            alert("Opção recusada. Jogador devolvido ao clube de origem.");
            return;
        }

        // --- CASO 2: RECUSA DE RENOVAÇÃO URGENTE ---
        if (o.type === 'RENOVACAO_URGENTE') {
            if (!confirm("Tem certeza? O jogador perderá o vínculo com o clube e irá para os Agentes Livres.")) return;
            
            const b = db.batch();
            b.update(db.collection('players').doc(o.playerId), {
                teamId: 'FREE',
                status: 'VENDA',
                mood: '😐',
                contract: 0
            });
            b.delete(db.collection('offers').doc(o.id));
            await b.commit();
            
            postNews(`🆓 **AGENTE LIVRE**\nO vínculo de **${o.playerName}** expirou e ele está livre no mercado!`, 'transfer');
            alert("Jogador enviado para os Agentes Livres.");
            return;
        }

        // --- CASO 3: RECUSA NORMAL DE PROPOSTAS ---
        if (!confirm("Deseja recusar e encerrar esta negociação?")) return;
        await db.collection('offers').doc(o.id).delete();
        
        if (o.type !== 'NOTIFICACAO') {
            postNews(`❌ **NEGOCIAÇÃO ENCERRADA**\nO acordo por **${o.playerName}** não avançou.`, 'transfer');
        }

    } catch (e) {
        console.error(e);
        alert("Erro técnico ao processar a recusa.");
    }
};

            // --- FUNÇÃO INTELIGENTE DE SÚMULA (INDIVIDUAL OU EM MASSA) ---
            // ⚠️ NOVO PARÂMETRO 'homeTeam' ADICIONADO NO FINAL
            const saveMatchStats = async (dataPayload, legacyMatch, legacyXp, homeTeam = null) => {
                let batchData = [];

                // 1. Compatibilidade com chamadas antigas (player, match, xp)
                if (legacyMatch && legacyMatch.goals !== undefined) {
                    batchData = [{ player: dataPayload, match: legacyMatch, xpOverride: legacyXp }];
                } 
                // 2. Novo formato (Array de jogadores ou Objeto único)
                else {
                    batchData = Array.isArray(dataPayload) ? dataPayload : [dataPayload];
                }
                
                if (batchData.length === 0) return alert("Nenhum dataPayload para salvar.");
                
                setLoading(true);
                const b = db.batch();
                let count = 0;

                // Regras de XP para cálculo automático
                const R = { GOAL: 150, ASSIST: 120, TACKLE: 80, SAVE: 100, WIN: 300, DRAW: 100, LOSS: -100, YELLOW: -50, RED: -200, RATING_MULT: 50 };

                batchData.forEach(item => {
                    const { player, match, xpOverride } = item;
                    if (!player || !match) return;
                    
                    // Cálculo de XP Interno (se não vier pré-calculado)
                    let xp = 0;
                    if (xpOverride !== undefined) {
                        xp = xpOverride;
                    } else {
                        xp += (match.goals || 0) * R.GOAL;
                        xp += (match.assists || 0) * R.ASSIST;
                        xp += (match.tackles || 0) * R.TACKLE;
                        xp += (match.saves || 0) * R.SAVE;
                        xp += (match.yellows || 0) * R.YELLOW;
                        xp += (match.reds || 0) * R.RED;
                        if (match.result === 'VITORIA') xp += R.WIN;
                        if (match.result === 'EMPATE') xp += R.DRAW;
                        if (match.result === 'DERROTA') xp += R.LOSS;
                        xp += (parseFloat(match.rating) || 0) * R.RATING_MULT;
                    }
                    const xpGained = parseInt(xp);

                    // Atualiza o Jogador
                    const pRef = db.collection('players').doc(player.id);
                    
                    const newStats = { 
                        goals: (player.stats?.goals||0) + match.goals, 
                        assists: (player.stats?.assists||0) + match.assists, 
                        tackles: (player.stats?.tackles||0) + match.tackles, 
                        saves: (player.stats?.saves||0) + match.saves, 
                        yellows: (player.stats?.yellows||0) + match.yellows, 
                        reds: (player.stats?.reds||0) + match.reds 
                    };

                    // Cálculo da Média da Imprensa
                    const currentSum = player.pressRatingSum || 0; 
                    const currentCount = player.pressRatingCount || 0; 
                    const newSum = currentSum + parseFloat(match.rating);
                    const newCount = currentCount + 1;
                    const newAvg = newSum / newCount; 
                    
                    // Preparação do objeto de atualização
                    const updateData = { 
                        stats: newStats, 
                        pendingXP: (player.pendingXP || 0) + xpGained,
                        pressRatingSum: newSum,
                        pressRatingCount: newCount,
                        pressRatingAvg: parseFloat(newAvg.toFixed(1)),
                        energy: Math.max(0, (player.energy || 100) - 25) // Desgaste físico do jogo
                    };

                    // --- INTEGRAÇÃO DO SISTEMA MÉDICO (LESÕES) ---
                    if (match.injury && (match.recoveryLeft || 0) > 0) {
                        updateData.injury = match.injury;
                        updateData.recoveryLeft = parseInt(match.recoveryLeft);
                        updateData.mood = '😡'; // Jogador fica irritado ao se lesionar
                    }
                    
                    b.update(pRef, updateData);
                    count++;
                });
                
                // ==========================================
                // --- INTEGRAÇÃO DO ESTÁDIO E LOJA (MATCHDAY) ---
                // Roda fora do forEach para não multiplicar a renda pelos 11 jogadores!
                // ==========================================
                if (homeTeam && homeTeam.id) {
                    const lvl = homeTeam.stadiumLevel || 1;
                    const sDb = STADIUM_DB[lvl] || STADIUM_DB[1]; // Puxa do Banco de Estádios global
                    const ticPrice = homeTeam.ticketPrice || sDb.minTic;

                    // 1. O Peso do Preço
                    const priceFactor = 1.0 - (((ticPrice - sDb.minTic) / ((sDb.maxTic - sDb.minTic) || 1)) * 0.6);

                    // 2. Fator Surpresa (Varia de 80% a 120%)
                    const rngFactor = (Math.floor(Math.random() * 41) + 80) / 100;

                    // Calcula o público final e trava no teto do estádio
                    let attendance = Math.floor(sDb.cap * priceFactor * rngFactor);
                    if (attendance > sDb.cap) attendance = sDb.cap;

                    const ticketRevenue = attendance * ticPrice;

                    // 3. Vendas da Loja Oficial (Algoritmo Dinâmico de Produtos)
                    // A conversão base depende do nível da Loja (Estádio). Nvl 1 = 5%, Nvl 5 = 25%
                    const baseConversionRate = [0, 0.05, 0.10, 0.15, 0.20, 0.25][lvl] || 0.05; 
                    
                    let totalStoreRevenue = 0;
                    let currentProducts = [...(homeTeam.storeProducts || [])];

                    // Calcula a venda para CADA produto separadamente
                    const updatedProducts = currentProducts.map(prod => {
                        // Fator de Dificuldade pelo Preço: 
                        // Itens de até ₣30 vendem 100% do potencial. Quanto mais caro, menos vende.
                        let priceDifficulty = 1;
                        if (prod.price > 30) {
                            priceDifficulty = Math.max(0.05, 30 / prod.price); // Nunca cai pra 0, mínimo de 5% de chance
                        }

                        // Quantos torcedores TENTARAM comprar esse item específico
                        const potentialBuyers = Math.floor(attendance * baseConversionRate * priceDifficulty);
                        
                        // Quantos realmente compraram (limitado pelo estoque)
                        const itemsSold = Math.min(potentialBuyers, prod.stock);

                        totalStoreRevenue += (itemsSold * prod.price);
                        
                        // Retorna o produto atualizado com o estoque deduzido
                        return { ...prod, stock: prod.stock - itemsSold };
                    });

                    // 4. Salva o dinheiro no clube e atualiza o estoque dos produtos
                    const teamRef = db.collection('teams').doc(homeTeam.id);
                    b.update(teamRef, {
                        balance: firebase.firestore.FieldValue.increment(ticketRevenue), // Dinheiro do Ingresso direto pro time
                        storeBalance: firebase.firestore.FieldValue.increment(totalStoreRevenue), // Lucro da loja vai pro cofre da loja
                        storeProducts: updatedProducts // Salva o novo estoque
                    });
                }
                // ==========================================
// --- ATUALIZA A SEQUÊNCIA DE JOGOS (RECENT FORM) DOS TIMES ---
                const teamResults = {};
                batchData.forEach(item => {
                    if (item.player && item.player.teamId && item.player.teamId !== 'FREE') {
                        teamResults[item.player.teamId] = item.match.result; // Salva o resultado do time
                    }
                });
                
                Object.keys(teamResults).forEach(tid => {
                    if (teamResults[tid] !== 'NENHUM') {
                        const tObj = teams.find(t => t.id === tid);
                        if (tObj) {

                            form.unshift(teamResults[tid]); // Adiciona o jogo atual no topo da lista
                            if (form.length > 5) form.pop(); // Mantém apenas os últimos 5 jogos
                            b.update(db.collection('teams').doc(tid), { recentForm: form });
                        }
                    }
                });
                
                await b.commit();
                setLoading(false);
                setModal(null);
                alert(`${count} súmula(s) lançada(s) com sucesso!${homeTeam ? '\n🏟️ Bilheteria e vendas da Loja contabilizadas!' : ''}`);

 const handlePlayerSoloTrain = async (player, type) => {

        }

        if (Math.random() < 0.02) {
            const injuryName = INJURIES_DB.LEVE[Math.floor(Math.random() * INJURIES_DB.LEVE.length)];
            b.update(db.collection('players').doc(player.id), {
                injury: injuryName,

            });

            return alert(`❌ INFORTÚNIO!\nVocê sentiu o físico durante o treino.\nDiagnóstico: ${injuryName}\nTempo: 1 Jogo fora.`);
        }

        // 2. Define Atributos baseados no Tipo (Atualizado para cobrir TODOS os atributos do sistema)
        let trainedAttrs = [];
        if(type === 'FISICO_BASE') trainedAttrs = ['stamina', 'balance', 'condition', 'strength'];
        else if(type === 'VELOCIDADE') trainedAttrs = ['speed', 'accel', 'agility', 'dribbleSpd'];
        else if(type === 'IMPULSAO') trainedAttrs = ['jump', 'header', 'condition'];
        else if(type === 'CHUTE') trainedAttrs = ['shot', 'shotPower', 'shotTech', 'weakFootAcc'];
        else if(type === 'PASSE') trainedAttrs = ['shortPass', 'longPass', 'shortPassSpd', 'longPassSpd', 'tech', 'weakFootFreq'];
        else if(type === 'DRIBLE') trainedAttrs = ['dribble', 'dribbleSpd', 'agility', 'tech'];
        else if(type === 'DEFESA') trainedAttrs = ['defense', 'aggression', 'response'];
        else if(type === 'MENTAL') trainedAttrs = ['teamwork', 'mentality', 'response'];
        else if(type === 'BOLA_PARADA') trainedAttrs = ['freeKick', 'curve', 'header', 'penalties'];
        else if(type === 'GOLEIRO') trainedAttrs = ['gk', 'response', 'jump', 'longPass'];

        // 3. Cálculos (Eficiência Baixa no Solo)
        let xpGain = Math.floor(Math.random() * 4) + 3; // Ganha entre 3 e 6 XP
        const newEnergy = currentEnergy - 35; // Gasta 35 de Energia (Cálculo seguro)

        // --- BÔNUS DE ITEM EQUIPADO (CHUTEIRA/LUVA) ---
        if (player.equippedItem) {
            const itemBonusPercent = player.equippedItem.power || 0;
            const bonusAmount = Math.ceil(xpGain * (itemBonusPercent / 100));
            xpGain += bonusAmount;
            report.push(`👟 Item usado: ${player.equippedItem.name} (+${bonusAmount} XP)`);
            
            // Consome o item (remove da coleção sales e do player)
            const itemRef = db.collection('sales').doc(player.equippedItem.id);
            b.delete(itemRef);
            b.update(db.collection('players').doc(player.id), { equippedItem: firebase.firestore.FieldValue.delete() });
        }

        // 4. Evolução de Atributos (Chance Baixa: 15%)
        let newAttrs = { ...(player.attributes || {}) };
        let evolved = false;
        
        trainedAttrs.forEach(attr => {
            if((newAttrs[attr] || 50) < 99) {
                if(Math.random() < 0.15) { // 15% de chance de subir 1 ponto
                    newAttrs[attr] = (newAttrs[attr] || 50) + 1;
                    evolved = true;
                }
            }
        });

        // 5. Salva no Banco (SEM ATUALIZAR O OVERALL)
        // O Overall agora só deve ser recalculado na virada de temporada pelo Admin
        b.update(db.collection('players').doc(player.id), {
            xp: (player.xp || 0) + xpGain,
            energy: newEnergy,
            attributes: newAttrs
            // overall removido para evitar inflação fora de época
        });

        await b.commit();
        setLoading(false);
        
        let msg = `Treino realizado!\n⚡ Energia: -35% (Resta: ${newEnergy}%)\n📈 XP: +${xpGain}`;
        if(report.length > 0) msg += `\n${report.join('\n')}`;
        if(evolved) msg += "\n✨ Alguns atributos melhoraram um pouco.";

                <h3 style={{color:'cyan'}}>⚽ Inscrição de Atleta</h3>
