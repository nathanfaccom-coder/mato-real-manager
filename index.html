        // --- NOVO COMPONENTE: PAINEL DA EMPRESA ---
     const CompanyDashboard = ({ company, products, sps, sales, teams, onSaveProd, onDeleteProd, onProcessSpons }) => {
    const [tab, setTab] = useState('PRODS'); 
    // Estado do Produto em Edição (Inicia com Power 0 e Stock 1)
    const [editP, setEditP] = useState(null); 

    // --- 1. COMPRESSOR DE LOGO (ULTRA-LEVE) ---
    const handleLogoUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
            const img = new Image();
            img.src = event.target.result;
            img.onload = async () => {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                
                // TAMANHO REDUZIDO PARA 150px (Suficiente para Logo)
                const MAX_SIZE = 150; 
                let width = img.width, height = img.height;
                if (width > height) { if (width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; } } 
                else { if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; } }
                canvas.width = width; canvas.height = height;
                ctx.drawImage(img, 0, 0, width, height);
                
                // FORMATO WEBP + QUALIDADE 60% (Extremamente leve)
                const dataUrl = canvas.toDataURL('image/webp', 0.6);
                
                if(confirm("Atualizar logo da empresa?")) {
                    await db.collection('companies').doc(company.id).update({ logo: dataUrl });
                    alert("Logo atualizado!");
                }
            };
        };
    };

    // --- 2. COMPRESSOR DE PRODUTO (ULTRA-LEVE) ---
    const handleProductImage = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
            const img = new Image();
            img.src = event.target.result;
            img.onload = () => {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                
                // TAMANHO OTIMIZADO 180px (Bom para ver detalhes, mas leve)
                const MAX_SIZE = 180; 
                let width = img.width, height = img.height;
                if (width > height) { if (width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; } } 
                else { if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; } }
                canvas.width = width; canvas.height = height;
                ctx.drawImage(img, 0, 0, width, height);
                
                // FORMATO WEBP + QUALIDADE 0.6
                const dataUrl = canvas.toDataURL('image/webp', 0.6);

                setEditP(prev => ({ ...prev, img: dataUrl }));
            };
        };
    };
    
    return (
        <div>
            <div style={{display:'flex', alignItems:'center', gap:10, marginBottom:15, background:'rgba(0,0,0,0.2)', padding:10, borderRadius:8}}>
                {company.logo ? <img src={company.logo} style={{width:50, height:50, borderRadius:'50%', objectFit:'cover', border:'2px solid var(--purple)'}} /> : <div style={{width:50, height:50, background:'#333', borderRadius:'50%', display:'grid', placeItems:'center'}}>🏢</div>}
                <div style={{flex:1}}>
                    <h3 style={{margin:0}}>{company.name}</h3>
                    <label className="btn btn-ghost" style={{fontSize:9, padding:'2px 5px', width:'auto', display:'inline-block', margin:0}}>
                        📷 ALTERAR LOGO <input type="file" style={{display:'none'}} accept="image/*" onChange={handleLogoUpload} />
                    </label>
                </div>
            </div>

            <div style={{display:'flex', gap:10, marginBottom:15}}>
                <button className={`btn ${tab==='PRODS'?'btn-purple':'btn-ghost'}`} onClick={()=>setTab('PRODS')}>PRODUTOS</button>
                <button className={`btn ${tab==='FIN'?'btn-purple':'btn-ghost'}`} onClick={()=>setTab('FIN')}>FINANÇAS</button>
            </div>
            
            {tab==='PRODS' && <div>
                <button className="btn btn-green" onClick={()=>setEditP({name:'', price:'', img:'', desc:'', cat:'CHUTEIRA', power: 0, stock: 1})}>+ NOVO PRODUTO</button>
                
                {products.map(p => (
                    <div key={p.id} className="card" style={{display:'flex', gap:10, textAlign:'left'}}>
                        {p.img ? <img src={p.img} style={{width:80, height:80, objectFit:'cover', borderRadius:6, border:'1px solid #444'}} /> : <div style={{width:80, height:80, background:'#222', borderRadius:6, display:'grid', placeItems:'center'}}>📦</div>}
                        <div style={{flex:1}}>
                            <span style={{fontSize:10, background:'#333', padding:'2px 6px', borderRadius:4, color:'#aaa'}}>{PROD_CATS[p.cat] || p.cat}</span>
                            <div style={{fontWeight:'bold', marginTop:2}}>{p.name}</div>
                            <div style={{fontSize:11, color: (p.power > 0 ? 'gold' : '#888')}}>
                                {p.power > 0 ? `Poder: ${p.power}` : '✨ Sem Efeito (Decorativo)'}
                            </div>
                            <div style={{fontSize:10, color:'#888'}}>📦 Estoque: <b>{p.stock || 0}</b></div>
                            <span style={{color:'var(--primary)', fontWeight:'bold'}}>{fmt(p.price)}</span>
                        </div>
                        <div style={{display:'flex', flexDirection:'column', gap:5}}>
                            <button className="btn btn-blue" style={{width:'auto', padding:'5px 10px'}} onClick={()=>setEditP({...p, stock: 1})}>✏️</button>
                            <button className="btn btn-red" style={{width:'auto', padding:'5px 10px'}} onClick={()=>onDeleteProd(p.id)}>X</button>
                        </div>
                    </div>
                ))}
            </div>}

            {tab==='FIN' && <div>
                <div className="highlight-card"><h3>Saldo: {fmt(company.balance)}</h3><small>Imposto Semanal: {fmt((COMPANY_TYPES[company.companyType] || {}).tax || 0)}</small></div>
                <h4 style={{marginTop:20, color:'#ddd'}}>Histórico de Vendas</h4>
                <div style={{maxHeight:200, overflowY:'auto', background:'rgba(0,0,0,0.3)', padding:10, borderRadius:8, marginBottom:15, border:'1px solid #333'}}>
                    {(!sales || sales.filter(s => s.companyId === company.id).length === 0) && <p style={{color:'#666', textAlign:'center', fontSize:11, margin:0}}>Nenhuma venda recente.</p>}
                    {(sales || []).filter(s => s.companyId === company.id).map((s, i) => (
                        <div key={i} style={{borderBottom:'1px solid #444', padding:'8px 0', fontSize:11, textAlign:'left'}}>
                            <div style={{display:'flex', justifyContent:'space-between'}}><b style={{color:'var(--primary)'}}>+ {fmt(s.price)}</b><span style={{color:'#888'}}>{new Date(s.date).toLocaleDateString()}</span></div>
                            <div style={{marginTop:2}}>
                                Custo: <span style={{color:'var(--danger)'}}>-{fmt(s.cost || 0)}</span> | Lucro: <span style={{color:'lime'}}>{fmt(s.price - (s.cost||0))}</span>
                            </div>
                            <div style={{marginTop:2}}>👤 <span style={{color:'#fff', fontWeight:'bold'}}>{s.buyerName}</span> comprou 1x <span style={{color:'var(--purple)'}}>{s.productName}</span></div>
                        </div>
                    ))}
                </div>
                <h4>Solicitações</h4>{sps.filter(s=>s.status==='PENDING').length === 0 && <p style={{color:'#666'}}>Nenhuma.</p>}{sps.filter(s=>s.status==='PENDING').map(s => (<div key={s.id} className="card"><b>{s.teamName}</b> pede patrocínio.<br/>Valor: <span style={{color:'var(--warning)'}}>{fmt(s.value)}</span><br/><div style={{display:'flex', gap:5, marginTop:5}}><button className="btn btn-green" onClick={()=>onProcessSpons(s, 'ACTIVE')}>ACEITAR</button><button className="btn btn-red" onClick={()=>onProcessSpons(s, 'REJECTED')}>RECUSAR</button></div></div>))}
                <h4>Contratos Ativos</h4>{sps.filter(s=>s.status==='ACTIVE').length === 0 && <p style={{color:'#666'}}>Nenhum.</p>}{sps.filter(s=>s.status==='ACTIVE').map(s => (<div key={s.id} className="card" style={{borderLeft:'4px solid var(--primary)'}}><b>{s.teamName}</b><br/>Pagamento: {fmt(s.value)}<button className="btn btn-red" style={{marginTop:5}} onClick={()=>onProcessSpons(s, 'CANCELLED')}>CANCELAR</button></div>))}
            </div>}

            {editP && <div className="modal-overlay"><div className="modal-content" style={{border: '2px solid var(--purple)'}}>
                <h3>{editP.id ? '🏭 Repor Estoque / Editar' : '🏭 Nova Linha de Produção'}</h3>
                
                <div style={{textAlign:'center', marginBottom:10}}>
                    {editP.img ? <img src={editP.img} style={{width:80, height:80, borderRadius:8, objectFit:'cover', border:'2px solid var(--primary)'}} /> : <div style={{width:80, height:80, background:'#222', borderRadius:8, display:'inline-flex', alignItems:'center', justifyContent:'center', border:'2px dashed #444'}}>📦</div>}
                    <br/>
                    <label className="btn btn-blue" style={{display:'inline-block', width:'auto', fontSize:11, padding:'5px 10px', marginTop:5}}>
                        📷 ESCOLHER FOTO DO PRODUTO
                        <input type="file" style={{display:'none'}} accept="image/*" onChange={handleProductImage} />
                    </label>
                </div>

                <label>Categoria</label>
                <select className="input-field" value={editP.cat || 'CHUTEIRA'} onChange={e=>setEditP({...editP, cat:e.target.value})} disabled={editP.id}>
                    {Object.keys(PROD_CATS).map(key => <option key={key} value={key}>{PROD_CATS[key]}</option>)}
                </select>
                
                <div style={{background:'rgba(255,255,255,0.05)', padding:10, borderRadius:8, marginBottom:10, border:'1px solid #444'}}>
                    <label style={{color: editP.power > 0 ? 'gold' : '#aaa'}}>
                        {editP.power > 0 ? `⚡ Poder / Intensidade: ${editP.power}` : '✨ Sem Efeito Especial'}
                    </label>
                    <input type="range" min="0" max="100" className="input-field" value={editP.power || 0} onChange={e=>setEditP({...editP, power: parseInt(e.target.value)})} disabled={editP.id} />
                    <small style={{color:'#aaa', display:'block'}}>
                        {editP.power === 0 ? '🚫 Item Decorativo (Grátis para produzir)' :
                         ['SAUDE','CONSUMIVEL'].includes(editP.cat) ? `Recupera ${editP.power}% Energia` : 
                         ['CHUTEIRA','LUVAS'].includes(editP.cat) ? `Bônus de +${editP.power}% XP no treino` : 
                         `Gera +${(editP.power||0)*100} Fama`}
                    </small>
                </div>

                {/* --- ÁREA DE FÁBRICA (QUANTIDADE) --- */}
                <div style={{background:'#222', padding:15, borderRadius:10, margin:'10px 0', borderLeft:'4px solid var(--purple)'}}>
                    <h4 style={{marginTop:0, marginBottom:10, color:'var(--purple)'}}>📦 Ordem de Produção</h4>
                    <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:10}}>
                        <label style={{margin:0}}>Quantidade a produzir:</label>
                        <b style={{fontSize:20, color:'#fff'}}>{editP.stock || 1} un.</b>
                    </div>
                    <input 
                        type="range" min="1" max="200" step="1"
                        className="input-field" 
                        value={editP.stock || 1} 
                        onChange={e=>setEditP({...editP, stock: parseInt(e.target.value)})} 
                        style={{accentColor:'var(--purple)'}}
                    />
                    <div style={{marginTop:15, paddingTop:10, borderTop:'1px solid rgba(255,255,255,0.1)', fontSize:12}}>
                        {(() => {
                            const uCost = getProdCost(editP.cat, editP.power);
                            const tCost = uCost * (parseInt(editP.stock) || 1);
                            const canAfford = (company.balance || 0) >= tCost;
                            return (
                                <>
                                    <div style={{display:'flex', justifyContent:'space-between', marginBottom:5}}>
                                        <span>Custo Unitário:</span>
                                        <b>{fmt(uCost)}</b>
                                    </div>
                                    <div style={{display:'flex', justifyContent:'space-between', fontSize:16, borderTop:'1px dashed #444', paddingTop:5}}>
                                        <span>VALOR TOTAL A PAGAR:</span>
                                        <b style={{color: canAfford ? '#00E676' : '#FF1744'}}>{fmt(tCost)}</b>
                                    </div>
                                    {!canAfford && <div style={{color:'#FF1744', textAlign:'right', fontWeight:'bold', marginTop:5, fontSize:10}}>⚠️ SALDO INSUFICIENTE</div>}
                                </>
                            );
                        })()}
                    </div>
                </div>

                <label>Nome</label><input className="input-field" value={editP.name} onChange={e=>setEditP({...editP, name:e.target.value})} disabled={editP.id} />
                <label>Preço de Venda (₣)</label><input className="input-field" type="number" value={editP.price} onChange={e=>setEditP({...editP, price:e.target.value})} />
                <label>Descrição</label><textarea className="input-field" value={editP.desc} onChange={e=>setEditP({...editP, desc:e.target.value})} />
                
                <div style={{display:'flex', gap:10}}>
                    <button className="btn btn-green" onClick={async ()=>{
                        const uCost = getProdCost(editP.cat, editP.power);
                        const qty = parseInt(editP.stock) || 1;
                        const tCost = uCost * qty;
                        const price = parseFloat(editP.price);
                        
                        if(uCost > 0 && price < uCost) return alert(`🚫 ANTI-CHEAT: O preço (${fmt(price)}) não pode ser menor que o custo de produção (${fmt(uCost)})!`);
                        if((company.balance || 0) < tCost) return alert("A empresa não tem saldo para esta produção!");

                        try {
                            // 1. Debita o valor total do saldo da empresa no Firebase
                            if(tCost > 0) {
                                await db.collection('companies').doc(company.id).update({
                                    balance: firebase.firestore.FieldValue.increment(-tCost)
                                });
                            }

                            // 2. Calcula o estoque final somando com o que já existe se for edição
                            const oldProd = products.find(x => x.id === editP.id);
                            const finalStock = editP.id ? (parseInt(oldProd.stock || 0) + qty) : qty;

                            // 3. Salva o produto
                            onSaveProd({
                                ...editP,
                                stock: finalStock,
                                productionCost: uCost
                            });
                            
                            setEditP(null);
                        } catch(e) { alert("Erro ao produzir: " + e.message); }
                    }}>
                        {editP.id ? `FABRICAR (+${editP.stock})` : `PAGAR E LANÇAR (-${fmt(getProdCost(editP.cat, editP.power) * (editP.stock||1))})`}
                    </button>
                    <button className="btn" onClick={()=>setEditP(null)}>CANCELAR</button>
                </div>
            </div></div>}
        </div>
    );
};

const PlayerDashboard = ({ player, team, sales, onUpdatePassword, onAction, onTrainSolo, onUseItem, setModal }) => {
    const [newPass, setNewPass] = useState('');
    const [tab, setTab] = useState('PERFIL');
    const [trainType, setTrainType] = useState('FISICO_BASE'); 

    // Itens na Mochila (filtra sales onde eu sou comprador)
    const myItems = (sales||[]).filter(s => s.buyerId === player.id);
    
    const xpCurrent = (player.xp || 0) + (player.pendingXP || 0);
    const pointsToGain = Math.floor(xpCurrent / 100); 
    const xpRest = xpCurrent % 100; 
    
    const attrCount = player.attributes ? Object.keys(player.attributes).length : 30;
    const projectedOvIncrease = Math.floor(pointsToGain / attrCount);
    // --- CÁLCULO DA ESTIMATIVA DE TREINOS SOLOS PARA +1 OVR ---
    const xpNeededForNextOv = attrCount * 100; // XP total necessário para subir +1 OVR inteiro
    const currentProgressForOv = xpCurrent % xpNeededForNextOv; // XP acumulado focado no próximo OVR
    const missingXpForOv = xpNeededForNextOv - currentProgressForOv;
    const avgSoloXp = 4.5; // Um treino solo dá entre 3 e 6 XP (média 4.5)
    const estSoloTrains = Math.ceil(missingXpForOv / avgSoloXp);
    // ----------------------------------------------------------

    const energy = player.energy !== undefined ? player.energy : 100;

    // --- FUNÇÃO PARA UPLOAD DE ROSTO (COM COMPRESSÃO) ---
    const handleFaceUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        // 1. Lê o arquivo
        const reader = new FileReader();
        reader.readAsDataURL(file);
        
        reader.onload = (event) => {
            const img = new Image();
            img.src = event.target.result;
            
            img.onload = async () => {
                // 2. Cria um Canvas para redimensionar (Compressão)
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                
                // Define tamanho máximo para ícone (200px é perfeito e leve)
                const MAX_SIZE = 200;
                let width = img.width;
                let height = img.height;

                // Redimensiona mantendo a proporção
                if (width > height) {
                    if (width > MAX_SIZE) {
                        height *= MAX_SIZE / width;
                        width = MAX_SIZE;
                    }
                } else {
                    if (height > MAX_SIZE) {
                        width *= MAX_SIZE / height;
                        height = MAX_SIZE;
                    }
                }

                canvas.width = width;
                canvas.height = height;
                
                // Desenha a imagem redimensionada no canvas
                ctx.drawImage(img, 0, 0, width, height);

                // 3. Converte para Texto Base64 leve (JPEG qualidade 0.8)
                const dataUrl = canvas.toDataURL('image/jpeg', 0.8);

                if (confirm("Salvar esta foto de perfil?")) {
                    try {
                        await db.collection('players').doc(player.id).update({ face: dataUrl });
                        alert("Foto atualizada com sucesso!");
                    } catch (error) {
                        console.error(error);
                        alert("Erro ao salvar: " + error.message);
                    }
                }
            };
        };
    };

    const ATTR_LIST = [
        { k: 'weakFootAcc', l: 'Pior Pé Precisão', i: '🦶' }, { k: 'shot', l: 'Finalização', i: '🥅' }, { k: 'condition', l: 'Condição Física', i: '💪' },
        { k: 'stamina', l: 'Resistência', i: '🔋' }, { k: 'header', l: 'Cabeceio', i: '🤕' }, { k: 'attack', l: 'Ataque', i: '⚔️' },
        { k: 'weakFootFreq', l: 'Pior Pé Frequência', i: '🔄' }, { k: 'longPassSpd', l: 'Passe Longo Velocidade', i: '🚀' }, { k: 'teamwork', l: 'Trabalho em Equipe', i: '🤝' },
        { k: 'freeKick', l: 'Falta', i: '🎯' }, { k: 'aggression', l: 'Agressividade', i: '😡' }, { k: 'defense', l: 'Defesa', i: '🛡️' },
        { k: 'tech', l: 'Técnica', i: '✨' }, { k: 'dribbleSpd', l: 'Drible Velocidade', i: '💨' }, { k: 'mentality', l: 'Atitude', i: '🧠' },
        { k: 'shotTech', l: 'Técnica de Chute', i: '👟' }, { k: 'balance', l: 'Equilíbrio', i: '⚖️' }, { k: 'shortPass', l: 'Passe Curto', i: '🎯' },
        { k: 'longPass', l: 'Passe Longo', i: '📡' }, { k: 'shortPassSpd', l: 'Passe Curto Velocidade', i: '⏩' }, { k: 'accel', l: 'Aceleração', i: '🏎️' },
        { k: 'gk', l: 'Habilidade Goleiro', i: '🧤' }, { k: 'shotPower', l: 'Força do Chute', i: '💣' }, { k: 'jump', l: 'Impulsão', i: '🦘' },
        { k: 'speed', l: 'Velocidade Máxima', i: '⚡' }, { k: 'curve', l: 'Efeito', i: '🍌' }, { k: 'response', l: 'Resposta', i: '💡' },
        { k: 'dribble', l: 'Drible', i: '⚽' }, { k: 'agility', l: 'Agilidade', i: '🤸' }
    ];

    const getAttrColor = (val) => {
        if (!val) return '#666';
        if (val < 50) return '#ff5e5e';
        if (val < 70) return '#ffbb33';
        return '#00C851';
    };

    const badges = [];
    const s = player.stats || {};
    if (s.goals >= 1) badges.push({icon:'⚽', name:'Primeiro Gol', color:'#fff'});
    if (s.goals >= 10) badges.push({icon:'🔥', name:'Artilheiro', color:'gold'});
    if (s.assists >= 10) badges.push({icon:'🎩', name:'Maestro', color:'var(--secondary)'});
    if (s.tackles >= 10) badges.push({icon:'🧱', name:'Paredão', color:'#aaa'});
    if (player.overall >= 80) badges.push({icon:'⭐', name:'Craque', color:'var(--purple)'});

    return (
        <div>
            {/* CABEÇALHO COM BARRA DE XP */}
            <div className="highlight-card" style={{textAlign:'center', paddingBottom:30, position:'relative'}}>
                
                {/* --- FOTO DO JOGADOR (COM BOTÃO DE UPLOAD) --- */}
                <div style={{position: 'relative', width: 80, height: 80, margin: '0 auto 10px auto'}}>
                    {player.face ? (

                    ) : (

                            👤

                    <label style={{
                        position: 'absolute', bottom: 0, right: 0,

                        📷
                        <input type="file" style={{display:'none'}} accept="image/*" onChange={handleFaceUpload} />

                </div>

                <h2 style={{margin:0}}>{String(player.name)} <span style={{fontSize:14}}>{String(player.mood || '😐')}</span></h2>
                <small style={{color:'#ccc'}}>{team?.name || 'Agente Livre'}</small>
                
                {/* MOSTRADOR DE FAMA */}

                </div>
                
                <div style={{display:'flex', justifyContent:'center', gap:30, marginTop:15}}>
                    <div style={{textAlign:'center'}}>
                        <div style={{display:'flex', alignItems:'center', justifyContent:'center', gap:5}}>

            {tab==='PERFIL' && <div>

<small style={{color:'#aaa'}}>Salário: {fmt(player.salary)} | Passe: {player.teamId === 'FREE' ? <span style={{color:'lime'}}>GRÁTIS</span> : fmt(player.value)}</small>

                <div className="card">
                    <div style={{display:'flex', justifyContent:'space-between', marginBottom:10}}>

                    {player.attributes ? (

                                return (

                                        <span title={attr.l}>{attr.i} {attr.l}</span>

                   ) : (

                            {/* Lógica Inteligente para Transferência/Neutro */}

                                <button className="btn btn-blue" onClick={()=>onAction('RESET_MOOD', player)}>🤝 RETIRAR PEDIDO E FICAR NEUTRO</button>

                            )}

                            {/* Lógica para Felicidade */}
                            {player.mood !== '🤩' && (
                                <button className="btn btn-green" style={{background: '#00E676', color: '#000'}} onClick={()=>onAction('DECLARE_HAPPY', player)}>💙 DECLARAR AMOR AO CLUBE</button>
                            )}

                    ) : (
                        <p style={{color:'var(--primary)', fontWeight:'bold'}}>Estás livre no mercado!</p>

        const reader = new FileReader();
        reader.readAsDataURL(file);
        
        reader.onload = (event) => {
            const img = new Image();
            img.src = event.target.result;
            
            img.onload = async () => {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                
                const MAX_SIZE = 150; 
                let width = img.width;
                let height = img.height;

                if (width > height) {
                    if (width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; }
                } else {
                    if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; }
                }

                canvas.width = width;
                canvas.height = height;
                ctx.drawImage(img, 0, 0, width, height);

                const dataUrl = canvas.toDataURL('image/jpeg', 0.8);

                if (confirm("Salvar esta foto de perfil do treinador?")) {

    const defaultState = {
        name:'', position:'ATA', overall:45, value:'', salary:'',

        password:'', balance: 0, rating: '',

    };

    const [f, setF] = useState({ ...defaultState, ...(initial || {}) });
    const isEditing = f.id ? true : false;
    
    // Calcula limites em tempo real baseado no Overall digitado
    const limits = getSalaryLimits(f.overall);

    const calculateRealOverall = (position, attrs) => {
        let sum = 0; let count = 0;
        const safePos = position || 'ATA'; 
        const ignoreList = safePos === 'GOL' ? ['shot', 'attack', 'dribble', 'curve', 'freeKick', 'weakFootAcc', 'weakFootFreq'] : ['gk'];
        Object.entries(attrs).forEach(([key, val]) => { if (!ignoreList.includes(key)) { sum += val; count++; } });
        return count === 0 ? 0 : Math.round(sum / count);
    };

    const handleSave = () => {
        try {
            const dataToSave = { ...f };
            const safePos = dataToSave.position || 'ATA'; 
            const ovr = parseInt(dataToSave.overall) || 50;
            
            // --- CORREÇÃO CRÍTICA: CONVERSÃO DE TIPOS ---
            // Isso impede que o saldo vire texto e cause o bug do negativo
            dataToSave.salary = parseFloat(dataToSave.salary) || 0;
            dataToSave.balance = parseFloat(dataToSave.balance) || 0; // <--- AQUI ESTAVA O PROBLEMA
            dataToSave.value = parseFloat(dataToSave.value) || 0;
            dataToSave.clause = parseFloat(dataToSave.clause) || 0;
            dataToSave.contract = parseInt(dataToSave.contract) || 0;

            // Trava de Salário (Lei do Teto)
            if (dataToSave.salary < limits.minSal || dataToSave.salary > limits.maxSal) {
                return alert(`🚫 SALÁRIO IRREGULAR!\n\nCategoria: ${limits.label} (Over ${ovr})\nPermitido: ${fmt(limits.minSal)} - ${fmt(limits.maxSal)}\nTentativa: ${fmt(dataToSave.salary)}`);
            }

            if (!dataToSave.attributes || Object.keys(dataToSave.attributes).length === 0) {
                const targetOv = parseInt(dataToSave.overall) || 60;
                const newAttrs = generateAttributes(safePos, targetOv);
                const realAvg = calculateRealOverall(safePos, newAttrs);
                
                dataToSave.attributes = newAttrs;
                dataToSave.overall = realAvg;
                dataToSave.position = safePos;
                alert(`Atributos gerados!\nOverall Real: ${realAvg}`);
            }

            onSave(dataToSave);
        } catch (error) { console.error(error); alert("Erro ao salvar: " + error.message); }
    };

    return (
        <div className="modal-bg">
            <div className="modal-content" style={{maxHeight:'90vh', overflowY:'auto'}}>
                {/* SE FOR APENAS O DONO DO TIME (NÃO ADMIN), MOSTRA O PAINEL RESUMIDO DE MERCADO */}

                        <label>Status no Mercado</label>

                        <input className="input-field" type="number" value={f.value} onChange={e=>setF({...f, value:e.target.value})} />

};

const finalVal = (isPreContract || isFreeAgent || isMyPlayer) ? 0 : v;
            onSend(target, t, finalVal, swaps, (t === 'EMPRESTIMO' ? meta.loanDuration : con), {...meta, hasBuyOption, newSalary: finalSal, role, status: 'PENDING'}, old);
                    }}>
                        {isUrgentRenewal ? 'OFERECER RENOVAÇÃO' : (isPreContract ? 'ENVIAR PRÉ-CONTRATO' : 'ENVIAR RESPOSTA')}
                    </button>
                    <button className="btn btn-red" style={{flex: 1}} onClick={()=>setModal(null)}>CANCELAR</button>
                </div>
            </div>
        </div>
    );
};

const ProductForm = ({ initial, onSave, onDelete, user }) => {

    const [p, setP] = useState(initial || { 
        name:'', 
        cat:'energy', 
        power:10, 
        price:'', 
        stock: 1, 
        desc:'' 
    });
    
    const isEditing = !!initial?.id;

    // =========================
    // 1️⃣ BASE ECONÔMICA POR CATEGORIA
    // =========================
    const getCategoryBaseCost = (cat) => {
        if (cat === 'energy') return 100;
        if (cat === 'training') return 500;
        if (cat === 'luxury') return 2000;
        return 100;
    };

    const getPowerMultiplier = (cat) => {
        if (cat === 'energy') return 12;
        if (cat === 'training') return 80;
        if (cat === 'luxury') return 400;
        return 10;
    };

    // =========================
    // 2️⃣ CÁLCULO UNITÁRIO INTELIGENTE
    // =========================
    const calculateUnitCost = (cat, power, quantity) => {

        const base = getCategoryBaseCost(cat);
        const multiplier = getPowerMultiplier(cat);
        const pwr = parseInt(power) || 0;

        let rawCost = base + (pwr * multiplier);

        // 🔥 Escalonamento por lote
        const escalationSteps = Math.floor(quantity / 10);
        const escalationPercent = escalationSteps * 0.02; // +2% a cada 10 unidades

        rawCost = rawCost * (1 + escalationPercent);

        return Math.ceil(rawCost);
    };

    // =========================
    // 3️⃣ QUANTIDADE SEGURA
    // =========================
    const quantityToProduce = Math.max(1, parseInt(p.stock) || 1);

    const unitCost = calculateUnitCost(p.cat, p.power, quantityToProduce);
    const totalProductionCost = unitCost * quantityToProduce;

    const companyBalance = user.data?.balance || 0;
    const hasEnoughMoney = companyBalance >= totalProductionCost;

    // =========================
    // 4️⃣ CONTROLES + / -
    // =========================
    const increaseQty = () => {
        if(quantityToProduce < 500) {
            setP({...p, stock: quantityToProduce + 1});
        }
    };

    const decreaseQty = () => {
        if(quantityToProduce > 1) {
            setP({...p, stock: quantityToProduce - 1});
        }
    };

    // =========================
    // 5️⃣ PRODUÇÃO SEGURA
    // =========================
    const handleProduction = async () => {

        if(!p.name || !p.price)
            return alert("Preencha Nome e Preço de Venda!");

        if(quantityToProduce <= 0)
            return alert("Quantidade inválida.");

        if(!hasEnoughMoney)
            return alert(`Saldo insuficiente! Necessário: ${fmt(totalProductionCost)}`);

        try {

            if (totalProductionCost > 0) {
                await db.collection('companies')
                    .doc(user.data.id)
                    .update({
                        balance: firebase.firestore.FieldValue.increment(-totalProductionCost)
                    });
            }

            const finalStockCount = isEditing 
                ? (parseInt(initial.stock || 0) + quantityToProduce)
                : quantityToProduce;

            onSave({
                ...p,
                stock: finalStockCount,
                productionCost: unitCost,
                lastProductionTotal: totalProductionCost
            });

        } catch (e) {
            alert("Erro ao processar produção: " + e.message);
        }
    };

    return (
        <div className="modal-bg">
            <div className="modal-content" style={{
                border: '2px solid var(--purple)', 
                boxShadow: '0 0 20px rgba(213,0,249,0.3)'
            }}>

                <h2 style={{marginTop:0, color:'var(--purple)'}}>
                    🏭 FÁBRICA DA EMPRESA
                </h2>

                {/* CONFIG ITEM */}
                <div style={{
                    background:'rgba(255,255,255,0.03)', 
                    padding:15, 
                    borderRadius:10, 
                    marginBottom:20
                }}>
                    <label>Nome do Produto</label>
                    <input 
                        className="input-field"
                        value={p.name}
                        onChange={e=>setP({...p, name:e.target.value})}
                        disabled={isEditing}
                    />

                    <label>Categoria</label>
                    <select 
                        className="input-field"
                        value={p.cat}
                        onChange={e=>setP({...p, cat:e.target.value})}
                        disabled={isEditing}
                    >
                        <option value="energy">⚡ Energia</option>
                        <option value="training">👟 Treino / XP</option>
                        <option value="luxury">💎 Luxo / Fama</option>
                    </select>

                    <label>
                        Potência: <b style={{color:'gold'}}>{p.power}</b>
                    </label>

                    <input 
                        type="range" 
                        min="1" 
                        max="100"
                        value={p.power}
                        onChange={e=>setP({...p, power: parseInt(e.target.value)})}
                        disabled={isEditing}
                    />
                </div>

                {/* QUANTIDADE */}
                <div style={{
                    background:'rgba(213, 0, 249, 0.08)',
                    padding:20,
                    borderRadius:12,
                    border:'1px solid var(--purple)',
                    marginBottom:20
                }}>
                    <h4 style={{marginTop:0}}>📦 PRODUÇÃO</h4>

                    <div style={{
                        display:'flex',
                        alignItems:'center',
                        justifyContent:'center',
                        gap:15,
                        marginBottom:15
                    }}>
                        <button className="btn btn-ghost" onClick={decreaseQty}>−</button>
                        <div style={{fontSize:22, fontWeight:'bold'}}>
                            {quantityToProduce}
                        </div>
                        <button className="btn btn-ghost" onClick={increaseQty}>+</button>
                    </div>

                    <input
                        type="number"
                        min="1"
                        max="500"
                        className="input-field"
                        value={quantityToProduce}
                        onChange={e=>setP({...p, stock: Math.max(1, parseInt(e.target.value) || 1)})}
                    />

                    <div style={{
                        marginTop:20,
                        fontSize:13
                    }}>
                        <div style={{display:'flex', justifyContent:'space-between'}}>
                            <span>Custo por unidade:</span>
                            <b>{fmt(unitCost)}</b>
                        </div>

                        <div style={{
                            display:'flex',
                            justifyContent:'space-between',
                            fontSize:18,
                            marginTop:10
                        }}>
                            <span>💰 TOTAL:</span>
                            <b style={{
                                color: hasEnoughMoney ? '#00E676' : '#FF1744'
                            }}>
                                {fmt(totalProductionCost)}
                            </b>
                        </div>
                    </div>
                </div>

                <label>Preço de Venda (₣)</label>
                <input 
                    type="number"
                    className="input-field"
                    value={p.price}
                    onChange={e=>setP({...p, price:e.target.value})}
                />

                <div style={{display:'flex', gap:10, marginTop:15}}>
                    <button 
                        className="btn btn-green"
                        disabled={!hasEnoughMoney}
                        onClick={handleProduction}
                        style={{flex:2}}
                    >
                        {isEditing 
                            ? `REPOR (+${quantityToProduce})`
                            : `PRODUZIR (-${fmt(totalProductionCost)})`
                        }
                    </button>

                    <button 
                        className="btn btn-ghost"
                        onClick={()=>onSave(null)}
                        style={{flex:1}}
                    >
                        CANCELAR
                    </button>
                </div>

            </div>
        </div>
    );
};

                {view === 'RED' && renderPlayers('reds', '🟥', 'red')}
            </div>

            {/* MODAL DE INSPEÇÃO CORRIGIDO (SEM ERRO DE OBJETO) */}

    const MatchPerformanceForm = ({ players, teams, onSaveStats, matchData }) => {
    const [mode, setMode] = useState('TEAM'); 
    
    // --- ESTADOS DO MODO SÚMULA RÁPIDA (TIME) ---
    const [selTeamId, setSelTeamId] = useState('');
    const [teamResult, setTeamResult] = useState('NENHUM');
    const [batchStats, setBatchStats] = useState({}); 

    // --- ESTADOS DO MODO INDIVIDUAL (ANTIGO) ---
    const [selP, setSelP] = useState(null);
    const [match, setMatch] = useState({ goals:0, assists:0, tackles:0, saves:0, yellows:0, reds:0, rating:'', result:'NENHUM', injuredType: 'NONE' }); 
    const [search, setSearch] = useState('');

    // --- LÓGICA DE SORTEIO DE LESÃO (SÚMULA) ---
    const rollInjury = (withAmbulance) => {
        const rand = Math.random() * 100;
        let cat = 'LEVE';
        let time = 1;

        if (withAmbulance) {
            // Se sair de ambulância: Maior chance de ser Grave/Extrema
            if (rand < 10) { cat = 'LEVE'; time = 1; }
            else if (rand < 35) { cat = 'MODERADA'; time = Math.floor(Math.random() * 2) + 2; } // 2-3
            else if (rand < 75) { cat = 'GRAVE'; time = Math.floor(Math.random() * 3) + 4; }    // 4-6
            else { cat = 'EXTREMA'; time = Math.floor(Math.random() * 4) + 7; }                // 7-10
        } else {
            // Se sair andando: Geralmente Leve/Moderada
            if (rand < 50) { cat = 'LEVE'; time = 1; }
            else if (rand < 85) { cat = 'MODERADA'; time = 2; }
            else if (rand < 97) { cat = 'GRAVE'; time = Math.floor(Math.random() * 2) + 3; }    // 3-4
            else { cat = 'EXTREMA'; time = 5; }
        }

        const injuryList = INJURIES_DB[cat];
        const injuryName = injuryList[Math.floor(Math.random() * injuryList.length)];

        return { name: injuryName, time: time };
    };

    // --- LÓGICA DO MODO TIME ---
    const handleBatchChange = (pid, field, val) => {
        setBatchStats(prev => ({
            ...prev,
            [pid]: { ...prev[pid], [field]: val }
        }));
    };

    const submitBatch = () => {
        const payload = [];
        const teamPlayers = players.filter(p => p.teamId === selTeamId);
        
        teamPlayers.forEach(p => {
            const s = batchStats[p.id] || {};
            // Só adiciona se o jornalista tiver dado pelo menos a NOTA
            if (s.rating && s.rating !== '') {
                let injuryData = null;
                // Se marcou que lesionou
                if (s.injuredType && s.injuredType !== 'NONE') {
                    injuryData = rollInjury(s.injuredType === 'AMBULANCE');
                }

                payload.push({
                    player: p,
                    match: {
                        goals: parseInt(s.goals || 0),
                        assists: parseInt(s.assists || 0),
                        tackles: parseInt(s.tackles || 0),
                        saves: parseInt(s.saves || 0),
                        yellows: parseInt(s.yellows || 0),
                        reds: parseInt(s.reds || 0),
                        rating: parseFloat(s.rating),
                        result: teamResult,
                        // Novos campos de lesão
                        injury: injuryData ? injuryData.name : null,
                        recoveryLeft: injuryData ? injuryData.time : 0
                    }
                });
            }
        });

        if (payload.length === 0) return alert("Preencha a NOTA de pelo menos um jogador para salvar.");
        
        if (confirm(`Confirmar súmula para ${payload.length} jogadores?`)) {
            // Descobre quem é o mandante da partida e envia para cobrar bilheteria
            const homeTeamObj = matchData ? teams.find(t => t.id === matchData.homeId) : null;
            
            // Só cobra bilheteria se a súmula for do time mandante!
            if (homeTeamObj && selTeamId === homeTeamObj.id) {
                onSaveStats(payload, null, undefined, homeTeamObj);
            } else {
                onSaveStats(payload); // Se for o visitante, não cobra bilheteria
            }
        }
    };

    const filtered = players.filter(p => p.name.toLowerCase().includes(search.toLowerCase()));

    // --- RENDERIZAÇÃO ---
    return (
        <div style={{minHeight: 400}}>
            <h3 style={{color:'var(--primary)', marginTop:0}}>Lançar Desempenho</h3>
            
            <div style={{display:'flex', gap:10, marginBottom:15}}>
                <button className={`btn ${mode==='TEAM'?'btn-blue':'btn-ghost'}`} onClick={()=>setMode('TEAM')}>POR TIME (RÁPIDO)</button>
                <button className={`btn ${mode==='SEARCH'?'btn-purple':'btn-ghost'}`} onClick={()=>setMode('SEARCH')}>BUSCA INDIVIDUAL</button>
            </div>

            {/* === MODO 1: SÚMULA POR TIME (TABELA DETALHADA) === */}
            {mode === 'TEAM' && (
                <div>
                    <div style={{display:'flex', gap:10, marginBottom:10}}>
                        <div style={{flex:1}}>
                            <label style={{fontSize:10}}>Selecione o Time</label>
                            <select className="input-field" value={selTeamId} onChange={e=>setSelTeamId(e.target.value)}>
                                <option value="">-- Escolha --</option>
                                {teams.filter(t=>t.status!=='PENDING').map(t=><option key={t.id} value={t.id}>{t.name}</option>)}
                            </select>
                        </div>
                        <div style={{width:120}}>
                            <label style={{fontSize:10}}>Resultado Geral</label>
                            <select className="input-field" value={teamResult} onChange={e=>setTeamResult(e.target.value)}>
                                <option value="NENHUM">Neutro</option>
                                <option value="VITORIA">Vitória</option>
                                <option value="EMPATE">Empate</option>
                                <option value="DERROTA">Derrota</option>
                            </select>
                        </div>
                    </div>

                    {selTeamId && (
                        <div>
                            <div style={{maxHeight:'350px', overflowY:'auto', border:'1px solid #333', borderRadius:5}}>
                                <table style={{width:'100%', borderCollapse:'collapse', fontSize:10}}>
                                    <thead style={{background:'#222', position:'sticky', top:0, zIndex:2}}>
                                        <tr>
                                            <th style={{padding:5, textAlign:'left'}}>Jogador</th>
                                            <th style={{padding:2, width:35, textAlign:'center', color:'gold'}}>Nota</th>
                                            <th style={{padding:2, width:30, textAlign:'center'}}>GOL</th>
                                            <th style={{padding:2, width:30, textAlign:'center'}}>ASS</th>
                                            <th style={{padding:2, width:110, textAlign:'center', color:'#ff1744'}}>Ocorreu Lesão?</th>
                                            <th style={{padding:2, width:30, textAlign:'center', color:'orange'}}>DES</th>
                                            <th style={{padding:2, width:30, textAlign:'center', color:'cyan'}}>DEF</th>
                                            <th style={{padding:2, width:30, textAlign:'center', color:'yellow'}}>AMA</th>
                                            <th style={{padding:2, width:30, textAlign:'center', color:'red'}}>VER</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {players.filter(p => p.teamId === selTeamId).map(p => {
                                            const s = batchStats[p.id] || {};
                                            const hasData = s.rating && s.rating !== '';
                                            const isGK = p.position === 'GOL';

                                            return (
                                                <tr key={p.id} style={{background: hasData ? 'rgba(0,255,0,0.08)' : 'transparent', borderBottom:'1px solid #333'}}>
                                                    <td style={{padding:5}}>
                                                        <b>{p.name} {p.recoveryLeft > 0 ? '❌' : ''}</b><br/>
                                                        <span style={{color:'#888', fontSize:9}}>{p.position}</span>
                                                    </td>
                                                    <td style={{padding:2}}>
                                                        <input className="input-field" type="number" step="0.1" style={{marginBottom:0, padding:2, textAlign:'center', height:25, borderColor: hasData ? 'lime' : '#444'}} 
                                                            placeholder="-" 
                                                            value={s.rating || ''}
                                                            onChange={e=>handleBatchChange(p.id, 'rating', e.target.value)}
                                                        />
                                                    </td>
                                                    <td style={{padding:2}}>
                                                        <input className="input-field" type="number" style={{marginBottom:0, padding:2, textAlign:'center', height:25}} 
                                                            placeholder="0"
                                                            onChange={e=>handleBatchChange(p.id, 'goals', e.target.value)}
                                                        />
                                                    </td>
                                                    <td style={{padding:2}}>
                                                        <input className="input-field" type="number" style={{marginBottom:0, padding:2, textAlign:'center', height:25}} 
                                                            placeholder="0"
                                                            onChange={e=>handleBatchChange(p.id, 'assists', e.target.value)}
                                                        />
                                                    </td>
                                                    <td style={{padding:2}}>
                                                        <select className="input-field" style={{marginBottom:0, fontSize:9, padding:2, background: s.injuredType && s.injuredType !== 'NONE' ? '#440000' : 'var(--bg-input)'}} onChange={e=>handleBatchChange(p.id, 'injuredType', e.target.value)}>
                                                            <option value="NONE">✅ Saudável</option>
                                                            <option value="WALKING">🚶 Lesão s/ Ambulância</option>
                                                            <option value="AMBULANCE">🚑 Lesão c/ Ambulância</option>
                                                        </select>
                                                    </td>
                                                    <td style={{padding:2}}>
                                                        <input className="input-field" type="number" 
                                                            style={{marginBottom:0, padding:2, textAlign:'center', height:25, background: isGK ? '#111' : 'var(--bg-input)', color:'orange', opacity: isGK ? 0.3 : 1}} 
                                                            placeholder="0" 
                                                            disabled={isGK}
                                                            onChange={e=>handleBatchChange(p.id, 'tackles', e.target.value)} 
                                                        />
                                                    </td>
                                                    <td style={{padding:2}}>
                                                        <input className="input-field" type="number" 
                                                            style={{marginBottom:0, padding:2, textAlign:'center', height:25, background: !isGK ? '#111' : 'var(--bg-input)', color:'cyan', opacity: !isGK ? 0.3 : 1}} 
                                                            placeholder="0" 
                                                            disabled={!isGK}
                                                            onChange={e=>handleBatchChange(p.id, 'saves', e.target.value)} 
                                                        />
                                                    </td>
                                                    <td style={{padding:2}}>
                                                        <input className="input-field" type="number" style={{marginBottom:0, padding:2, textAlign:'center', height:25, color:'yellow'}} 
                                                            placeholder="0"
                                                            onChange={e=>handleBatchChange(p.id, 'yellows', e.target.value)}
                                                        />
                                                    </td>
                                                    <td style={{padding:2}}>
                                                        <input className="input-field" type="number" style={{marginBottom:0, padding:2, textAlign:'center', height:25, color:'red'}} 
                                                            placeholder="0"
                                                            onChange={e=>handleBatchChange(p.id, 'reds', e.target.value)}
                                                        />
                                                    </td>
                                                </tr>
                                            );
                                        })}
                                    </tbody>
                                </table>
                            </div>
                            <button className="btn btn-green" style={{marginTop:15, padding:15}} onClick={submitBatch}>
                                💾 SALVAR SÚMULA COMPLETA
                            </button>
                        </div>
                    )}
                </div>
            )}

            {/* === MODO 2: BUSCA INDIVIDUAL (Mantido e Corrigido) === */}
           {mode === 'SEARCH' && (
                <div>
                    {!selP ? (
                        <div>
                            <input className="input-field" placeholder="Buscar jogador..." value={search} onChange={e=>setSearch(e.target.value)} />
                            <div style={{maxHeight:300, overflowY:'auto'}}>
                                {search.length > 0 && filtered.map(p => (
                                    <div key={p.id} className="card" onClick={()=>{setSelP(p); setMatch({goals:0, assists:0, tackles:0, saves:0, yellows:0, reds:0, rating:'', result:'NENHUM', injuredType: 'NONE'});}}>
                                        <b>{p.name} {p.recoveryLeft > 0 ? '❌' : ''}</b> <small>({teams.find(t=>t.id===p.teamId)?.name})</small>
                                    </div>
                                ))}
                            </div>
                        </div>
                    ) : (
                        <div>
                            <h4 style={{color:'var(--primary)', margin:'0 0 10px 0'}}>Súmula: {selP.name}</h4>
                            <div style={{background:'rgba(255,255,255,0.05)', padding:10, borderRadius:8, marginBottom:10}}>
                                <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:10}}>
                                    <div><label>⚽ Gols</label><input className="input-field" type="number" value={match.goals} onChange={e=>setMatch({...match, goals:parseInt(e.target.value)})} /></div>
                                    <div><label>👟 Assist</label><input className="input-field" type="number" value={match.assists} onChange={e=>setMatch({...match, assists:parseInt(e.target.value)})} /></div>
                                    <div><label>🛡️ Desar</label><input className="input-field" type="number" value={match.tackles} onChange={e=>setMatch({...match, tackles:parseInt(e.target.value)})} /></div>
                                    <div><label>🧤 Defes</label><input className="input-field" type="number" value={match.saves} onChange={e=>setMatch({...match, saves:parseInt(e.target.value)})} /></div>
                                    <div><label>🟨 Amar</label><input className="input-field" type="number" value={match.yellows} onChange={e=>setMatch({...match, yellows:parseInt(e.target.value)})} /></div>
                                    <div><label>🟥 Verm</label><input className="input-field" type="number" value={match.reds} onChange={e=>setMatch({...match, reds:parseInt(e.target.value)})} /></div>
                                </div>
                                <hr style={{borderColor:'#444'}}/>
                                
                                {/* --- SELETOR DE LESÃO NO MODO INDIVIDUAL --- */}
                                <div style={{marginBottom:10, border:'1px dashed #ff1744', padding:5, borderRadius:5}}>
                                    <label style={{color:'#ff1744', fontSize:11}}>🚑 Ocorreu Lesão?</label>
                                    <select className="input-field" value={match.injuredType} onChange={e=>setMatch({...match, injuredType:e.target.value})}>
                                        <option value="NONE">✅ Não</option>
                                        <option value="WALKING">🚶 Sim (Leve/Moderada)</option>
                                        <option value="AMBULANCE">🚑 Sim (Grave/Ambulância)</option>
                                    </select>
                                </div>

                                <label>⭐ Nota (0.0 - 10.0)</label>
                                <input className="input-field" type="number" step="0.1" value={match.rating} onChange={e=>setMatch({...match, rating:e.target.value})} />
                                <label>🚩 Resultado</label>
                                <select className="input-field" value={match.result} onChange={e=>setMatch({...match, result:e.target.value})}>
                                    <option value="NENHUM">Neutro</option>
                                    <option value="VITORIA">Vitória</option>
                                    <option value="EMPATE">Empate</option>
                                    <option value="DERROTA">Derrota</option>
                                </select>
                            </div>
                            <div style={{display:'flex', gap:10}}>
                                <button className="btn btn-green" onClick={()=>{
                                    let finalMatch = {...match};
                                    // Processa a lesão no modo individual
                                    if(match.injuredType && match.injuredType !== 'NONE') {
                                        const inj = rollInjury(match.injuredType === 'AMBULANCE');
                                        finalMatch.injury = inj.name;
                                        finalMatch.recoveryLeft = inj.time;
                                    }
                                    onSaveStats([{ player: selP, match: finalMatch }]);
                                }}>LANÇAR</button>
                                <button className="btn" onClick={()=>setSelP(null)}>VOLTAR</button>
                            </div>
                        </div>
                    )}
                </div>
            )}
        </div>
    );
};

        <div style="font-size: 50px;">📡</div>
        <h2 style="color: white; font-family: sans-serif; margin: 20px 0;">Sem Conexão</h2>
        <p style="color: #888; font-family: sans-serif;">O Mato Real precisa de internet para funcionar.</p>
        <button onclick="window.location.reload()" style="padding: 10px 20px; background: #00E676; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 20px;">TENTAR RECONECTAR</button>
    </div>

    <div id="ios-install-prompt" style="display: none; position: fixed; bottom: 40px; left: 5%; right: 5%; background: rgba(30, 30, 30, 0.95); border: 1px solid #00E676; padding: 20px; border-radius: 15px; z-index: 99999; box-shadow: 0 10px 30px rgba(0,0,0,0.8); text-align: center; color: white; font-family: sans-serif; backdrop-filter: blur(10px);">
        <button onclick="document.getElementById('ios-install-prompt').style.display='none'" style="position: absolute; top: 10px; right: 15px; background: transparent; border: none; color: #666; font-size: 24px; cursor: pointer;">&times;</button>
        <div style="font-size: 40px; margin-bottom: 10px;">📲</div>
        <p style="margin: 0 0 5px 0; font-size: 16px; font-weight: bold; color: #00E676;">Instalar App</p>
        <p style="font-size: 13px; color: #ccc; margin-bottom: 20px; line-height: 1.4;">Instale para jogar em tela cheia:</p>
        <div style="text-align: left; background: rgba(255,255,255,0.05); padding: 15px; border-radius: 10px; font-size: 13px;">
            <div style="margin-bottom: 10px; display: flex; align-items: center; gap: 10px;">
                <span style="font-size: 20px;">1.</span> <span>Toque em <b>Compartilhar</b> <span style="font-size: 18px;">⎋</span></span>
            </div>
            <div style="display: flex; align-items: center; gap: 10px;">
                <span style="font-size: 20px;">2.</span> <span><b>"Adicionar à Tela de Início"</b> <span style="font-size: 18px;">⊞</span></span>
            </div>
        </div>
        <div style="position: absolute; bottom: -10px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 10px solid transparent; border-right: 10px solid transparent; border-top: 10px solid #00E676;"></div>
        <div style="font-size: 20px; position: absolute; bottom: -35px; left: 50%; transform: translateX(-50%); color: #00E676; animation: bounce 1s infinite;">⬇</div>
    </div>
    <style>@keyframes bounce { 0%, 100% { transform: translate(-50%, 0); } 50% { transform: translate(-50%, 5px); } }</style>

    <script>
        // 1. REGISTRA O "MOTOR DE LIMPEZA" (Garante que está online)
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                // Força o navegador a buscar o novo arquivo no servidor
                navigator.serviceWorker.register('service-worker.js', { scope: './' })
                .then(registration => {
                    // Tenta atualizar imediatamente
                    registration.update(); 
                    console.log('App Online Registrado');
                });
            });
            
            // Recarrega a página automaticamente se uma nova versão assumir o controle
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                window.location.reload();
            });
        }

        // 2. DETECTOR DE INTERNET (TRAVA)
        function checkInternet() {
            const blocker = document.getElementById('offline-blocker');
            if (!navigator.onLine) {
                blocker.style.display = 'flex';
            } else {
                blocker.style.display = 'none';
            }
        }
        window.addEventListener('offline', checkInternet);
        window.addEventListener('online', checkInternet);
        checkInternet();

        // 3. LÓGICA IPHONE
        const isIos = () => /iphone|ipad|ipod/.test(window.navigator.userAgent.toLowerCase());
        const isInStandaloneMode = () => ('standalone' in window.navigator) && (window.navigator.standalone);
        if (isIos() && !isInStandaloneMode()) {
            document.getElementById('ios-install-prompt').style.display = 'block';
        }
    </script>
</body>
</html>
