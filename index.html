    const o = parseInt(ovr) || 0;
    
    // 1. Tabela Base por Overall
    let base = 40000; // Padrão (50-54)
    if (o >= 90) base = 20000000;
    else if (o >= 85) base = 10000000;
    else if (o >= 80) base = 6000000;
    else if (o >= 75) base = 3000000;
    else if (o >= 70) base = 1000000;
    else if (o >= 65) base = 400000;
    else if (o >= 60) base = 150000;
    else if (o >= 55) base = 80000;

    // 2. Multiplicador por Posição
    let mult = 1.0; // Base (Laterais e Meias)
    if (pos === 'GOL') mult = 1.20;       // +20%
    else if (['ZAG'].includes(pos)) mult = 1.15; // +15%
    else if (['VOL', 'MC', 'MD', 'ME'].includes(pos)) mult = 1.05; // +5%
    else if (['PTD', 'PTE'].includes(pos)) mult = 0.95; // -5%
    else if (['ATA', 'SA'].includes(pos)) mult = 0.90;  // -10%

    return Math.round(base * mult);
};

const getPriceStatus = (askedPrice, recommendedPrice) => {
    if (!askedPrice || askedPrice <= 0) return { label: 'GRÁTIS', color: 'lime' };
    
    const ratio = parseFloat(askedPrice) / parseFloat(recommendedPrice);

    // Lógica de tolerância (Margem de 20%)
    if (ratio < 0.8) return { label: '💰 BARGANHA (ABAIXO DA MÉDIA)', color: 'gold' };
    if (ratio > 1.2) return { label: '💸 ACIMA DA MÉDIA', color: '#ff5555' };
    return { label: '✅ PREÇO JUSTO', color: '#00E676' };
};

// --- CALCULADORA DE SÓCIO TORCEDOR EM TEMPO REAL ---
const calculateSocios = (team, teamPlayers) => {
    if (!team) return 0;
    const baseBySerie = { 'A': 10000, 'B': 4000, 'C': 1500, 'D': 500, 'VARZEA': 100 };
    const base = baseBySerie[team.serie || 'VARZEA'] || 100;

    // 1. Fator Fama (Soma da fama do elenco / 20)
    const totalFame = teamPlayers.reduce((acc, p) => acc + (p.fame || 0), 0);
    const fameBonus = Math.floor(totalFame / 20);

    // 2. Fator Fase do Time (Últimos 5 jogos)
    const form = team.recentForm || []; // Ex: ['VITORIA', 'EMPATE', 'DERROTA']
    let formMultiplier = 1.0;
    if (form.length > 0) {
        const wins = form.filter(r => r === 'VITORIA').length;
        const losses = form.filter(r => r === 'DERROTA').length;
        if (wins > losses) formMultiplier += (wins * 0.06); // Até +30%
        if (losses > wins) formMultiplier -= (losses * 0.08); // Até -40%
    }

    const potentialSocios = Math.floor((base + fameBonus) * formMultiplier);

    // 3. Fator Ganância (Preço)
    const price = team.socioPrice || 40;
    let priceMultiplier = 1.0;
    if (price > 10) {
        // Equação linear: 10 = 100% de adesão | 150 = 10% de adesão
        priceMultiplier = 1.0 - ((price - 10) * 0.006428); 
    }
    if (priceMultiplier < 0.05) priceMultiplier = 0.05; // Mínimo de 5% de loucos que pagam qualquer preço

    return Math.max(0, Math.floor(potentialSocios * priceMultiplier));
};

// --- A "CONSCIÊNCIA" DO BOT (INTELIGÊNCIA ARTIFICIAL) ---
// Avalia se o NPC aceita a proposta
const processBotDecision = (offer, buyingTeam, npcPlayer) => {
    const minFairSalary = getSalaryLimits(npcPlayer.overall).minSal;
    const offeredSalary = parseFloat(offer.meta.newSalary) || 0;
    
    // Fator Fase do Time (O Bot não quer ir para time que só perde)
    const form = buyingTeam.recentForm || [];
    const wins = form.filter(r => r === 'VITORIA').length;
    const losses = form.filter(r => r === 'DERROTA').length;
    
    // Se o time está muito mal, o bot exige mais dinheiro para aceitar ir (Mercenário)
    let salaryRequirementMult = 1.0;
    if (losses > wins) salaryRequirementMult = 1.2; // Exige 20% a mais
    if (wins > losses) salaryRequirementMult = 0.9; // Aceita ganhar 10% a menos pra jogar em time vencedor
    
    const targetSalary = minFairSalary * salaryRequirementMult;

    if (offeredSalary >= targetSalary) {
        return { decision: 'ACCEPT', message: `🤖 O empresário de ${npcPlayer.name} achou a oferta excelente e aceitou os termos contratuais!` };
    } else if (offeredSalary >= targetSalary * 0.8) {
        return { 
            decision: 'COUNTER', 
            counterValue: targetSalary, 
            message: `🤖 O jogador tem interesse no ${buyingTeam.name}, mas pede um ajuste salarial para ${fmt(targetSalary)}.` 
        };
    } else {
        return { decision: 'REJECT', message: `🤖 A proposta salarial foi considerada muito baixa pelo staff de ${npcPlayer.name}. Negociação encerrada.` };
    }
};

const getProdCost = (cat, power) => {
    const p = parseInt(power) || 0;
    
    // 1. SAÚDE / ENERGIA (Mais barato, pois consome muito)
    // Ex: Power 50 = 50 * 15 = 750
    // Ex: Power 100 = 100 * 15 = 1.500
    if (['energy', 'SAUDE', 'CONSUMIVEL'].includes(cat)) {
        return p * 15; 
    }
    
    // 2. TREINO / XP (Médio, pois dá vantagem competitiva)
    // Ex: Power 50 = 50 * 100 = 5.000
    // Ex: Power 100 = 100 * 100 = 10.000
    if (['training', 'CHUTEIRA', 'LUVAS'].includes(cat)) {
        return p * 100; 
    }
    
    // 3. FAMA / LUXO (Muito caro, pois é status)
    // Ex: Power 50 = 50 * 500 = 25.000
    // Ex: Power 100 = 100 * 500 = 50.000
    if (['vehicle', 'real_estate', 'VEICULO', 'IMOVEL', 'TECNOLOGIA', 'LUXO'].includes(cat)) {
        return p * 500;
    }
    
    return 50; // Custo base de segurança
};

// Gerador de Atributos V3.1 (Com Pontas PTD/PTE)
const generateAttributes = (pos, targetOv) => {
    const ov = parseInt(targetOv) || 50;
    const attrs = {};
    const keys = Object.keys(ATTR_LABELS);

    let primary = [], secondary = [];

    if (pos === 'GOL') {
        primary = ['gk', 'response', 'jump', 'longPass'];
        secondary = ['balance', 'condition', 'mentality', 'defense'];
    } else if (pos.includes('ZAG')) {
        primary = ['defense', 'header', 'balance', 'jump', 'aggression'];
        secondary = ['stamina', 'response', 'shortPass', 'longPass'];
    } else if (pos.includes('LAT') || pos.includes('LD') || pos.includes('LE')) {
        primary = ['speed', 'accel', 'stamina', 'shortPass', 'dribble'];
        secondary = ['defense', 'longPass', 'curve', 'attack'];
    } else if (pos.includes('VOL') || pos.includes('MC') || pos === 'MD' || pos === 'ME') {
        primary = ['shortPass', 'stamina', 'teamwork', 'defense', 'balance'];
        secondary = ['longPass', 'tech', 'shotPower', 'vision'];
    } else if (pos.includes('MEI') || pos.includes('MAT')) {
        primary = ['dribble', 'shortPass', 'vision', 'tech', 'curve', 'agility'];
        secondary = ['shot', 'speed', 'attack', 'freeKick'];
        
    // --- NOVO BLOCO ESPECÍFICO PARA PONTAS (PTD / PTE) ---
    } else if (pos === 'PTD' || pos === 'PTE') {
        // Pontas precisam de muita velocidade, drible e cruzamento (curve/longPass)
        primary = ['speed', 'accel', 'dribble', 'agility', 'curve'];
        secondary = ['shot', 'stamina', 'longPass', 'technique'];

    // --- BLOCO PARA CENTROAVANTES (ATA / SA) ---
    } else if (pos.includes('ATA') || pos.includes('SA') || pos.includes('PNT')) {
        primary = ['shot', 'attack', 'header', 'shotPower', 'balance'];
        secondary = ['speed', 'reaction', 'dribble', 'strength'];
    }

    // 1. Geração Base
    keys.forEach(k => {
        let base = ov;
        
        if (primary.includes(k)) {
            base += Math.floor(Math.random() * 6) + 2; 
        } else if (secondary.includes(k)) {
            base -= Math.floor(Math.random() * 4); 
        } else {
            base -= Math.floor(Math.random() * 10) + 5; 
        }

        if (pos !== 'GOL' && k === 'gk') base = 10; 
        if (pos === 'GOL' && ['shot', 'attack', 'dribble', 'curve', 'freeKick'].includes(k)) base = Math.max(15, base - 20);

        if (ov < 80 && base > 88) base = 88;
        if (base > 99) base = 99;
        if (base < 1) base = 1;
        
        attrs[k] = base;
    });

    // 2. Normalização
    const relevantKeys = keys.filter(k => {
        if (pos === 'GOL') return !['shot', 'attack', 'dribble', 'curve', 'freeKick', 'weakFootAcc', 'weakFootFreq'].includes(k);
        return k !== 'gk';
    });
    
    let sum = 0;
    relevantKeys.forEach(k => sum += attrs[k]);
    const currentAvg = sum / relevantKeys.length;
    const diff = ov - currentAvg;
    
    relevantKeys.forEach(k => {
        let boost = diff;
        if (attrs[k] > 90 && ov < 85 && diff > 0) boost = 0;
        let newVal = attrs[k] + boost;
        if (newVal > 99) newVal = 99;
        if (newVal < 1) newVal = 1;
        attrs[k] = Math.round(newVal);
    });

    return attrs;
};

const formatOfferDetails = (type, v, con, meta, swapIds, players) => {
    let details = [];
    if(v > 0) details.push(`💰 Valor: ${fmt(v)}`);
    if (meta.installments > 1) details.push(`📅 Parcelamento: ${meta.installments}x de ${fmt(v/meta.installments)}`);
    if (type !== 'TROCA') details.push(`📝 Contrato: ${con} Temporadas`);
    if (type === 'COMPRA' && meta.sellOn > 0) details.push(`📈 Revenda: ${meta.sellOn}% futura venda`);
    if (type === 'EMPRESTIMO') { details.push(`💸 Salários: Comprador paga ${meta.wageSplit}%`); if (meta.buyOpt > 0) details.push(`🛒 Opção de Compra: ${fmt(meta.buyOpt)}`); }
    if (type === 'TROCA') {
        if (swapIds && swapIds.length > 0) { const swapNames = swapIds.map(id => players.find(p=>p.id===id)?.name).join(', '); details.push(`🔄 Troca por: ${swapNames}`); }
        if (v > 0) details.push(`💵 Volta: ${meta.cashDir === 'PAY' ? 'Eu pago' : 'Eu recebo'} ${fmt(v)}`);
    }
    return details.join('\n');
};

const LeagueTable = ({ teams, serie, estado, onInspectTeam }) => {

        if (isEstadual) return t.estado === estado && t.status !== 'PENDING';
        
        const timeSerie = t.serie || 'A';
        if (serie === 'VARZEA') return timeSerie === 'VARZEA' && t.status !== 'PENDING';
        return timeSerie === serie && t.status !== 'PENDING';
    }).sort((a, b) => {
        // Se for estadual, usa stateStats. Se for nacional, usa stats.
        const sA = isEstadual ? (a.stateStats || {}) : (a.stats || {});
        const sB = isEstadual ? (b.stateStats || {}) : (b.stats || {});
        
        if ((sA.pts||0) !== (sB.pts||0)) return (sB.pts||0) - (sA.pts||0);
        if ((sA.wins||0) !== (sB.wins||0)) return (sB.wins||0) - (sA.wins||0);
        return ((sB.gf||0)-(sB.ga||0)) - ((sA.gf||0)-(sA.ga||0));
    });

                        <option key={s} value={s}>{s === 'VARZEA' ? '🚜 Terrão (Várzea)' : `Série ${s}`}</option>
                    ))}
                </select>
                <select className="input-field" value={round} onChange={e=>setRound(e.target.value)}>
                    {[...Array(38).keys()].map(i=><option key={i+1} value={i+1}>Rodada {i+1}</option>)}
                </select>
            </div>

            {games.length === 0 && <div className="card" style={{padding:15, textAlign:'center', color:'#666'}}>Nenhum jogo nesta rodada.</div>}

            {games.map(m => (
                <div key={m.id} className="card" style={{borderLeft: m.status==='FINISHED' ? '4px solid #444' : '4px solid var(--primary)', position:'relative'}}>
                    
                    {isAdmin && (
                        <div style={{position:'absolute', top:5, right:5, display:'flex', gap:5}}>
                            <button className="btn btn-ghost" style={{padding:'2px 5px', fontSize:10, border:'1px solid #666'}} onClick={()=>onEditMatch(m)}>✏️</button>
                            <button className="btn btn-red" style={{padding:'2px 5px', fontSize:10}} onClick={()=>onDeleteMatch(m.id)}>🗑️</button>
                        </div>
                    )}

                    <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:5, marginTop: isAdmin ? 15 : 0}}>
                        <div style={{textAlign:'center', width:'40%', display: 'flex', flexDirection: 'column', alignItems: 'center'}}>
                            <MatchTeamLogo logo={m.homeLogo} />
                            <b style={{fontSize:13}}>{m.homeName}</b>
                            <div style={{fontSize:18, fontWeight:'bold'}}>
                                {m.status==='FINISHED' ? <>{m.scoreHome} {m.hasPenalties && <span style={{fontSize:12, color:'gold', marginLeft:4}}>({m.penaltiesHome})</span>}</> : '-'}
                            </div>
                        </div>
                        <div style={{fontSize:12, color:'#aaa'}}>X</div>
                        <div style={{textAlign:'center', width:'40%', display: 'flex', flexDirection: 'column', alignItems: 'center'}}>
                            <MatchTeamLogo logo={m.awayLogo} />
                            <b style={{fontSize:13}}>{m.awayName}</b>
                            <div style={{fontSize:18, fontWeight:'bold'}}>
                                {m.status==='FINISHED' ? <>{m.hasPenalties && <span style={{fontSize:12, color:'gold', marginRight:4}}>({m.penaltiesAway})</span>} {m.scoreAway}</> : '-'}
                            </div>
                        </div>
                    </div>
                    
                    {m.status !== 'FINISHED' && (
                        <button className="btn btn-green" onClick={() => onReportMatch(m)}>
                            📝 LANÇAR SÚMULA
                        </button>
                    )}
                </div>
            ))}
        </div>
    );
};
//FIM


// ==========================================
// FASE 3: HUB PÚBLICO DAS COPAS E TORNEIOS
// ==========================================
const TournamentHub = ({ tournaments, matches, players, user, teams, onInspectTeam, onReportMatch, onCreateMatch, onEditMatch, onDeleteMatch }) => {
    const [selTourn, setSelTourn] = useState(null);
    const [tab, setTab] = useState('JOGOS');

    const isAdminOrPress = user.type === 'ADMIN' || user.type.includes('PRESS');

    if (!selTourn) {
        return (
            <div>
                <h3 style={{color:'cyan', textAlign:'center', marginTop:0}}>🏆 Copas e Campeonatos</h3>
                <p style={{textAlign:'center', color:'#aaa', fontSize:12, marginBottom:20}}>Acompanhe o chaveamento e as estatísticas exclusivas de cada torneio.</p>
                {tournaments.length === 0 && <p style={{textAlign:'center', color:'#666'}}>Nenhuma competição ativa no momento.</p>}
                
                <div style={{display:'grid', gap:15}}>
                    {tournaments.map(t => (
                        <div key={t.id} className="highlight-card" style={{cursor:'pointer', border:'1px solid cyan', padding:20, background:'linear-gradient(135deg, #001a33 0%, #000 100%)'}} onClick={() => setSelTourn(t)}>
                            {t.trophyImg ? <img src={t.trophyImg} style={{width:80, height:80, objectFit:'contain', marginBottom:10, filter:'drop-shadow(0 0 10px rgba(0,255,255,0.3))'}} /> : <div style={{fontSize:50}}>🏆</div>}
                            <h3 style={{margin:0, color:'cyan'}}>{t.name}</h3>
                            <small style={{color:'#aaa'}}>{t.format.replace('_', ' ')} • Prêmio: <b style={{color:'lime'}}>{fmt(t.prize)}</b></small>
                        </div>
                    ))}
                </div>
            </div>
        );
    }

    // --- SORTEIO INICIAL DE JOGOS (Fase 1) ---
    const handleGenerateFixtures = async () => {
        if(!confirm(`Deseja sortear a Primeira Fase da ${selTourn.name}?`)) return;
        
        const db = firebase.firestore();
        const b = db.batch();

        const existing = matches.filter(m => m.serie === selTourn.id);
        if (existing.length > 0) {
            if(!confirm("Já existem jogos! Sortear novamente APAGARÁ todo o histórico desta Copa. Continuar?")) return;
            existing.forEach(m => b.delete(db.collection('matches').doc(m.id)));
        }

        const shuffled = [...selTourn.teams].sort(() => 0.5 - Math.random());
        let roundName = shuffled.length <= 2 ? 'Final' : (shuffled.length <= 4 ? 'Semifinal' : (shuffled.length <= 8 ? 'Quartas de Final' : 'Fase Inicial'));
        
        for(let i=0; i<shuffled.length; i+=2) {
            const homeId = shuffled[i];
            const awayId = shuffled[i+1];
            if(!homeId || !awayId) continue; 
            
            const homeT = teams.find(t=>t.id===homeId);
            const awayT = teams.find(t=>t.id===awayId);
            
            const matchRef = db.collection('matches').doc();
            b.set(matchRef, {
                serie: selTourn.id, round: roundName, status: 'PENDING', played: false, processed: false,
                homeId: homeId, homeName: homeT?.name, homeLogo: homeT?.logo || null,
                awayId: awayId, awayName: awayT?.name, awayLogo: awayT?.logo || null,
                scoreHome: 0, scoreAway: 0
            });
            
            const isFinal = shuffled.length <= 2;
            const isUnico = (isFinal && selTourn.finalType === 'UNICO') || (!isFinal && selTourn.matchType === 'IDA');

            if (!isUnico) {
                const matchRef2 = db.collection('matches').doc();
                b.set(matchRef2, {
                    serie: selTourn.id, round: roundName + ' (Volta)', status: 'PENDING', played: false, processed: false,
                    homeId: awayId, homeName: awayT?.name, homeLogo: awayT?.logo || null,
                    awayId: homeId, awayName: homeT?.name, awayLogo: homeT?.logo || null,
                    scoreHome: 0, scoreAway: 0
                });
            }
        }
        await b.commit();
        alert("Sorteio realizado com sucesso!");
    };

    // --- AVANÇAR FASE E PAGAR PREMIAÇÃO (MANTENDO O HISTÓRICO) ---
    const handleAdvanceRound = async () => {
        // Pega só os jogos ativos que ainda não foram processados para a próxima fase
        const activeGames = matches.filter(m => m.serie === selTourn.id && !m.processed);
        if(activeGames.length === 0) return alert("Nenhum jogo aguardando transição de fase.");
        
        const unfinished = activeGames.filter(m => m.status !== 'FINISHED');
        if(unfinished.length > 0) return alert(`⚠️ Faltam ${unfinished.length} jogo(s) para terminar esta fase! Finalize todos (lançando a súmula).`);

        let matchups = {};
        
        activeGames.forEach(m => {
            const pairId = [m.homeId, m.awayId].sort().join('_');
            if(!matchups[pairId]) {
                matchups[pairId] = { team1: m.homeId, team1Goals: 0, team1Pens: 0, team2: m.awayId, team2Goals: 0, team2Pens: 0 };
            }
            if(matchups[pairId].team1 === m.homeId) {
                matchups[pairId].team1Goals += (m.scoreHome || 0);
                matchups[pairId].team2Goals += (m.scoreAway || 0);
                if(m.hasPenalties) { matchups[pairId].team1Pens += (m.penaltiesHome || 0); matchups[pairId].team2Pens += (m.penaltiesAway || 0); }
            } else {
                matchups[pairId].team2Goals += (m.scoreHome || 0);
                matchups[pairId].team1Goals += (m.scoreAway || 0);
                if(m.hasPenalties) { matchups[pairId].team2Pens += (m.penaltiesHome || 0); matchups[pairId].team1Pens += (m.penaltiesAway || 0); }
            }
        });

        const winners = [];
        const losers = [];
        
        for (const key in matchups) {
            const match = matchups[key];
            if(match.team1Goals > match.team2Goals) { winners.push(match.team1); losers.push(match.team2); }
            else if(match.team2Goals > match.team1Goals) { winners.push(match.team2); losers.push(match.team1); }
            else {
                // Desempate por Pênaltis
                if(match.team1Pens > match.team2Pens) { winners.push(match.team1); losers.push(match.team2); }
                else if(match.team2Pens > match.team1Pens) { winners.push(match.team2); losers.push(match.team1); }
                else {
                    const t1 = teams.find(t => t.id === match.team1)?.name;
                    const t2 = teams.find(t => t.id === match.team2)?.name;
                    return alert(`🚨 EMPATE DETECTADO!\nO confronto ${t1} x ${t2} empatou no placar agregado.\nEdite a partida (✏️), marque 'Decidido nos Pênaltis' e preencha para continuar.`);
                }
            }
        }

        const db = firebase.firestore();
        const b = db.batch();

        // 1. Congela os jogos antigos (eles CONTINUAM na tela, mas não afetam o próximo sorteio)
        activeGames.forEach(m => {
            b.update(db.collection('matches').doc(m.id), { processed: true });
        });

        // 2. SISTEMA DE PREMIAÇÃO DOS ELIMINADOS
        const basePrize = parseFloat(selTourn.prize) || 0;
        const isFinal = winners.length === 1; 
        const isSemi = winners.length === 2; 
        const isQuarters = winners.length === 4; 
        
        let loserPercentage = 0.05; // Base 5%
        if (isFinal) loserPercentage = 0.40; // Vice = 40%
        else if (isSemi) loserPercentage = 0.20; // Perdedor da Semi = 20%
        else if (isQuarters) loserPercentage = 0.10; // Perdedor das Quartas = 10%

        const loserPrize = basePrize * loserPercentage;

        losers.forEach(loserId => {
            if(loserId) {
                b.update(db.collection('teams').doc(loserId), {
                    balance: firebase.firestore.FieldValue.increment(loserPrize)
                });
            }
        });

        // 3. PAGAMENTO DO CAMPEÃO (SE FOR A FINAL)
        if (isFinal && winners[0]) {
            b.update(db.collection('teams').doc(winners[0]), {
                balance: firebase.firestore.FieldValue.increment(basePrize)
            });
            await b.commit();
            
            const champTeam = teams.find(t => t.id === winners[0]);
            db.collection('news').add({
                text: `🏆 **CAMPEÃO!**\nO **${champTeam?.name}** conquistou a ${selTourn.name} e faturou ${fmt(basePrize)}!\nO Vice-campeão levou ${fmt(loserPrize)} de consolação.`,
                type: 'finance', date: Date.now(), likes: []
            });
            return alert(`🏆 FIM DE COPA!\n${champTeam?.name} é o CAMPEÃO!\n\nPrêmio depositado: ${fmt(basePrize)} (Campeão) e ${fmt(loserPrize)} (Vice).`);
        }

        if(!confirm(`Confirmar encerramento desta fase?\n\n💰 ${losers.length} clubes eliminados receberão ${fmt(loserPrize)} agora.\n⚽ ${winners.length} clubes avançarão para a próxima fase.`)) return;

        // 4. GERA A NOVA FASE
        const shuffled = [...winners].sort(() => 0.5 - Math.random());
        let roundName = shuffled.length <= 2 ? 'Final' : (shuffled.length <= 4 ? 'Semifinal' : (shuffled.length <= 8 ? 'Quartas de Final' : 'Nova Fase'));
        
        for(let i=0; i<shuffled.length; i+=2) {
            const homeId = shuffled[i];
            const awayId = shuffled[i+1];
            if(!homeId || !awayId) continue; 
            
            const homeT = teams.find(t=>t.id===homeId);
            const awayT = teams.find(t=>t.id===awayId);
            
            const matchRef = db.collection('matches').doc();
            b.set(matchRef, {
                serie: selTourn.id, round: roundName, status: 'PENDING', played: false, processed: false,
                homeId: homeId, homeName: homeT?.name, homeLogo: homeT?.logo || null,
                awayId: awayId, awayName: awayT?.name, awayLogo: awayT?.logo || null,
                scoreHome: 0, scoreAway: 0
            });
            
            const isUnico = (shuffled.length <= 2 && selTourn.finalType === 'UNICO') || (shuffled.length > 2 && selTourn.matchType === 'IDA');

            if (!isUnico) {
                const matchRef2 = db.collection('matches').doc();
                b.set(matchRef2, {
                    serie: selTourn.id, round: roundName + ' (Volta)', status: 'PENDING', played: false, processed: false,
                    homeId: awayId, homeName: awayT?.name, homeLogo: awayT?.logo || null,
                    awayId: homeId, awayName: homeT?.name, awayLogo: homeT?.logo || null,
                    scoreHome: 0, scoreAway: 0
                });
            }
        }

        await b.commit();
        alert(`✅ Fase concluída!\nPremiações pagas aos eliminados: ${fmt(loserPrize)}.\nPróxima fase (${roundName}) gerada com sucesso!`);
    };

    const tPlayers = players.filter(p => p.tournaments && p.tournaments[selTourn.id]);
    const topScorer = [...tPlayers].sort((a,b) => (b.tournaments[selTourn.id].goals || 0) - (a.tournaments[selTourn.id].goals || 0))[0];
    const topAssist = [...tPlayers].sort((a,b) => (b.tournaments[selTourn.id].assists || 0) - (a.tournaments[selTourn.id].assists || 0))[0];
    const topTackles = [...tPlayers].sort((a,b) => (b.tournaments[selTourn.id].tackles || 0) - (a.tournaments[selTourn.id].tackles || 0))[0];
    const topSaves = [...tPlayers].sort((a,b) => (b.tournaments[selTourn.id].saves || 0) - (a.tournaments[selTourn.id].saves || 0))[0];
    const topYellows = [...tPlayers].sort((a,b) => (b.tournaments[selTourn.id].yellows || 0) - (a.tournaments[selTourn.id].yellows || 0))[0];
    const topReds = [...tPlayers].sort((a,b) => (b.tournaments[selTourn.id].reds || 0) - (a.tournaments[selTourn.id].reds || 0))[0];
    const bestPlayer = [...tPlayers].filter(p => p.tournaments[selTourn.id].ratingCount > 0).sort((a,b) => {
        const avgA = a.tournaments[selTourn.id].ratingSum / a.tournaments[selTourn.id].ratingCount;
        const avgB = b.tournaments[selTourn.id].ratingSum / b.tournaments[selTourn.id].ratingCount;
        return avgB - avgA;
    })[0];

    // Filtro organizador das COPAS (Ativos no topo, Processados embaixo)
    const tMatches = matches
        .filter(m => m.serie === selTourn.id)
        .sort((a, b) => {
            if (a.processed && !b.processed) return 1;
            if (!a.processed && b.processed) return -1;
            if (a.status === 'FINISHED' && b.status !== 'FINISHED') return 1;
            if (a.status !== 'FINISHED' && b.status === 'FINISHED') return -1;
            const isVoltaA = (a.round || '').includes('(Volta)');
            const isVoltaB = (b.round || '').includes('(Volta)');
            if (isVoltaA && !isVoltaB) return 1;
            if (!isVoltaA && isVoltaB) return -1;
            return (a.homeName || '').localeCompare(b.homeName || '');
        });

    return (
        <div className="animate-in">
            <button className="btn btn-ghost" style={{marginBottom:15, width:'auto'}} onClick={() => {setSelTourn(null); setTab('JOGOS');}}>⬅ VOLTAR</button>
            
            <div style={{textAlign:'center', marginBottom:20}}>
                {selTourn.trophyImg ? <img src={selTourn.trophyImg} style={{width:100, height:100, objectFit:'contain', filter:'drop-shadow(0 0 15px rgba(0,255,255,0.6))'}} /> : <div style={{fontSize:60}}>🏆</div>}
                <h2 style={{margin:'10px 0 5px 0', color:'cyan'}}>{selTourn.name}</h2>
                <div style={{fontSize:12, color:'gold'}}>Premiação do Campeão: <b style={{color:'lime'}}>{fmt(selTourn.prize)}</b></div>
                {selTourn.neutralFinal && selTourn.finalType === 'UNICO' && <div style={{fontSize:10, color:'#aaa', marginTop:5}}>🏟️ Final em Jogo Único (Campo Neutro)</div>}
            </div>

            <div style={{display:'flex', gap:5, marginBottom:15, overflowX:'auto', paddingBottom:5}}>
                <button className={`btn ${tab==='JOGOS'?'btn-cyan':'btn-ghost'}`} style={{borderColor:'cyan', color:tab==='JOGOS'?'#000':'cyan', background:tab==='JOGOS'?'cyan':'transparent'}} onClick={()=>setTab('JOGOS')}>JOGOS</button>
                <button className={`btn ${tab==='STATS'?'btn-gold':'btn-ghost'}`} onClick={()=>setTab('STATS')}>ESTATÍSTICAS</button>
                <button className={`btn ${tab==='TIMES'?'btn-purple':'btn-ghost'}`} onClick={()=>setTab('TIMES')}>TIMES ({selTourn.teams.length})</button>
            </div>

            {tab === 'JOGOS' && (
                <div>
                    {isAdminOrPress && (
                        <div style={{display:'flex', gap:10, marginBottom:15}}>
                            <button className="btn btn-blue" onClick={() => onCreateMatch(selTourn.id)}>+ JOGO MANUAL</button>
                            <button className="btn btn-gold" onClick={handleGenerateFixtures}>🎲 SORTEIO INICIAL</button>
                            <button className="btn btn-purple" onClick={handleAdvanceRound}>⏭️ AVANÇAR FASE / PREMIAR</button>
                        </div>
                    )}

                    {tMatches.length === 0 ? <p style={{textAlign:'center', color:'#666'}}>Nenhum jogo chaveado ainda.</p> : (
                        <div style={{display:'grid', gap:10}}>
                            {tMatches.map(m => (
                                <div key={m.id} className="card" style={{borderLeft: m.status==='FINISHED' ? '4px solid #444' : '4px solid cyan', opacity: m.processed ? 0.5 : 1, position:'relative'}}>
                                    
                                    {user.type === 'ADMIN' && (
                                        <div style={{position:'absolute', top:5, right:5, display:'flex', gap:5}}>
                                            <button className="btn btn-ghost" style={{padding:'2px 5px', fontSize:10}} onClick={()=>onEditMatch(m)}>✏️</button>
                                            <button className="btn btn-red" style={{padding:'2px 5px', fontSize:10}} onClick={()=>onDeleteMatch(m.id)}>🗑️</button>
                                        </div>
                                    )}

                                    <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginTop: user.type === 'ADMIN' ? 15 : 0}}>
                                        <div style={{textAlign:'center', width:'40%', cursor:'pointer', display: 'flex', flexDirection: 'column', alignItems: 'center'}} onClick={() => { const t = teams.find(x => x.id === m.homeId); if(t) onInspectTeam(t); }}>
                                            <MatchTeamLogo logo={m.homeLogo} />
                                            <b style={{fontSize:13, color:'var(--primary)'}}>{m.homeName}</b>
                                            <div style={{fontSize:18, fontWeight:'bold'}}>
                                                {m.status==='FINISHED' ? <>{m.scoreHome} {m.hasPenalties && <span style={{fontSize:12, color:'gold', marginLeft:4}}>({m.penaltiesHome})</span>}</> : '-'}
                                            </div>
                                        </div>
                                        <div style={{fontSize:10, color:'#aaa', textAlign:'center'}}>
                                            X<br/>
                                            <small style={{color:'gold'}}>{m.round ? `Fase: ${m.round}` : 'Mata-Mata'}</small>
                                        </div>
                                        <div style={{textAlign:'center', width:'40%', cursor:'pointer', display: 'flex', flexDirection: 'column', alignItems: 'center'}} onClick={() => { const t = teams.find(x => x.id === m.awayId); if(t) onInspectTeam(t); }}>
                                            <MatchTeamLogo logo={m.awayLogo} />
                                            <b style={{fontSize:13, color:'var(--primary)'}}>{m.awayName}</b>
                                            <div style={{fontSize:18, fontWeight:'bold'}}>
                                                {m.status==='FINISHED' ? <>{m.hasPenalties && <span style={{fontSize:12, color:'gold', marginRight:4}}>({m.penaltiesAway})</span>} {m.scoreAway}</> : '-'}
                                            </div>
                                        </div>
                                    </div>

                                    {isAdminOrPress && m.status !== 'FINISHED' && (
                                        <button className="btn btn-green" style={{marginTop:10}} onClick={() => onReportMatch(m)}>📝 LANÇAR SÚMULA DA COPA</button>
                                    )}
                                </div>
                            ))}
                        </div>
                    )}
                </div>
            )}

            {tab === 'STATS' && (
                <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:10}}>
                    <div className="card" style={{borderTop:'3px solid gold', textAlign:'center'}}>
                        <div style={{fontSize:10, color:'#aaa', marginBottom:5}}>⚽ ARTILHEIRO</div>
                        {topScorer && topScorer.tournaments[selTourn.id].goals > 0 ? <div><b style={{fontSize:14, color:'#fff'}}>{topScorer.name}</b><br/><span style={{color:'gold', fontWeight:'bold'}}>{topScorer.tournaments[selTourn.id].goals} Gols</span></div> : <small style={{color:'#666'}}>Nenhum gol.</small>}
                    </div>
                    <div className="card" style={{borderTop:'3px solid var(--secondary)', textAlign:'center'}}>
                        <div style={{fontSize:10, color:'#aaa', marginBottom:5}}>👟 GARÇOM</div>
                        {topAssist && topAssist.tournaments[selTourn.id].assists > 0 ? <div><b style={{fontSize:14, color:'#fff'}}>{topAssist.name}</b><br/><span style={{color:'var(--secondary)', fontWeight:'bold'}}>{topAssist.tournaments[selTourn.id].assists} Assis.</span></div> : <small style={{color:'#666'}}>Nenhuma.</small>}
                    </div>
                    <div className="card" style={{borderTop:'3px solid #ff5555', textAlign:'center'}}>
                        <div style={{fontSize:10, color:'#aaa', marginBottom:5}}>🛡️ XERIFE (DESARMES)</div>
                        {topTackles && topTackles.tournaments[selTourn.id].tackles > 0 ? <div><b style={{fontSize:14, color:'#fff'}}>{topTackles.name}</b><br/><span style={{color:'#ff5555', fontWeight:'bold'}}>{topTackles.tournaments[selTourn.id].tackles} Desarmes</span></div> : <small style={{color:'#666'}}>Nenhum.</small>}
                    </div>
                    <div className="card" style={{borderTop:'3px solid cyan', textAlign:'center'}}>
                        <div style={{fontSize:10, color:'#aaa', marginBottom:5}}>🧤 MURALHA (DEFESAS)</div>
                        {topSaves && topSaves.tournaments[selTourn.id].saves > 0 ? <div><b style={{fontSize:14, color:'#fff'}}>{topSaves.name}</b><br/><span style={{color:'cyan', fontWeight:'bold'}}>{topSaves.tournaments[selTourn.id].saves} Defesas</span></div> : <small style={{color:'#666'}}>Nenhuma.</small>}
                    </div>
                    <div className="card" style={{borderTop:'3px solid yellow', textAlign:'center'}}>
                        <div style={{fontSize:10, color:'#aaa', marginBottom:5}}>🟨 AMARELOS</div>
                        {topYellows && topYellows.tournaments[selTourn.id].yellows > 0 ? <div><b style={{fontSize:14, color:'#fff'}}>{topYellows.name}</b><br/><span style={{color:'yellow', fontWeight:'bold'}}>{topYellows.tournaments[selTourn.id].yellows} Cartões</span></div> : <small style={{color:'#666'}}>Nenhum.</small>}
                    </div>

        const MatchManagerForm = ({ initialData, teams, tournaments, onSave, onDelete }) => {
    const [f, setF] = useState(initialData ? {
        ...initialData,
        hasPenalties: initialData.hasPenalties || false,
        penaltiesHome: initialData.penaltiesHome || 0,
        penaltiesAway: initialData.penaltiesAway || 0
    } : {
        homeId: '', awayId: '', serie: 'A', round: 1, 
        scoreHome: 0, scoreAway: 0, status: 'PENDING',
        hasPenalties: false, penaltiesHome: 0, penaltiesAway: 0
    });

    const handleSubmit = () => {
        if (!f.homeId || !f.awayId) return alert("Selecione os dois times!");
        if (f.homeId === f.awayId) return alert("O time não pode jogar contra si mesmo!");
        
        const homeTeam = teams.find(t => t.id === f.homeId);
        const awayTeam = teams.find(t => t.id === f.awayId);

        const payload = {
            ...f,
            homeName: homeTeam.name,
            homeLogo: homeTeam.logo || null,
            awayName: awayTeam.name,
            awayLogo: awayTeam.logo || null,
            round: isNaN(parseInt(f.round)) ? f.round : parseInt(f.round),
            scoreHome: parseInt(f.scoreHome) || 0,
            scoreAway: parseInt(f.scoreAway) || 0,
            hasPenalties: f.hasPenalties || false,
            penaltiesHome: f.hasPenalties ? (parseInt(f.penaltiesHome) || 0) : 0,
            penaltiesAway: f.hasPenalties ? (parseInt(f.penaltiesAway) || 0) : 0
        };

        onSave(payload);
    };

    const isCustomTourn = tournaments && tournaments.some(t => t.id === f.serie);
    const availableTeams = isCustomTourn 
        ? teams.filter(t => tournaments.find(x => x.id === f.serie)?.teams.includes(t.id))
        : teams.filter(t => t.serie === f.serie && t.status !== 'PENDING');

    return (
        <div className="modal-bg">
            <div className="modal-content">
                <h3>{f.id ? 'Editar Partida' : 'Criar Partida Manual'}</h3>
                
                <div style={{display:'flex', gap:10}}>

                        <label>Série / Liga / Copa</label>

                            {tournaments && tournaments.length > 0 && (
                                <optgroup label="Copas e Campeonatos">

                    </div>
                    <div style={{flex:1}}>
                        <label>Rodada/Fase</label>
                        <input className="input-field" type="text" placeholder="Ex: 1, Quartas, Final" value={f.round} onChange={e=>setF({...f, round:e.target.value})} />
                    </div>
                </div>

                <label>Mandante (Casa)</label>
                <select className="input-field" value={f.homeId} onChange={e=>setF({...f, homeId:e.target.value})}>
                    <option value="">-- Selecione --</option>
                    {availableTeams.map(t => <option key={t.id} value={t.id}>{t.name}</option>)}

        ]
    };

   

    const LOAN_LIMITS = { 'VARZEA': 500000, 'D': 2000000, 'C': 5000000, 'B': 10000000, 'A': 20000000 };

    const openLoanUI = () => {
        if (user.type !== 'USER') return alert("Apenas clubes podem solicitar empréstimos comerciais.");
        const team = user.data;
        if (team.bankLoan && team.bankLoan.installments > 0) return alert("Você já possui um empréstimo ativo. Quite-o antes de pedir outro.");
        
        const limit = LOAN_LIMITS[team.serie || 'VARZEA'] || 500000;
        setLoanAmount(Math.min(100000, limit));
        setLoanInst(5);
        setShowLoanUI(true);
    };

    const handleConfirmLoan = async () => {
        const team = user.data;
        const limit = LOAN_LIMITS[team.serie || 'VARZEA'] || 500000;
        
        if (loanAmount <= 0 || loanAmount > limit) return alert("Valor inválido.");
        
        const interestRate = 0.10 + ((loanInst - 1) * 0.05); 
        const totalToPay = loanAmount * (1 + interestRate);
        const weekly = totalToPay / loanInst;
        
        if (confirm(`Assinar contrato com o banco?\nValor pego: ${fmt(loanAmount)}\nVocê pagará ${loanInst}x de ${fmt(weekly)}.\n(Total com juros: ${fmt(totalToPay)})`)) {
            await db.collection('teams').doc(team.id).update({
                balance: firebase.firestore.FieldValue.increment(loanAmount),
                bankLoan: { amountBorrowed: loanAmount, totalOwed: totalToPay, weeklyPayment: weekly, installments: loanInst }
            });
            alert("✅ Dinheiro na conta! As parcelas serão debitadas automaticamente.");
            setShowLoanUI(false); 
        }
    };

    const openInvestUI = () => {
        if (user.type !== 'USER') return alert("Apenas clubes podem investir.");
        const team = user.data;
        const currentInvested = team.bankInvestment?.amount || 0;
        const maxInvestment = 50000000; 
        
        if (currentInvested >= maxInvestment) return alert(`Você já atingiu o teto máximo de investimento (${fmt(maxInvestment)}).`);
        if ((team.balance || 0) <= 0) return alert("Você não tem saldo em caixa para investir.");

        const availableToInvest = Math.min(team.balance, maxInvestment - currentInvested);
        setInvestAmount(Math.min(100000, availableToInvest)); 
        setShowInvestUI(true);
    };

    const handleConfirmInvest = async () => {
        const team = user.data;
        const currentInvested = team.bankInvestment?.amount || 0;
        const maxInvestment = 50000000; 

        if (investAmount <= 0) return alert("Valor inválido.");
        if (investAmount > team.balance) return alert("Você não tem esse saldo disponível no caixa do clube.");
        if (currentInvested + investAmount > maxInvestment) return alert(`O valor ultrapassa o teto permitido.`);
        
        if (confirm(`Confirmar aplicação de ${fmt(investAmount)}?\nO dinheiro sairá do seu caixa e ficará bloqueado rendendo 2% ao mês.\n(Carência de 3 semanas para saque sem multa).`)) {
            await db.collection('teams').doc(team.id).update({
                balance: firebase.firestore.FieldValue.increment(-investAmount),
                bankInvestment: { amount: currentInvested + investAmount, weeksLocked: 3 }
            });
            alert("✅ Investimento realizado! Ele renderá juros a cada virada de semana.");
            setShowInvestUI(false);
        }
    };

    const handleWithdraw = async () => {
        const team = user.data;
        const inv = team.bankInvestment;
        if (!inv || inv.amount <= 0) return alert("Você não possui dinheiro investido.");
        
        let amountToReceive = inv.amount;
        let msg = `Resgatar ${fmt(inv.amount)}?`;
        
        if ((inv.weeksLocked || 0) > 0) {
            const penalty = inv.amount * 0.05;
            amountToReceive = inv.amount - penalty;
            msg = `⚠️ RESGATE ANTECIPADO!\n\nSeu dinheiro ainda está bloqueado por ${inv.weeksLocked} semana(s).\nSe sacar agora, o banco cobrará uma multa de 5% por quebra de contrato (${fmt(penalty)}).\n\nValor a receber: ${fmt(amountToReceive)}\n\nConfirmar saque emergencial?`;
        } else {
            msg = `✅ RESGATE TOTAL\n\nSeu dinheiro já cumpriu a carência e pode ser sacado sem multas.\n\nValor a receber: ${fmt(amountToReceive)}\n\nConfirmar saque?`;
        }
        
        if (confirm(msg)) {
            await db.collection('teams').doc(team.id).update({
                balance: firebase.firestore.FieldValue.increment(amountToReceive),
                bankInvestment: firebase.firestore.FieldValue.delete()
            });
            alert("Dinheiro transferido para o caixa do clube com sucesso!");
        }
    };

    // --- NOVA FUNÇÃO: ENVIAR PIX (P2P) ---
    const handleSendPix = async () => {
        const amount = parseFloat(pixAmount);
        if (isNaN(amount) || amount <= 0) return alert("Valor inválido.");
        if (amount > 20000) return alert("O limite máximo por PIX é de ₣ 20.000 (Lei Antilavagem).");
        if (!pixRecipient) return alert("Selecione um destinatário.");

        // TRAVAS ANTI-TRAPAÇA
        if (user.type === 'PLAYER') {
            if ((user.data.overall || 0) <= 50) return alert("🚫 BLOQUEADO: Apenas jogadores com Overall acima de 50 (Nível Pró) podem enviar PIX.");
            if (user.data.teamId === 'FREE' || !user.data.teamId) return alert("🚫 BLOQUEADO: Agentes Livres (Contas Fantasmas) não podem fazer transferências bancárias.");
        } else if (user.type === 'COACH') {
            if ((user.data.level || 1) < 2) return alert("🚫 BLOQUEADO: Apenas Técnicos Nível 2+ podem enviar PIX.");
        }

        const totalCost = amount * 1.10; // Taxa de 10%
        if ((user.data.balance || 0) < totalCost) return alert(`Saldo insuficiente!\nCom a taxa bancária de 10%, você precisa ter na conta: ${fmt(totalCost)}`);

        const splitIndex = pixRecipient.indexOf('_');
        const recType = pixRecipient.substring(0, splitIndex);
        const recId = pixRecipient.substring(splitIndex + 1);
        const collection = recType === 'PLAYER' ? 'players' : 'users';

        if (!confirm(`Confirma o PIX de ${fmt(amount)}?\n\n💸 Valor da Transferência: ${fmt(amount)}\n🏦 Taxa do Banco (10%): ${fmt(amount * 0.10)}\n=====================\nTotal Debitado: ${fmt(totalCost)}`)) return;

        try {
            const b = db.batch();

            // 1. Tira do remetente
            const myCol = user.type === 'PLAYER' ? 'players' : 'users';
            b.update(db.collection(myCol).doc(user.data.id), {
                balance: firebase.firestore.FieldValue.increment(-totalCost)
            });

            // 2. Entrega ao destinatário
            b.update(db.collection(collection).doc(recId), {
                balance: firebase.firestore.FieldValue.increment(amount)
            });

            // 3. Salva no Log da Receita Federal (Admin)
            let recName = "Desconhecido";
            if(recType === 'PLAYER') recName = players.find(p => p.id === recId)?.name || recName;
            if(recType === 'COACH') recName = coaches.find(c => c.id === recId)?.name || recName;

            const logRef = db.collection('pixLogs').doc();
            b.set(logRef, {
                senderId: user.data.id,
                senderName: user.data.name,
                senderType: user.type,
                recipientId: recId,
                recipientName: recName,
                recipientType: recType,
                amount: amount,
                tax: amount * 0.10,
                date: Date.now()
            });

            await b.commit();
            alert(`✅ PIX ENVIADO COM SUCESSO!\n${fmt(amount)} foram transferidos para a conta de ${recName}.`);
            setPixAmount('');
            setPixRecipient('');
        } catch (e) {
            alert("Erro ao processar o PIX: " + e.message);
        }
    };

    const handleNightclub = async () => {
        if (user.type !== 'PLAYER' && user.type !== 'COACH') {
            return alert("Apenas Pessoas Físicas (Jogadores e Técnicos) podem curtir a noitada!");
        }

        if (user.type === 'PLAYER' && (user.data.recoveryLeft || 0) > 0) {
            const confirmBribe = confirm("⚠️ ATENÇÃO: Você está no Departamento Médico!\n\nSe a imprensa ou a diretoria te pegarem na balada de atestado, a punição será severa. Deseja forçar a entrada disfarçado?");
            if (!confirmBribe) return;

            if (Math.random() < 0.80) {
                const fine = 10000;
                const penaltyUpdates = {
                    balance: firebase.firestore.FieldValue.increment(-fine),
                    recoveryLeft: user.data.recoveryLeft + 1,
                    mood: '😡',
                    fame: Math.max(0, (user.data.fame || 0) - 1000)
                };
                
                const scandalMsg = `🚨 **ESCÂNDALO MÉDICO!**\nO atleta **${user.data.name}**, que deveria estar se recuperando de lesão, foi flagrado na porta da balada! A diretoria aplicou multa pesada e o tempo de recuperação piorou.`;

                try {
                    const b = db.batch();
                    b.update(db.collection('players').doc(user.data.id), penaltyUpdates);
                    b.set(db.collection('news').doc(), { text: scandalMsg, type: 'press', date: Date.now(), likes: [] });
                    await b.commit();
                    return alert(`📸 FLAGRADO!\n\nO paparazzo tirou foto sua mancando na porta da boate! Você virou piada e a diretoria não perdoou.\n\nEfeitos:\n💸 Multa de ${fmt(fine)}\n📉 Fama: -1000\n🏥 Lesão Agravada (+1 jogo fora)!`);
                } catch (e) {
                    return alert("Erro: " + e.message);
                }
            } else {
                alert("🥷 NINJA!\nVocê conseguiu entrar pela porta dos fundos de capuz e óculos escuros sem ninguém ver. O risco foi alto, mas a noite é sua!");
            }
        }

        const entryFee = 5000;
        if ((user.data.balance || 0) < entryFee) {
            return alert(`O segurança barrou você na porta!\nVocê precisa de ${fmt(entryFee)} para pagar a entrada VIP.`);
        }

        if (!confirm(`🎟️ ENTRADA VIP: ${fmt(entryFee)}\n\nSua noite pode ser lendária ou terminar em escândalo. A roleta de Mato Real está girando... Entrar?`)) return;

        const roll = Math.random(); 
        let msg = "";
        let updates = { balance: firebase.firestore.FieldValue.increment(-entryFee) };
        let newsMsg = null;

        const celebs = ["Neymar", "Casimiro", "Craque Neto", "Tiago Leifert", "Galvão Bueno", "Ronaldo Fenômeno", "Adriano Imperador", "Ronaldinho Gaúcho", "Luva de Pedreiro"];
        const badEntities = ["Leo Dias", "a página Choquei", "um Paparazzi", "um Torcedor Rival", "a Torcida Organizada", "o Segurança da Boate"];
        const injuries = ["Olho Roxo", "Nariz Quebrado", "Torção no Tornozelo (Dançando)", "Corte no Supercílio", "Desgaste Extremo"];
        const badActions = ["vomitou no sapato de", "tentou dar um drible e caiu na frente de", "foi pego no flagra discutindo com", "deu calote na mesa de"];
        const goodActions = ["pagou um combo de bebida pra você", "fez uma dancinha viral no TikTok com você", "te chamou de 'Garotinho' ao vivo", "te apresentou um sheik árabe", "elogiou seu futebol na roda de amigos"];

        if (roll < 0.005) {
            updates.balance = firebase.firestore.FieldValue.increment(10000); 
            updates.energy = 100;
            if (user.type === 'PLAYER') {
                updates.fame = (user.data.fame || 0) + 1500;
                updates.mood = '🤩';
            }
            msg = `👑 EVENTO LENDÁRIO DESBLOQUEADO!\n\nVocê trombou com NATHAN, o criador absoluto de Mato Real! Vocês viraram uma garrafa de Mansão Maromba juntos no camarote. \n\nEfeitos:\n⚡ Energia 100%\n💸 Ele te deu ₣ 10.000 no PIX pela resenha!`;
            newsMsg = `🚨 **VISTOS JUNTOS!**\n**${user.data.name}** foi flagrado tomando Mansão Maromba com o grande Nathan na área VIP. Que moral gigantesca!`;
        }
        else if (roll < 0.05) {
            const isLucky = Math.random() > 0.5; 
            const bruxo = "Ronaldinho Gaúcho";
            
            if (isLucky) {
                updates.energy = 100;
                updates.balance = firebase.firestore.FieldValue.increment(20000); 
                if (user.type === 'PLAYER') updates.fame = (user.data.fame || 0) + 800;
                msg = `🪄 O ROLÊ DO BRUXO!\nVocê foi convidado pro camarote do ${bruxo}. Rolou pagode, dibres e você ainda ganhou ₣ 20.000 jogando truco com ele! Que noite!`;
                newsMsg = `🪄 **ALEATÓRIO!**\n**${user.data.name}** postou stories tocando pandeiro ao lado de ${bruxo}. A torcida foi à loucura!`;
            } else {
                updates.energy = 0;
                if (user.type === 'PLAYER') {
                    updates.recoveryLeft = 1;
                    updates.injury = "Exaustão Pós-Bruxo";
                    updates.mood = '😡';
                }
                msg = `🪄 O ROLÊ DO BRUXO DEU RUIM...\nVocê tentou acompanhar o ritmo de festa do ${bruxo}. Erro fatal. Você desmaiou às 9h da manhã, zerou a energia e vai ficar 1 jogo afastado.`;
            }
        }
        else if (roll < 0.15) {
            const celeb = celebs[Math.floor(Math.random() * celebs.length)];
            const action = goodActions[Math.floor(Math.random() * goodActions.length)];
            const randomMoney = Math.floor(Math.random() * 15000) + 5000;
            
            updates.energy = 100;
            updates.balance = firebase.firestore.FieldValue.increment(randomMoney);
            if (user.type === 'PLAYER') updates.fame = (user.data.fame || 0) + 500;
            
            msg = `🌟 RESENHA FORTE!\nVocê esbarrou com ${celeb} e ele ${action}!\n\nVocê saiu com a energia no máximo e ainda fez contatos que renderam ₣ ${randomMoney.toLocaleString('pt-BR')}!`;
        }
        else if (roll < 0.30) {
            updates.energy = 100;
            msg = `🍹 NOITE TRANQUILA!\nVocê curtiu a música, ficou na água com limão e deu boas risadas com os amigos. Sua mente está relaxada e sua Energia foi restaurada para 100%!`;
        }
        else if (roll < 0.65) {
            const lostMoney = Math.floor(Math.random() * 8000) + 2000;
            updates.energy = 0;
            updates.balance = firebase.firestore.FieldValue.increment(-lostMoney); 
            if (user.type === 'PLAYER') updates.mood = '😐';
            
            msg = `🤢 RESSACA BRABA...\nA noite foi intensa. Você misturou whisky com catuaba, perdeu sua carteira (prejuízo de ₣ ${lostMoney.toLocaleString('pt-BR')}) e acordou abraçado no vaso sanitário.\n\nEnergia ZERADA!`;
        }
        else {
            const villain = badEntities[Math.floor(Math.random() * badEntities.length)];
            const action = badActions[Math.floor(Math.random() * badActions.length)];
            const isFight = Math.random() > 0.5; 

            updates.energy = 0;
            if (user.type === 'PLAYER') updates.mood = '😡';

            if (isFight && user.type === 'PLAYER') {
                const injury = injuries[Math.floor(Math.random() * injuries.length)];
                updates.recoveryLeft = 1; 
                updates.injury = `${injury} (Briga Noturna)`;
                updates.fame = Math.max(0, (user.data.fame || 0) - 300);
                
                msg = `👊 TRETA NA SAÍDA!\nDeu ruim! Você se desentendeu com ${villain}. Rolou empurra-empurra e você levou a pior.\n\nResultado: Lesão (${injury}), perda de Fama e 1 JOGO DE SUSPENSÃO.`;
                newsMsg = `🚨 **CASO DE POLÍCIA!**\nO atleta **${user.data.name}** se envolveu numa briga física pesada com ${villain} nesta madrugada. O clube promete punições severas!`;
            } else {
                updates.fame = Math.max(0, (user.data.fame || 0) - 500); 
                msg = `📸 ESCÂNDALO NA INTERNET!\nVocê bebeu demais e ${action} ${villain}! Tudo foi filmado e postado nas redes sociais.\n\nSua moral despencou, sua energia zerou e a diretoria está furiosa!`;
                newsMsg = `📉 **CANCELADO!**\nVídeos vazados mostram **${user.data.name}** em estado lamentável na boate. A repercussão é péssima nos bastidores.`;
            }
        }

        try {
            const col = user.type === 'PLAYER' ? 'players' : 'users'; 
            await db.collection(col).doc(user.data.id).update(updates);
            if (newsMsg) {
                await db.collection('news').add({ text: newsMsg, type: 'press', date: Date.now(), likes: [] });
            }
            alert(msg);
        } catch (e) {
            alert("Erro no evento: " + e.message);
        }
    };

    return (
        <div style={{paddingBottom: 80}}>
            <div className="highlight-card" style={{background:'linear-gradient(135deg, #1a237e 0%, #0d47a1 100%)', marginBottom: 20}}>
                <h2 style={{margin:0}}>🏛️ Serviços Públicos</h2>
                <p style={{margin:0, fontSize:12, opacity:0.8}}>Gestão de Saúde e Bem-Estar de Mato Real</p>
            </div>

            <div style={{display:'flex', gap:10, marginBottom:15}}>
                <button className={`btn ${hTab==='HOSPITAL'?'btn-red':'btn-ghost'}`} onClick={()=>setHTab('HOSPITAL')} style={{flex:1, padding:10}}>🏥 HOSPITAL</button>
                <button className={`btn ${hTab==='BANCO'?'btn-blue':'btn-ghost'}`} onClick={()=>setHTab('BANCO')} style={{flex:1, padding:10}}>🏦 BANCO</button>
                <button className={`btn ${hTab==='BALADA'?'btn-purple':'btn-ghost'}`} onClick={()=>setHTab('BALADA')} style={{flex:1, padding:10}}>🍸 BALADA</button>
            </div>

            {hTab === 'HOSPITAL' && (
                <div>
                    <div style={{background:'#b71c1c', padding:10, borderRadius:8, color:'white', marginBottom:15, display:'flex', alignItems:'center', gap:10}}>
                        <span style={{fontSize:24}}>🚑</span>
                        <div>
                            <b style={{display:'block'}}>EMERGÊNCIA MUNICIPAL</b>
                            <small>{injured.length} jogador(es) sob cuidados médicos</small>
                        </div>
                    </div>

                    {injured.length === 0 ? (
                        <div className="card" style={{textAlign:'center', padding:40}}>
                            <div style={{fontSize:40, marginBottom:10}}>🥗</div>
                            <p>Departamento médico vazio! Todos os atletas estão prontos para o jogo.</p>
                        </div>
                    ) : (
                        injured.map(p => {
                            const injuryName = typeof p.injury === 'object' ? p.injury.label : p.injury;
                            const isLight = !INJURIES_DB.MODERADA.includes(injuryName) && !INJURIES_DB.GRAVE.includes(injuryName) && !INJURIES_DB.EXTREMA.includes(injuryName);

                            return (
                                <div key={p.id} className="card" style={{borderLeft:'5px solid #ff1744', position:'relative'}}>
                                    <div style={{display:'flex', justifyContent:'space-between', alignItems:'flex-start'}}>
                                        <div>
                                            <b style={{fontSize:16}}>❌ {p.name}</b>
                                            <div style={{fontSize:11, color:'#ff1744', fontWeight:'bold', marginTop:2}}>
                                                {injuryName || 'Lesão não especificada'}
                                            </div>
                                        </div>
                                        <div style={{textAlign:'right'}}>
                                            <span style={{background:'#ff1744', color:'white', padding:'2px 8px', borderRadius:10, fontSize:10, fontWeight:'bold'}}>
                                                {p.recoveryLeft} JOGOS
                                            </span>
                                        </div>
                                    </div>

                                    <div style={{marginTop:15, background:'rgba(0,0,0,0.2)', padding:10, borderRadius:8}}>
                                        <div style={{display:'flex', justifyContent:'space-between', fontSize:11, marginBottom:10}}>
                                            <span>Fundo para Cirurgia:</span>
                                            <b style={{color:'gold'}}>{fmt(p.hospitalFund || 0)}</b>
                                        </div>
                                        
                                        <div style={{fontSize:9, color:'#888', marginBottom:10}}>
                                            <b>Doadores Recentes:</b><br/>
                                            {p.donors && Object.keys(p.donors).length > 0 ? 
                                                Object.values(p.donors).map((d, i) => <span key={i}>• {d.name} ({fmt(d.val)}) </span>) 
                                                : "Nenhuma doação recebida."
                                            }
                                        </div>
                                        
                                        <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:10}}>
                                            <button 
                                                className={`btn ${isLight ? 'btn-ghost' : 'btn-green'}`} 
                                                style={{fontSize:10, padding:8, opacity: isLight ? 0.5 : 1, cursor: isLight ? 'not-allowed' : 'pointer'}} 
                                                disabled={isLight}
                                                onClick={() => {
                                                    if(isLight) return alert("Lesões leves e clínicas precisam apenas de repouso natural.");
                                                    const v = prompt(`Quanto desejas doar para ${p.name}?`);
                                                    if(v && !isNaN(v)) onDonate(p, parseFloat(v));
                                                }}
                                            >
                                                {isLight ? '🚫 APENAS REPOUSO' : '💸 DOAR'}
                                            </button>
                                            
                                            <button 
                                                className={`btn ${isLight ? 'btn-ghost' : 'btn-blue'}`} 
                                                style={{fontSize:10, padding:8, opacity: isLight ? 0.5 : 1}} 
                                                onClick={() => handleSurgery(p)}
                                            >
                                                {isLight ? '🚫 SEM CIRURGIA' : '🏥 OPERAR'}
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            );
                        })
                    )}
                </div>
            )}

            {hTab === 'BANCO' && (
                <div>
                    <div style={{background:'linear-gradient(90deg, #0d47a1, #1976d2)', padding:10, borderRadius:8, color:'white', marginBottom:15, display:'flex', alignItems:'center', gap:10, boxShadow: '0 4px 6px rgba(0,0,0,0.3)'}}>
                        <span style={{fontSize:24}}>🏦</span>
                        <div>
                            <b style={{display:'block'}}>BANCO DE MATO REAL</b>
                            <small>Crédito, Investimentos e PIX</small>
                        </div>
                    </div>

                   {!['USER', 'PLAYER', 'COACH'].includes(user.type) ? (
                        <div className="card" style={{textAlign:'center', padding:30, color:'#888'}}>
                            <i className="fas fa-lock" style={{fontSize:40, marginBottom:10}}></i>
                            <p>Esta área é exclusiva para Clubes, Jogadores e Técnicos.</p>
                        </div>
                    ) : (
                        <div className="animate-in">
                            
                            {/* --- MÓDULO PIX (APENAS PARA PESSOA FÍSICA: JOGADORES E TÉCNICOS) --- */}
                            {(user.type === 'PLAYER' || user.type === 'COACH') && (
                                <div className="card" style={{borderLeft: '4px solid #00bcd4', marginBottom: 15}}>
                                    <h4 style={{marginTop: 0, color: '#00bcd4'}}>💸 Enviar PIX (Transferência)</h4>
                                    
                                    {/* VERIFICAÇÃO VISUAL DAS TRAVAS ANTI-TRAPAÇA */}
                                    {(user.type === 'PLAYER' && (user.data.overall || 0) <= 50) ? (
                                        <div style={{background:'rgba(255,0,0,0.1)', padding:15, borderRadius:8, border:'1px solid red', color:'#ff5555', fontSize:12, textAlign:'center'}}>
                                            <i className="fas fa-ban" style={{fontSize: 24, marginBottom: 5}}></i><br/>
                                            <b>CONTA BANCÁRIA RESTRITA</b><br/>
                                            Apenas jogadores com <b>Overall acima de 50 (Nível Pró)</b> podem enviar transferências para evitar contas fakes. Treine para evoluir!
                                        </div>
                                    ) : (user.type === 'PLAYER' && (!user.data.teamId || user.data.teamId === 'FREE')) ? (
                                        <div style={{background:'rgba(255,0,0,0.1)', padding:15, borderRadius:8, border:'1px solid red', color:'#ff5555', fontSize:12, textAlign:'center'}}>
                                            <i className="fas fa-ban" style={{fontSize: 24, marginBottom: 5}}></i><br/>
                                            <b>CONTA BANCÁRIA INATIVA</b><br/>
                                            Agentes Livres não possuem o PIX liberado. <b>Assine com um clube</b> para ativar suas transações financeiras!
                                        </div>
                                    ) : (user.type === 'COACH' && (user.data.level || 1) < 2) ? (
                                        <div style={{background:'rgba(255,0,0,0.1)', padding:15, borderRadius:8, border:'1px solid red', color:'#ff5555', fontSize:12, textAlign:'center'}}>
                                            <i className="fas fa-ban" style={{fontSize: 24, marginBottom: 5}}></i><br/>
                                            <b>CONTA BANCÁRIA RESTRITA</b><br/>
                                            Apenas Técnicos <b>Nível 2 ou superior</b> podem realizar transferências.
                                        </div>
                                    ) : (
                                        /* SE PASSOU NAS REGRAS, MOSTRA O FORMULÁRIO DO PIX NORMAL COM A BUSCA */
                                        <>
                                            <p style={{fontSize: 11, color: '#aaa', marginBottom: 15}}>Transfira dinheiro diretamente para o bolso de outros atletas ou técnicos (Taxa bancária: 10%). Limite: ₣ 20.000.</p>
                                            
                                            <label>Quem vai receber o PIX?</label>
                                            
                                            {/* BARRA DE PESQUISA DO PIX */}
                                            <input 
                                                className="input-field" 
                                                type="text" 
                                                placeholder="🔍 Buscar pelo nome..." 
                                                value={pixSearch} 
                                                onChange={e => setPixSearch(e.target.value)} 
                                                style={{marginBottom: '5px', borderColor: '#00bcd4'}} 
                                            />

                                            <select className="input-field" value={pixRecipient} onChange={e=>setPixRecipient(e.target.value)}>
                                                <option value="">-- Selecione o contato --</option>
                                                <optgroup label="🏃 Jogadores">
                                                    {players
                                                        .filter(p => p.id !== user.data.id && p.name && p.name.toLowerCase().includes(pixSearch.toLowerCase()))
                                                        .map(p => (
                                                        <option key={p.id} value={`PLAYER_${p.id}`}>{p.name} (Jogador)</option>
                                                    ))}

const TrainingCenterManager = ({ team, players, staff, user, onClose, onTrain, onTrainSolo }) => {
    const lvl = team.ctLevel || 1;
    const db = CT_DB[lvl];
    const nextDb = CT_DB[lvl + 1];
    
    const isPresident = user.type === 'USER' && user.data.id === team.id;
    const isCoach = user.type === 'COACH' && user.data.teamId === team.id;
    const isPlayer = user.type === 'PLAYER' && user.data.teamId === team.id;

    const [tab, setTab] = useState('LOBBY');
    const [trainingType, setTrainingType] = useState('FISICO_BASE');
    const [selectedPlayers, setSelectedPlayers] = useState([]);
    const energy = user.data?.energy !== undefined ? user.data.energy : 100;

    // Identificando quem é quem no Staff
    const coach = (staff || []).find(c => c.type === 'COACH');
    const assistant = (staff || []).find(c => c.type === 'ASSISTANT');
    const doctor = (staff || []).find(c => c.type === 'DOCTOR');
    const scout = (staff || []).find(c => c.type === 'SCOUT');

    const handleUpgrade = async () => {
        if (!nextDb) return;
        if ((team.balance || 0) < db.upgCost) return alert("Saldo insuficiente!");
        if (confirm(`Evoluir para ${nextDb.name} por ${fmt(db.upgCost)}?`)) {
            await firebase.firestore().collection('teams').doc(team.id).update({ balance: firebase.firestore.FieldValue.increment(-db.upgCost), ctLevel: lvl + 1 });
            alert("CT evoluído com sucesso!");
            onClose();
        }
    };

    const handleTogglePlayer = (pid) => {
        if (selectedPlayers.includes(pid)) setSelectedPlayers(selectedPlayers.filter(id => id !== pid));
        else if (selectedPlayers.length < 5) setSelectedPlayers([...selectedPlayers, pid]);
        else alert("Máximo de 5 jogadores!");
    };

        <div className="card" style={{ borderLeft: `3px solid ${color}`, padding: '8px', display: 'flex', alignItems: 'center', gap: '10px' }}>

                {member && (
                    <div style={{ width: '100%', background: '#222', height: 4, borderRadius: 2, marginTop: 4 }}>

    );
