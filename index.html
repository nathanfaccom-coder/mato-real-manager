                                            reader.readAsDataURL(file);
                                            reader.onload = (ev) => {
                                                const img = new Image();
                                                img.src = ev.target.result;
                                                img.onload = () => {
                                                    const canvas = document.createElement('canvas');
                                                    const MAX_W = 300; 
                                                    let w = img.width, h = img.height;
                                                    if (w > MAX_W) { h *= MAX_W / w; w = MAX_W; }
                                                    canvas.width = w; canvas.height = h;
                                                    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                                                    setEditP({...editP, img: canvas.toDataURL('image/jpeg', 0.8)});
                                                };
                                            };
                                        }} />
                                    </div>
                                    <div style={{flex:1}}>
                                        <input className="input-field" placeholder="Nome (Ex: Copo Térmico)" value={editP.name} onChange={e=>setEditP({...editP, name:e.target.value})} disabled={editP.stock > 0} style={{marginBottom:5}} />
                                        <input className="input-field" type="number" placeholder="Preço de Venda (₣)" value={editP.price} onChange={e=>setEditP({...editP, price:e.target.value})} disabled={editP.stock > 0} style={{marginBottom:0}} />
                                        <small style={{color:'#aaa', fontSize:9}}>Custo de fabricação: 30% do valor.</small>
                                    </div>
                                </div>

                                <div style={{background:'rgba(0,0,0,0.3)', padding:10, borderRadius:8}}>
                                    <div style={{display:'flex', justifyContent:'space-between', fontSize:11}}>
                                        <span>Produzir: <b>{buyStock} un.</b></span>
                                        <span>Custo: <b style={{color:'var(--danger)'}}>{fmt(buyStock * (editP.price * 0.3))}</b></span>
                                    </div>
                                    <input type="range" min="10" max="500" step="10" value={buyStock} onChange={e=>setBuyStock(Number(e.target.value))} style={{width:'100%', accentColor:'var(--purple)', margin:'10px 0'}} />
                                    
                                    <div style={{display:'flex', gap:5}}>
                                        <button className="btn btn-green" onClick={async () => {
                                            if(!editP.name || !editP.price) return alert("Preencha nome e preço!");
                                            const cost = Math.floor(buyStock * (editP.price * 0.3));
                                            if ((team.balance || 0) < cost) return alert("O clube não tem saldo para fabricar este lote!");
                                            
                                            if(confirm(`Pagar ${fmt(cost)} para fabricar ${buyStock}x ${editP.name}?`)) {
                                                let currentProducts = team.storeProducts || [];
                                                const existingIdx = currentProducts.findIndex(p => p.id === editP.id);
                                                if (existingIdx >= 0) {
                                                    currentProducts[existingIdx].stock += buyStock;
                                                } else {
                                                    currentProducts.push({ ...editP, stock: buyStock, price: Number(editP.price) });
                                                }

                                                await firebase.firestore().collection('teams').doc(team.id).update({
                                                    balance: firebase.firestore.FieldValue.increment(-cost),
                                                    storeProducts: currentProducts
                                                });
                                                alert("Produção enviada para o estoque!");
                                                setEditP(null); setBuyStock(10);
                                            }
                                        }}>FABRICAR</button>
                                        <button className="btn btn-ghost" onClick={()=>{setEditP(null); setBuyStock(10);}}>CANCELAR</button>
                                    </div>
                                </div>
                            </div>
                        )}

                        <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:10}}>
                            {(team.storeProducts || []).map(p => (
                                <div key={p.id} className="card" style={{padding:10, textAlign:'center', position:'relative'}}>
                                    <i className="fas fa-trash" style={{position:'absolute', top:5, right:5, color:'#ff1744', cursor:'pointer', fontSize:12}} onClick={async()=>{
                                        if(confirm(`Excluir ${p.name}? O estoque atual será perdido sem reembolso.`)) {
                                            const newProds = team.storeProducts.filter(x => x.id !== p.id);
                                            await firebase.firestore().collection('teams').doc(team.id).update({ storeProducts: newProds });
                                        }
                                    }}></i>
                                    
                                    <div style={{width:50, height:50, margin:'0 auto', borderRadius:5, overflow:'hidden', background:'#222', marginBottom:5}}>
                                        {p.img ? <img src={p.img} style={{width:'100%', height:'100%', objectFit:'cover'}}/> : <span style={{fontSize:20, lineHeight:'50px'}}>📦</span>}
                                    </div>
                                    <b style={{fontSize:11, display:'block', whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis'}}>{p.name}</b>
                                    <div style={{color:'var(--primary)', fontWeight:'bold', fontSize:13}}>{fmt(p.price)}</div>
                                    
                                    <div style={{fontSize:9, color: p.stock > 0 ? 'lime' : 'red', margin:'5px 0'}}>Estoque: {p.stock} un.</div>
                                    
                                    <button className="btn btn-ghost" style={{fontSize:9, padding:5, margin:0, borderColor:'var(--purple)', color:'white'}} onClick={() => { setEditP(p); setBuyStock(10); }}>
                                        REPOR ESTOQUE
                                    </button>
                                </div>
                            ))}
                        </div>
                        {(team.storeProducts || []).length === 0 && !editP && <p style={{textAlign:'center', color:'#666', fontSize:11}}>Sua vitrine está vazia. Crie produtos para vender em dias de jogo!</p>}
                    </div>
                )}
                {/* --- NOVA ABA: PROGRAMA SÓCIO TORCEDOR --- */}
                {tab === 'SOCIO' && (
                    <div className="animate-in">
                        <div style={{background:'linear-gradient(45deg, #FFD700, #FF8F00)', padding:15, borderRadius:8, marginBottom:15, border:'1px solid #fff', display:'flex', justifyContent:'space-between', alignItems:'center'}}>
                            <div>
                                <small style={{color:'#000', fontWeight:'bold'}}>Sócios Ativos (Em tempo real)</small><br/>
                                <b style={{fontSize:24, color:'#000'}}>
                                    {/* A MÁGICA DO TEMPO REAL AQUI */}
                                    {calculateSocios(
                                        {...team, socioPrice: socioPrice}, // Simula a mudança antes de salvar
                                        players.filter(p => p.teamId === team.id)
                                    ).toLocaleString('pt-BR')} 👤
                                </b>
                            </div>
                        </div>

                        <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:10, marginBottom:15}}>
                            <div className="card" style={{padding:10, textAlign:'center'}}>
                                <span style={{fontSize:10, color:'#aaa'}}>Renda Semanal Projetada</span><br/>
                                <b style={{color:'lime', fontSize:14}}>
                                    {fmt(calculateSocios({...team, socioPrice: socioPrice}, players.filter(p => p.teamId === team.id)) * socioPrice)}
                                </b>
                            </div>
                            <div className="card" style={{padding:10, textAlign:'center'}}>
                                <span style={{fontSize:10, color:'#aaa'}}>Fase do Time (Últ. 5)</span><br/>
                                <b style={{color:'#fff', fontSize:14, letterSpacing:2}}>
                                    {(team.recentForm || []).length > 0 
                                        ? team.recentForm.map(r => r==='VITORIA'?'🟢':r==='EMPATE'?'⚪':'🔴').join('') 
                                        : '➖'}
                                </b>
                            </div>
                        </div>

                        <div className="card" style={{borderLeft:'4px solid gold'}}>
                            <h4 style={{marginTop:0, color:'gold'}}>💳 Mensalidade do Sócio</h4>
                            <p style={{fontSize:10, color:'#aaa', marginBottom:10}}>
                                Defina o valor da assinatura. Se cobrar muito caro, a massa torcedora cancelará o plano!
                            </p>
                            
                            <div style={{display:'flex', justifyContent:'space-between', marginBottom:5}}>
                                <label style={{color:'gold', fontSize:12, fontWeight:'bold'}}>Preço Cobrado</label>
                                <b style={{color:'#fff'}}>{fmt(socioPrice)}</b>
                            </div>
                            <input type="range" min="10" max="150" step="5" value={socioPrice} onChange={e=>setSocioPrice(Number(e.target.value))} style={{width:'100%', accentColor:'gold', marginBottom:15}} />
                            
                            <button className="btn btn-green" onClick={async () => {
                                await firebase.firestore().collection('teams').doc(team.id).update({ socioPrice: socioPrice });
                                alert("Valor da mensalidade atualizado! Os sócios atuais já reagiram à mudança.");
                            }} disabled={socioPrice === team.socioPrice}>SALVAR NOVA MENSALIDADE</button>
                        </div>
                    </div>
                )}
                <button className="btn btn-red" style={{marginTop:15}} onClick={onClose}>FECHAR</button>
            </div>
        </div>
    );
};

const SocialHub = ({ user, posts, onPost, onLike, onDeletePost, onSendChat, onSubChat, messages, onFollow }) => {
    const [tab, setTab] = useState('FEED'); // FEED, PERFIL, CHAT
    const [subChat, setSubChat] = useState('GLOBAL'); // GLOBAL, TEAM
    
    // Estados de input
    const [newText, setNewText] = useState('');
    const [newImg, setNewImg] = useState(null);
    const [chatInput, setChatInput] = useState('');
    const [loading, setLoading] = useState(false);
    const [zoomedImg, setZoomedImg] = useState(null); // Guarda a URL da imagem clicada
    // Efeito para ligar o Chat quando muda a aba
    useEffect(() => {
        if (tab === 'CHAT') {
            const chatId = subChat === 'GLOBAL' ? 'GLOBAL_CHAT' : `TEAM_${user.data.teamId || 'FREE'}`;
            if (subChat === 'TEAM' && (!user.data.teamId || user.data.teamId === 'FREE')) return; // Sem time não tem chat de time
            
            const unsub = onSubChat(chatId);
            return () => unsub && unsub(); // Desliga ao sair
        }
    }, [tab, subChat, user.data.teamId]);

    // Compressão de Imagem
    const handleImageChange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (ev) => {
            const img = new Image();
            img.src = ev.target.result;
            img.onload = () => {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                const MAX_W = 600; 
                let w = img.width; let h = img.height;
                if (w > MAX_W) { h *= MAX_W / w; w = MAX_W; }
                canvas.width = w; canvas.height = h;
                ctx.drawImage(img, 0, 0, w, h);
                setNewImg(canvas.toDataURL('image/jpeg', 0.7)); 
            };
        };
    };

    const submitPost = async () => {
        if (!newText && !newImg) return alert("Escreva algo!");
        setLoading(true);
        await onPost(newText, newImg);
        setNewText(''); setNewImg(null); setLoading(false);
        setTab('FEED'); // Volta pro feed ao postar
    };

    const handleChatSubmit = () => {
        const chatId = subChat === 'GLOBAL' ? 'GLOBAL_CHAT' : `TEAM_${user.data.teamId}`;
        onSendChat(chatId, chatInput);
        setChatInput('');
    };

    // Filtros de Posts
    const myPosts = posts.filter(p => p.authorId === user.data.id);

    return (
        <div style={{paddingBottom: 80}}>
            {/* CABEÇALHO DE NAVEGAÇÃO SOCIAL */}
            <div style={{display:'flex', gap:10, marginBottom:15, background:'#222', padding:10, borderRadius:10, justifyContent:'space-around'}}>
                <button className={`btn btn-ghost ${tab==='FEED'?'active-tab':''}`} style={{border:'none', color: tab==='FEED' ? 'var(--primary)' : '#666'}} onClick={()=>setTab('FEED')}>
                    <i className="fas fa-home"></i> FEED
                </button>
                <button className={`btn btn-ghost ${tab==='CHAT'?'active-tab':''}`} style={{border:'none', color: tab==='CHAT' ? 'cyan' : '#666'}} onClick={()=>setTab('CHAT')}>
                    <i className="fas fa-comments"></i> CHAT
                </button>
                <button className={`btn btn-ghost ${tab==='PERFIL'?'active-tab':''}`} style={{border:'none', color: tab==='PERFIL' ? 'gold' : '#666'}} onClick={()=>setTab('PERFIL')}>
                    <i className="fas fa-user"></i> PERFIL
                </button>
            </div>

            {/* --- ABA 1: FEED GERAL --- */}
            {tab === 'FEED' && (
                <div>
                    {/* ÁREA DE POSTAR (Compacta) */}
                    <div className="card" style={{marginBottom: 15, border: '1px solid #444', display:'flex', gap:10, alignItems:'center'}}>
                        <div style={{fontSize:24, cursor:'pointer'}} onClick={()=>document.getElementById('feed-img').click()}>📷</div>
                        <input className="input-field" placeholder="No que você está pensando?" value={newText} onChange={e=>setNewText(e.target.value)} style={{marginBottom:0, borderRadius:20}} />
                        <button className="btn btn-purple" style={{width:'auto', borderRadius:20, marginBottom:0}} onClick={submitPost} disabled={loading}>➤</button>
                        <input id="feed-img" type="file" accept="image/*" style={{display:'none'}} onChange={handleImageChange} />
                    </div>
                    {newImg && <div style={{textAlign:'center', marginBottom:10}}><img src={newImg} style={{height:100, borderRadius:10}} /><button className="btn btn-red" style={{width:'auto'}} onClick={()=>setNewImg(null)}>X</button></div>}

                    {posts.map(p => (
                        <div key={p.id} className="card" style={{padding:0, overflow:'hidden', marginBottom:15}}>
                            <div style={{padding:10, display:'flex', alignItems:'center', gap:10, background:'rgba(0,0,0,0.2)'}}>
                                {p.authorLogo ? <img src={p.authorLogo} style={{width:30, height:30, borderRadius:'50%'}} /> : <div style={{width:30, height:30, background:'#333', borderRadius:'50%'}}></div>}
                                <div>
                                    <b style={{fontSize:13}}>{p.authorName}</b>
                                    <div style={{fontSize:9, color:'#888'}}>{new Date(p.date).toLocaleString()}</div>

                                <div style={{marginLeft:'auto', display:'flex', gap:10}}>

                                            {(user.data.following || []).includes(p.authorId) ? 'Seguindo' : 'Seguir'}

                                    {(user.type === 'ADMIN' || user.data.id === p.authorId) && (

                        <button className={`btn ${subChat==='TEAM'?'btn-green':'btn-ghost'}`} onClick={()=>setSubChat('TEAM')}>🛡️ TIME</button>
                    </div>

                    {subChat === 'TEAM' && (!user.data.teamId || user.data.teamId === 'FREE') ? (
                        <div className="card" style={{textAlign:'center', padding:30}}>🚫 Você precisa estar em um time para acessar o vestiário.</div>
                    ) : (
                        <div className="card" style={{height: '60vh', display:'flex', flexDirection:'column', padding:0, overflow:'hidden', background:'#121212'}}>

                                {messages.map(m => (
                                    <div key={m.id} style={{alignSelf: m.authorId === user.data.id ? 'flex-end' : 'flex-start', maxWidth:'80%'}}>
                                        <small style={{display:'block', fontSize:9, color:'#888', marginBottom:2, textAlign: m.authorId === user.data.id ? 'right' : 'left'}}>
                                            {m.authorName} {m.authorType === 'ADMIN' && '👑'}
                                        </small>
                                        <div style={{
                                            background: m.authorId === user.data.id ? 'var(--primary)' : '#333',
                                            color: m.authorId === user.data.id ? '#000' : '#fff',
                                            padding: '8px 12px', borderRadius: 10, fontSize: 13
                                        }}>
                                            {m.text}

                                {messages.length === 0 && <p style={{textAlign:'center', color:'#444', marginTop:50}}>Nenhuma mensagem aqui...</p>}

                            <div style={{padding:10, background:'#1e1e1e', display:'flex', gap:10}}>

                                <button className="btn btn-blue" style={{width:'auto', marginBottom:0, borderRadius:'50%', height:40, width:40, padding:0}} onClick={handleChatSubmit}>➤</button>

            {/* --- ABA 3: PERFIL (MatoGram) --- */}
            {tab === 'PERFIL' && (

const PrizeEditor = ({ initialData, onSave, onClose }) => {
    const [prizes, setPrizes] = useState(initialData);

    const updateVal = (serie, field, val) => {
        setPrizes(prev => ({
            ...prev,
            [serie]: { ...prev[serie], [field]: parseInt(val) || 0 }
        }));
    };

    const renderInputs = (serie, title, fields) => (
        <div style={{marginBottom: 15, background: 'rgba(255,255,255,0.05)', padding: 10, borderRadius: 8, border:'1px solid #333'}}>
            <h4 style={{color: 'gold', marginTop: 0}}>{title}</h4>
            <div style={{display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10}}>
                {fields.map(f => (
                    <div key={f.key}>
                        <label style={{fontSize: 10}}>{f.label}</label>
                        <input className="input-field" type="number" value={prizes[serie][f.key]} onChange={e => updateVal(serie, f.key, e.target.value)} style={{marginBottom: 0}}/>
                    </div>
                ))}
            </div>
        </div>
    );

    return (
        <div className="modal-bg">
            <div className="modal-content" style={{maxHeight: '85vh', overflowY: 'auto', border:'2px solid gold'}}>
                <h3 style={{color:'gold', marginTop:0}}>💰 Configurar Premiações Finais</h3>
                <p style={{fontSize:11, color:'#aaa', marginBottom:15}}>Estes valores serão pagos automaticamente aos clubes quando a temporada for encerrada.</p>
                
                {renderInputs('A', 'Série A (Elite)', [{key:'champ', label:'Campeão'}, {key:'vice', label:'Vice'}, {key:'third', label:'3º Lugar'}, {key:'mid', label:'Meio Tabela'}, {key:'rel', label:'Rebaixados'}])}
                {renderInputs('B', 'Série B', [{key:'champ', label:'Campeão'}, {key:'vice', label:'Vice'}, {key:'mid', label:'Meio Tabela'}, {key:'rel', label:'Rebaixados'}])}
                {renderInputs('C', 'Série C', [{key:'champ', label:'Campeão'}, {key:'vice', label:'Vice'}, {key:'mid', label:'Meio Tabela'}, {key:'rel', label:'Rebaixados'}])}
                {renderInputs('D', 'Série D', [{key:'champ', label:'Campeão'}, {key:'vice', label:'Vice'}, {key:'mid', label:'Meio Tabela'}, {key:'rel', label:'Rebaixados'}])}
                {renderInputs('VARZEA', 'O Terrão (Várzea)', [{key:'champ', label:'Campeão'}, {key:'vice', label:'Vice'}, {key:'third', label:'3º Lugar'}, {key:'mid', label:'Demais (Meio)'}])}
                
                <div style={{display: 'flex', gap: 10, marginTop: 15}}>
                    <button className="btn btn-green" onClick={() => onSave(prizes)}>SALVAR VALORES</button>
                    <button className="btn btn-red" onClick={onClose}>CANCELAR</button>
                </div>
            </div>
        </div>
    );
};

// CALENDÁRIO OFICIAL DE MATO REAL
// ==========================================
const GameCalendar = ({ calendar }) => {
    if (!calendar || !calendar.date) return null;

    // Formata a data (Ex: 2026-03-15 vira 15/03/2026)
    const [ano, mes, dia] = calendar.date.split('-');
    const dateBr = `${dia}/${mes}/${ano}`;

    // Pega o nome do mês para ficar bonito
    const monthNames = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];
    const monthName = monthNames[parseInt(mes) - 1];

    // Filtra os eventos para mostrar apenas os de hoje em diante (e ordena por data)
    const upcomingEvents = (calendar.events || [])
        .filter(e => e.date >= calendar.date)
        .sort((a, b) => new Date(a.date) - new Date(b.date));

    return (
        <div className="card" style={{background:'linear-gradient(45deg, #1a1a1a, #001a00)', border:'1px solid var(--primary)', marginBottom: 20, display:'flex', gap:15, alignItems:'stretch'}}>
            {/* Bloco do Dia Atual */}
            <div style={{background:'#000', padding:'10px', borderRadius:8, textAlign:'center', minWidth:'80px', border:'1px solid #333', display:'flex', flexDirection:'column', justifyContent:'center'}}>
                <div style={{fontSize:10, color:'var(--primary)', textTransform:'uppercase', fontWeight:'bold'}}>{monthName}</div>
                <div style={{fontSize:30, fontWeight:'900', color:'#fff', lineHeight:1}}>{dia}</div>
                <div style={{fontSize:10, color:'#888'}}>{ano}</div>
            </div>
            
            {/* Bloco de Eventos */}
            <div style={{flex:1, display:'flex', flexDirection:'column', justifyContent:'center'}}>
                <div style={{fontSize:11, color:'#aaa', marginBottom:5, fontWeight:'bold'}}>
                    <i className="fas fa-calendar-alt"></i> PRÓXIMOS EVENTOS:
                </div>
                {upcomingEvents.length === 0 ? (
                    <div style={{fontSize:12, color:'#666', fontStyle:'italic'}}>Nenhum evento agendado.</div>
                ) : (
                    <div style={{display:'flex', flexDirection:'column', gap:4, maxHeight:'60px', overflowY:'auto'}}>
                        {upcomingEvents.slice(0, 3).map((ev, i) => {
                            const isToday = ev.date === calendar.date;
                            return (
                                <div key={i} style={{fontSize:11, display:'flex', gap:5, alignItems:'center', color: isToday ? 'gold' : '#ddd'}}>
                                    <b style={{color: isToday ? 'gold' : 'var(--primary)'}}>
                                        {isToday ? 'HOJE' : `${ev.date.split('-')[2]}/${ev.date.split('-')[1]}`}
                                    </b> 
                                    <span>- {ev.text}</span>
                                </div>
                            );
                        })}
                    </div>
                )}
            </div>
        </div>
    );
};

    useEffect(() => {

        if (user.type === 'COMPANY') {

            query = query.orderBy('date', 'desc').limit(300);
        }

        const unsubSales = query.onSnapshot(snap => {
            // A MÁGICA AQUI: Fazemos a ordenação do mais novo para o mais velho usando o próprio JavaScript!
            // Assim driblamos a limitação do Firebase e a mochila volta a carregar.
            const myItems = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => b.date - a.date);
            setSales(myItems);
        }, error => {
            console.error("Erro ao carregar mochila:", error);
        });

        // Limpa a busca ao sair da tela/deslogar
        return () => unsubSales();
    }, [user?.data?.id, user?.type]);

           
    // --- NOVO: SINCRONIZADOR DE FAMA (CORREÇÃO AUTOMÁTICA) ---
    // Isso garante que a Fama seja SEMPRE a soma dos itens na mochila.
    // Se o jogador tiver 2 bonés (200), e estiver mostrando 300, isso corrige para 200 na hora.
   useEffect(() => {
        if (!user || user.type !== 'PLAYER' || !sales || sales.length === 0) return;

        // 1. Pega apenas os itens deste jogador
        const myInventory = sales.filter(s => s.buyerId === user.data.id);

        // 2. Calcula quanto de Fama esses itens valem somados
        const realFame = myInventory.reduce((total, item) => {
            // Verifica se é um item que dá fama (Luxo, Veículo, etc)
            if (['VEICULO', 'IMOVEL', 'TECNOLOGIA', 'LUXO'].includes(item.cat)) {
                // Garante que estamos somando apenas NÚMEROS para evitar erro de [object Object]
                const gained = parseInt(item.fameGained) || 0;
                return total + gained;
            }
            return total;
        }, 0);

        // 3. Se o valor no perfil estiver errado, corrige no Banco de Dados
        if (typeof realFame === 'number' && (user.data.fame || 0) !== realFame) {
            console.log(`Corrigindo Fama: De ${user.data.fame} para ${realFame}`);
            
            // Atualiza no Firebase
            db.collection('players').doc(user.data.id).update({ fame: realFame })
              .catch(err => console.error("Erro ao sincronizar fama:", err));
            
            // Atualiza na tela do usuário imediatamente
            setUser(prev => ({
                ...prev,
                data: { ...prev.data, fame: realFame }
            }));
        }
    }, [sales, user?.data?.id]); // Roda sempre que houver uma venda ou compra nova

            const handleHospitalDonation = async (player, amount) => {
    if (!user.data || user.data.balance < amount) return alert("Saldo insuficiente!");
    if (amount <= 0) return alert("Valor inválido.");

    // 1. TRAVA: Já doou para este jogador?
    const myDonations = player.donors || {};
    if (myDonations[user.data.id]) {
        return alert("🛑 GESTO JÁ REALIZADO!\nVocê já contribuiu para o tratamento atual deste jogador. Aguarde a recuperação ou a cirurgia para ajudar novamente.");
    }

    // 2. TRAVA: Empresas só pagam até 1% da cirurgia MAIS CARA disponível
    if (user.type === 'COMPANY') {
        const tetoMaximo = 15000000; // Custo da cirurgia mais cara (Robótica)
        const limiteEmpresa = tetoMaximo * 0.01; // Restrito a 1%
        if (amount > limiteEmpresa) {
            return alert(`🚫 LIMITE EMPRESARIAL!\nPelas leis de Mato Real, empresas podem doar no máximo ${fmt(limiteEmpresa)} (1% do teto cirúrgico) por procedimento para evitar monopólio.`);
        }
    }

    const b = db.batch();
    const donorRef = user.type === 'PLAYER' ? db.collection('players').doc(user.data.id) :
                     user.type === 'USER' ? db.collection('teams').doc(user.data.id) :
                     db.collection('companies').doc(user.data.id);
    
    b.update(donorRef, { balance: firebase.firestore.FieldValue.increment(-amount) });

    // 3. Grava a doação e o nome do doador no perfil do jogador
    const donationObj = {
        [user.data.id]: { name: user.data.name, val: amount, date: Date.now() }
    };

    b.update(db.collection('players').doc(player.id), { 
        hospitalFund: firebase.firestore.FieldValue.increment(amount),
        donors: { ...myDonations, ...donationObj }
    });

    await b.commit();
    alert(`🙏 DOAÇÃO CONFIRMADA!\nObrigado, ${user.data.name}. Seus ${fmt(amount)} foram enviados para o fundo hospitalar.`);
};

    const handleCoachSelfActions = async (action, coach) => {

        // PEDIR AUMENTO
        if (action === 'RAISE') {
            const ask = prompt("Qual o novo salário semanal desejado?", coach.salary);

            await db.collection('offers').add({
                type: 'COACH_RAISE',
                recipientId: team.id, // Vai para o Dono do Time
                senderId: coach.id,
                teamName: team.name,
                coachName: coach.name,
                currentSalary: coach.salary,
                requestedSalary: val,
                status: 'PENDING',
                description: `💰 **PEDIDO DE AUMENTO**\nO técnico **${coach.name}** pede um reajuste salarial.\nAtual: ${fmt(coach.salary)} ➝ Pedido: ${fmt(val)}`,
                date: Date.now()
            });
            alert("Pedido de aumento enviado à diretoria!");
        }

        // PEDIR PARA SAIR (AMIGÁVEL)
        if (action === 'RESIGN_REQ') {
            if(!confirm("Enviar pedido de demissão amigável? O clube pode recusar.")) return;
            await db.collection('offers').add({
                type: 'COACH_RESIGN',
                recipientId: team.id,
                senderId: coach.id,
                teamName: team.name,
                coachName: coach.name,
                status: 'PENDING',
                description: `👋 **PEDIDO DE DESLIGAMENTO**\nO técnico **${coach.name}** deseja rescindir o contrato amigavelmente (sem multa).`,
                date: Date.now()
            });
            alert("Pedido de desligamento enviado!");
        }

        // PAGAR MULTA (SAÍDA IMEDIATA)
        if (action === 'BUYOUT') {
            const clause = coach.clause || (coach.salary * 10);
            if (coach.balance < clause) return alert(`Saldo insuficiente! Você precisa de ${fmt(clause)}.`);
            
            if (!confirm(`TEM CERTEZA? Você pagará ${fmt(clause)} do seu bolso para ficar livre agora.`)) return;

            });

    const handleCounterCoachOffer = async (offer, newSalary, newContract, newClause) => {
        // Regra: Só nível 2+ negocia

        });

    // --- 3. FINALIZAR CONTRATO (ACEITAR) ---
    const handleFinalizeCoachContract = async (offer) => {
        const teamId = offer.teamId;
        const coachId = offer.coachId || (offer.recipientId === teamId ? offer.senderId : offer.recipientId);
        const staffType = offer.staffType || 'COACH'; // Identifica o cargo

        // Verifica saldo do time
        const teamDoc = await db.collection('teams').doc(teamId).get();
        const teamData = teamDoc.data();
        if (teamData.balance < offer.salary) return alert("O time não tem saldo para pagar as luvas (1º salário)!");

        const b = db.batch();

        // 1. Demite o antigo APENAS se ele for da MESMA PROFISSÃO! (Médico substitui Médico)
        const oldStaff = coaches.find(c => c.teamId === teamId && c.status === 'ACTIVE' && c.type === staffType);
        if (oldStaff) {
            b.update(db.collection('users').doc(oldStaff.id), { teamId: 'FREE', contract: 0 });
        }

        // 2. Atualiza o Profissional com o NOVO CONTRATO
        const luvas = parseFloat(offer.luvas) || 0;
        
        b.update(db.collection('users').doc(coachId), { 
            teamId: teamId,
            salary: parseFloat(offer.salary),
            contract: parseInt(offer.contract), 
            clause: parseFloat(offer.clause),
            balance: firebase.firestore.FieldValue.increment(luvas) // Paga as luvas ao profissional
        });

        // 3. Paga Luvas e o 1º Salário e desconta do time
        b.update(db.collection('teams').doc(teamId), { 
            balance: teamData.balance - offer.salary - luvas 
        });

        // 4. Apaga a oferta (negócio fechado)
        b.delete(db.collection('offers').doc(offer.id));

        await b.commit();
        alert(`Contrato assinado! ${offer.coachName} agora integra o Staff do ${offer.teamName}.`);
    };

       // --- FUNÇÕES DE EVOLUÇÃO INTELIGENTE (FIFA STYLE) ---
        const getPrimaryAttrs = (pos) => {

            return ['stamina', 'balance', 'speed', 'shortPass', 'dribble', 'shot'];

        const getXpCost = (ovr) => {

            if (ovr <= 70) return 150;  // Normal (Profissional)

            let totalXP = (p.xp || 0) + (p.pendingXP || 0);
            const safePos = p.position || 'ATA';
            const xpCost = getXpCost(p.overall || 50);

            // Permite XP negativo (regressão)
            let isPositive = totalXP >= 0;
            let absXP = Math.abs(totalXP);
            
            let pointsToDistribute = Math.floor(absXP / xpCost);
            let remainderXP = isPositive ? (absXP % xpCost) : -(absXP % xpCost);

            if (p.attributes && pointsToDistribute !== 0) {
                let newAttrs = { ...p.attributes };
                const allKeys = Object.keys(ATTR_LABELS); 
                const primaryKeys = getPrimaryAttrs(safePos);

                for (let i = 0; i < pointsToDistribute; i++) {
                    let targetKey;
                    // 75% de chance de upar os 6 principais da posição, 25% de upar aleatório (Simula a realidade)
                    if (Math.random() < 0.75) {
                        targetKey = primaryKeys[Math.floor(Math.random() * primaryKeys.length)];

                        targetKey = allKeys[Math.floor(Math.random() * allKeys.length)];

                    // Filtros anti-bug (Zagueiro ganhando habilidade de GK ou Goleiro ganhando Chute)
                    if (safePos === 'GOL' && ['shot', 'attack', 'dribble', 'curve', 'freeKick', 'weakFootAcc'].includes(targetKey)) targetKey = 'gk';
                    if (safePos !== 'GOL' && targetKey === 'gk') targetKey = primaryKeys[0];

                    // Evita atributos inexistentes
                    if (newAttrs[targetKey] === undefined) newAttrs[targetKey] = 50;

                    if (isPositive) { 
                        if (newAttrs[targetKey] < 99) newAttrs[targetKey]++; 
                    } else { 
                        if (newAttrs[targetKey] > 1) newAttrs[targetKey]--; 
                    }
                }

                // Cálculo realista do novo Overall baseado na Posição!
                const ignoreList = safePos === 'GOL' ? ['shot', 'attack', 'dribble', 'curve', 'freeKick', 'weakFootAcc', 'weakFootFreq'] : ['gk'];
                let sum = 0; let count = 0;
                Object.entries(newAttrs).forEach(([key, val]) => { 
                    if (!ignoreList.includes(key) && ATTR_LABELS[key]) { sum += val; count++; } 
                });
                
                updates.attributes = newAttrs;
                updates.overall = count === 0 ? p.overall : Math.round(sum / count);
                updates.xp = remainderXP;
                updates.pendingXP = 0;
            } else {
                updates.xp = remainderXP;
                updates.pendingXP = 0;
            }

            // Aplicar bônus de posição aprendida (se houver)
            if (p.pendingPosBoosts && p.attributes) {
                let newAttrs = updates.attributes ? { ...updates.attributes } : { ...p.attributes };
                p.pendingPosBoosts.forEach(pos => {
                    const map = POS_TRAINING_MAP[pos];

                updates.overall = count === 0 ? p.overall : Math.round(sum / count);
                updates.pendingPosBoosts = firebase.firestore.FieldValue.delete();

            let nc = (parseInt(p.contract) || 0) - 1;
            if (nc < 0) nc = 0;
            
            if (nc === 0) {

const resetDatabase = async () => {
    const senha = prompt("⚠️ PERIGO: Isso apagará TODOS os dados do jogo. Digite a senha master para confirmar:");
    if (senha !== '2503') return; 

    if (!confirm("TEM CERTEZA? Todos os times, jogadores e finanças sumirão para sempre!")) return;

    setLoading(true);
    const collections = ['teams', 'players', 'users', 'news', 'offers', 'sponsorships', 'sales', 'debts', 'financeRequests', 'products', 'companies', 'journalists', 'newspapers'];
    
    try {
        let batches = [db.batch()];
        let count = 0;

        for (const col of collections) {
            const snapshot = await db.collection(col).get();
            snapshot.docs.forEach(doc => {
                if(count >= 450) { batches.push(db.batch()); count = 0; }
                batches[batches.length - 1].delete(doc.ref);
                count++;
            });
        }
        for (let b of batches) { await b.commit(); }
        
        alert("💥 BANCO DE DADOS RESETADO! O sistema irá reiniciar.");
        window.location.reload();
    } catch (e) {
        alert("Erro ao resetar: " + e.message);
    }
    setLoading(false);
};

                                    const snap = await db.collection('players').get();

        reader.onload = (event) => {
            const img = new Image();
            img.src = event.target.result;
            
            img.onload = () => {
                // Cria um Canvas para redimensionar (Compressão)
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                
                // Define tamanho máximo para logo (200px é suficiente e leve)
                const MAX_SIZE = 200;
                let width = img.width;
                let height = img.height;

                // Redimensiona mantendo a proporção
                if (width > height) {
                    if (width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; }
                } else {
                    if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; }
                }

                canvas.width = width;
                canvas.height = height;
                
                // Desenha a imagem redimensionada
                ctx.drawImage(img, 0, 0, width, height);

                // Converte para Texto Base64 leve (JPEG qualidade 0.8)
                const dataUrl = canvas.toDataURL('image/jpeg', 0.8);

                // Atualiza o estado do formulário imediatamente com a nova imagem
                setF({ ...form, logo: dataUrl });
            };
        };

            let baseGain = Math.floor(Math.random() * 5) + 8 + minXpBonus; 
            
            // Aplica Bônus do CT
            let xpGain = baseGain + Math.floor(baseGain * ctBonusMult);

            if ((currentCoach.affinities || []).includes(p.position)) xpGain += (5 + affBonus);

            if (p.equippedItem) {
                const itemBonusPercent = p.equippedItem.power || 0;
                const bonusAmount = Math.ceil(xpGain * (itemBonusPercent / 100));
                xpGain += bonusAmount;
                report.push(`👟 ${p.name} usou ${p.equippedItem.name} (+${bonusAmount} XP)`);
                b.delete(db.collection('sales').doc(p.equippedItem.id));
                b.update(db.collection('players').doc(pid), { equippedItem: firebase.firestore.FieldValue.delete() });
            }

            activePerks.forEach(perk => {
                if (perk.type === 'TRAIN_BOOST') {
                    const hasSynergy = perk.attrs.some(attr => trainedAttrs.includes(attr));
                    if (hasSynergy) xpGain = Math.round(xpGain * perk.multiplier);
                }
                if (perk.type === 'YOUTH_BOOST') {
                    const age = p.age || 18;
                    if (age <= perk.ageLimit) xpGain = Math.round(xpGain * perk.multiplier);
                }
            });

            if (Math.random() < (0.10 + critBonus)) {
                xpGain *= 2;
                report.push(`🔥 ${p.name} teve uma GRANDE evolução (+${xpGain} XP)!`);
            }

            let newAttrs = { ...(p.attributes || {}) };
            trainedAttrs.forEach(attr => {
                if((newAttrs[attr] || 50) < 99) {
                    if(Math.random() < (xpGain / 80)) newAttrs[attr] = (newAttrs[attr] || 50) + 1;
                }
            });

            let updates = { 
                xp: (p.xp || 0) + xpGain, 
                energy: newEnergy,
                attributes: newAttrs
            };

            // --- LÓGICA DE APRENDER NOVA POSIÇÃO ---
            if (p.learningPosition) {
                if (type === POS_TRAINING_MAP[p.learningPosition.target].train) {
                    let posProgress = 10; // Progresso base
                    if ((currentCoach.affinities || []).includes(p.learningPosition.target)) posProgress += 5; // Bônus do técnico
                    posProgress += (ctLvl * 2); // Bônus do CT
                    
                    const newCur = p.learningPosition.current + posProgress;
                    if (newCur >= p.learningPosition.required) {
                        report.push(`🌟 ${p.name} APRENDEU a jogar de ${p.learningPosition.target}! (O Boost de atributos entrará na próxima temporada)`);
                        updates.secondaryPositions = firebase.firestore.FieldValue.arrayUnion(p.learningPosition.target);
                        updates.learningPosition = firebase.firestore.FieldValue.delete();
                        updates.pendingPosBoosts = firebase.firestore.FieldValue.arrayUnion(p.learningPosition.target);
                    } else {
                        updates['learningPosition.current'] = newCur;
                        report.push(`🔄 ${p.name} adaptando para ${p.learningPosition.target}: ${Math.min(100, Math.floor((newCur/p.learningPosition.required)*100))}%`);
                    }
                } else {
                    report.push(`⚠️ ${p.name} precisa do treino de ${POS_TRAINING_MAP[p.learningPosition.target].train} para evoluir na nova posição.`);
                }
            }

           b.update(db.collection('players').doc(pid), updates);
            coachXpGain += 20;
            report.push(`✔️ ${p.name} evoluiu +${xpGain} XP (Desgaste: -${playerEnergyCost}⚡)`);
        });

        if (type === 'STUDY') {
            coachXpGain = Math.floor(Math.random() * 10) + 15;
            report.push("📚 Você dedicou tempo estudando novas táticas e evoluiu como treinador.");
        }

        let newCoachXp = (currentCoach.xp || 0) + coachXpGain;
        let newLevel = currentCoach.level;
        let pendingPerks = currentCoach.pendingPerks || 0;
        let pendingAffinity = currentCoach.pendingAffinity || 0;
        
        const xpNeed = newLevel * 120;
        if (newCoachXp >= xpNeed && newLevel < 30) {
            newCoachXp -= xpNeed;
            newLevel++;
            if (newLevel % 5 === 0) pendingPerks++;
            if ([10, 20, 30].includes(newLevel)) pendingAffinity++;
            alert(`🎉 PARABÉNS! Nível ${newLevel} alcançado!`);
        }

        b.update(db.collection('users').doc(currentCoach.id), {
            energy: coachEnergy - coachEnergyCost,
            xp: newCoachXp,
            level: newLevel,
            pendingPerks,
            pendingAffinity
        });

        // GRAVA NO MURAL DO CLUBE (TREINO DO TÉCNICO)
        if (currentTeam) {
            let newLogs = [...(currentTeam.trainingLogs || [])];
            newLogs.unshift({ date: Date.now(), type, report: report.join('\n') });
            if (newLogs.length > 10) newLogs.pop(); // Agora guarda os últimos 10 treinos
            b.update(db.collection('teams').doc(currentTeam.id), { trainingLogs: newLogs });
        }

        await b.commit();
        setLoading(false);
        
        let msg = type === 'STUDY' ? "Estudo concluído!" : "Treino realizado com sucesso!";
        if(report.length > 0) msg += "\n\n" + report.join("\n");
        alert(msg);
    };

    const handleEvolveCoachPerk = async (perk) => {
        // Atualiza no Banco de Dados
        await db.collection('users').doc(user.data.id).update({
            perks: firebase.firestore.FieldValue.arrayUnion(perk),
            pendingPerks: firebase.firestore.FieldValue.increment(-1)
        });

        // ATUALIZAÇÃO VISUAL IMEDIATA (Para a tela sumir na hora)
        setUser(prev => ({
            ...prev,
            data: {
                ...prev.data,
                perks: [...(prev.data.perks || []), perk],
                pendingPerks: (prev.data.pendingPerks || 1) - 1
            }
        }));

        alert(`Habilidade "${perk.name}" aprendida!`);

            //FIM

const sendOffer = async (target, type, value, swapIds, con, meta, old) => {
    const v = parseFloat(value) || 0;
    const contractYears = parseInt(con) || 1;
    const actingTeamName = user.data.name;
    const targetPlayerName = target.name;
    const finalSal = parseFloat(meta.newSalary) || 0;
    const role = meta.role || 'ROTACAO';

const isStaff = ['COACH', 'DOCTOR', 'SCOUT', 'ASSISTANT'].includes(target.type);

    // ==========================================
    // ROTA ESPECIAL: NEGOCIAÇÃO COM A COMISSÃO TÉCNICA
    // ==========================================
    if (isStaff) {
        try {
            setLoading(true);
            const luvas = parseFloat(meta.signingBonus) || 0;
            const db = firebase.firestore();

            // Verifica se é uma contra-proposta (Alguém respondendo)
            if (old && old.id) {
                await db.collection('offers').doc(old.id).update({
                    salary: finalSal,
                    contract: contractYears,
                    luvas: luvas,
                    status: 'PENDING', // Volta para o outro lado avaliar
                    recipientId: target.id, // Envia para o profissional
                    senderId: user.data.id
                });
            } else {
                // É uma Proposta Nova ou Renovação inicial
                await db.collection('offers').add({
                    type: 'COACH_OFFER',
                    coachId: target.id,
                    staffType: target.type,
                    recipientId: target.id,
                    senderId: user.data.id,
                    teamId: user.data.id,
                    teamName: actingTeamName,
                    coachName: target.name,
                    salary: finalSal,
                    contract: contractYears,
                    clause: finalSal * 10, // Multa padrão
                    luvas: luvas, // Bônus de Assinatura
                    status: 'PENDING',
                    createdAt: Date.now()
                });
            }

            setLoading(false);
            setModal(null);
            return alert(`📋 Proposta formal enviada para ${target.name}! Aguarde a resposta na sua Caixa de Entrada.`);
        } catch (e) {
            setLoading(false);
            return alert("Erro ao enviar proposta para a Comissão Técnica.");
        }
    }
    // ==========================================
    
    // --- 1. TRAVA DO LIMITE DE 7 BOTS (MERCADO GLOBAL) ---
    if (target.isNPC && user.type === 'USER') {
        const myTeamBots = players.filter(p => p.teamId === user.data.id && p.isNPC).length;
        
        // 1. Trava se já tiver 7 e estiver tentando comprar de fora
        if (myTeamBots >= 7 && target.teamId !== user.data.id) {
             alert(`🚫 LIMITE DA BASE ATINGIDO!\nVocê já tem 7/7 BOTS no elenco. Você só poderá contratar outro quando 1 deles sair do elenco.`);
             return; // Aborta a compra!
        }

        // 2. Balão de fala EXATO que você pediu! (Aparece antes de enviar a proposta)
        if (target.teamId !== user.data.id) { // Só avisa se o Bot não for do próprio time
             if (!confirm(`⚠️ AVISO DA BASE\n\nAtualmente você tem ${myTeamBots}/7 BOTS no elenco.\nTem certeza que quer enviar esta proposta para ${target.name}?\n\nAssim que você completar 7 de 7, você só poderá contratar outro quando 1 deles sair do elenco.`)) {
                 return; // O usuário clicou em Cancelar e desistiu de enviar a proposta
             }
        }
    }

    // --- LÓGICA DE DESTINATÁRIO INTELIGENTE ---
    let recipientId; 
    const isFreeAgent = target.teamId === 'FREE' || !target.teamId;

    if (old && old.id) {
        if (old.type === 'RENOVACAO_URGENTE') recipientId = old.playerId;
        else if (old.sellerAccepted === true) recipientId = (user.data.id === old.buyerId) ? old.playerId : old.buyerId;
        else recipientId = (user.data.id === old.buyerId) ? ((old.sellerId === 'FREE' || !old.sellerId) ? old.playerId : old.sellerId) : old.buyerId;
    } else {
        if (type === 'PRE_CONTRATO' || type === 'RENOVACAO') recipientId = target.id; 
        else recipientId = isFreeAgent ? target.id : target.teamId;
    }

    // --- 2. INTELIGÊNCIA DO BOT (Apenas se a proposta for DIRETAMENTE para ele) ---
    if (target.isNPC && user.type === 'USER' && recipientId === target.id) {
        const teamObj = teams.find(t => t.id === user.data.id);
        const botResponse = processBotDecision({ meta: { newSalary: finalSal } }, teamObj, target);
        
        if (botResponse.decision === 'REJECT') {
            alert(botResponse.message); 
            return; // 🛑 ABORTA: Bot não gostou, fim de papo.
        } 
        else if (botResponse.decision === 'COUNTER') {
            if (confirm(`${botResponse.message}\n\nVocê aceita pagar ${fmt(botResponse.counterValue)} de salário para fechar negócio AGORA?`)) {
                meta.newSalary = botResponse.counterValue; // Atualiza forçado se o humano aceitou
            } else {
                alert("Negociação cancelada. O jogador encerrou as conversas.");
                return; // 🛑 ABORTA: O humano não quis pagar o que o Bot pediu.
            }
        }
        else if (botResponse.decision === 'ACCEPT') {
            alert(botResponse.message);
        }

        // 🚀 SE CHEGOU AQUI: O BOT DISSE SIM! VAMOS ASSINAR O CONTRATO NA HORA!
        try {
            setLoading(true);
            const db = firebase.firestore();
            const b = db.batch();
            const luvas = parseFloat(meta.signingBonus) || 0;
            
            // Se o clube não tiver dinheiro para as luvas, bloqueia
            if (teamObj.balance < luvas) {
                setLoading(false);
                return alert(`Seu clube não tem ${fmt(luvas)} no caixa para pagar as Luvas de Assinatura. O negócio melou!`);
            }

            // Desconta Luvas do Clube
            if (luvas > 0) b.update(db.collection('teams').doc(user.data.id), { balance: firebase.firestore.FieldValue.increment(-luvas) });
            
            // Paga as luvas ao Bot e atualiza o contrato
            b.update(db.collection('players').doc(target.id), {
                teamId: user.data.id,
                status: 'NAO_A_VENDA',
                contract: contractYears,
                salary: parseFloat(meta.newSalary),
                role: role,
                balance: firebase.firestore.FieldValue.increment(luvas),
                history: firebase.firestore.FieldValue.arrayUnion({ 
                    date: Date.now(), from: isFreeAgent ? 'AGENTE LIVRE' : 'Clube Anterior', to: user.data.name, type: type, value: 0 
                })
            });

            // Se era uma negociação antiga rolando, apaga a pendência
            if (old && old.id) b.delete(db.collection('offers').doc(old.id));

            await b.commit();
            postNews(`🤝 **NOVA CONTRATAÇÃO!**\nO Atleta da Base **${target.name}** aceitou os termos e assinou com o **${user.data.name}**!`, 'transfer');
            setLoading(false);
            setModal(null);
            return alert(`Negócio fechado! ${target.name} já está no seu elenco.`);
        } catch (error) {
            setLoading(false);
            return alert("Erro ao assinar com o Bot: " + error.message);
        }
    }
    // --- FIM DA INTELIGÊNCIA DO BOT ---

    // --- SISTEMA DE NEGOCIAÇÃO HUMANA (PADRÃO) ---
    try {
        let details = `💰 Taxa: ${fmt(v)}\n`;
        if (meta.installments > 1) details += `📅 Parcelamento: ${meta.installments}x de ${fmt(v / meta.installments)}\n`;
        if (meta.sellOn > 0) details += `📈 Revenda: ${meta.sellOn}%\n`;

        if (type === 'PRE_CONTRATO') {
            details = `⚖️ **LEI BOSMAN (PRÉ-CONTRATO)**\nO jogador virá a custo zero no início da próxima temporada.\n`;
        } else if (type === 'RENOVACAO') {
            details = `📝 **PROPOSTA DE RENOVAÇÃO**\nA diretoria ofereceu um novo contrato.\n`;
        }

        details += `📝 Contrato: ${contractYears} anos\n`;
        details += `💵 Salário Sugerido: ${fmt(finalSal)}/sem\n`;
        details += `👔 Papel: ${role}`;

        const pl = {
            playerId: target.id,
            playerName: targetPlayerName,
            buyerId: old?.buyerId || user.data.id,
            buyerName: old?.buyerName || actingTeamName,
            sellerId: target.teamId || old?.sellerId || 'FREE',
            recipientId: recipientId,
            type: (old?.type === 'RENOVACAO_URGENTE') ? 'RENOVACAO' : type,
            value: v,
            offerContract: contractYears,
            description: details,
            status: 'PENDING',
            sellerAccepted: old ? (old.sellerAccepted || false) : false,
            meta: {
                ...meta,
                newSalary: finalSal,
                signingBonus: parseFloat(meta.signingBonus) || 0,
                role: role,
                installments: parseInt(meta.installments) || 1,
                sellOn: parseInt(meta.sellOn) || 0,
                hasBuyOption: meta.hasBuyOption || false
            },
            date: Date.now()
        };

        const b = db.batch();
        if (old && old.id) b.delete(db.collection('offers').doc(old.id));
        
        b.set(db.collection('offers').doc(), pl);
        await b.commit();

        const msgHead = (old && old.id) ? "🔄 CONTRAPROPOSTA" : (type === 'PRE_CONTRATO' ? "⚖️ PRÉ-CONTRATO" : (type === 'RENOVACAO' ? "📝 RENOVAÇÃO" : "💼 NOVA OFERTA"));
        
        postNews(`${msgHead}\n**${actingTeamName}** enviou uma proposta para **${targetPlayerName}**!\n\n${details}`, 'transfer');
        
        setModal(null); 
        alert("Enviado com sucesso! Aguarde a resposta.");
    } catch (e) {
        console.error("Erro no Firebase:", e);
        alert("Erro técnico ao gravar no banco de dados.");
    }
};

const acceptOffer = async (o) => {
    try {
        // --- 1. LÓGICA DE NOTIFICAÇÃO (APENAS LEITURA) ---
        if (o.type === 'NOTIFICACAO') {
            await db.collection('offers').doc(o.id).delete();
            alert('Confirmado!');
            return;
        }

        // --- 2. LÓGICA DE PRÉ-CONTRATO (V1.52.9) ---
        // (Mantido para não perder a funcionalidade de assinar com jogadores em fim de contrato)
        if (o.type === 'PRE_CONTRATO') {
            if (!confirm(`Confirmar assinatura de Pré-Contrato com ${o.buyerName}?\nVocê se juntará a eles na próxima temporada.`)) return;
            
            const b = db.batch();
            
            // Grava o pré-contrato no perfil do jogador
            b.update(db.collection('players').doc(o.playerId), {
                preContract: {
                    teamId: o.buyerId,
                    teamName: o.buyerName,
                    salary: o.meta.newSalary,
                    date: Date.now()
                },
                mood: '🤩'
            });

            b.delete(db.collection('offers').doc(o.id));
            await b.commit();
            
            postNews(`📝 **PRÉ-CONTRATO ASSINADO**\n**${o.playerName}** assinou com o **${o.buyerName}** e se apresentará na próxima temporada!`, 'transfer');
            alert("Pré-contrato assinado com sucesso!");
            return;
        }

        const buy = teams.find(t => t.id === o.buyerId);
        const p = players.find(x => x.id === o.playerId);
        const isFreeAgent = !o.sellerId || o.sellerId === 'FREE';
        const sel = isFreeAgent ? null : teams.find(t => t.id === o.sellerId);

        // --- 3. CASO ESPECIAL: COMPRA DEFINITIVA (EXERCER OPÇÃO DE EMPRÉSTIMO) ---
        if (o.type === 'COMPRA_DEFINITIVA') {
            if (!buy || !p) return alert("Erro: Dados incompletos.");
            if (buy.balance < o.value) return alert(`Saldo insuficiente! Necessário: ${fmt(o.value)}`);
            if (!confirm(`Exercer opção de compra de ${p.name} por ${fmt(o.value)}?`)) return;

            const b = db.batch();
            b.update(db.collection('teams').doc(buy.id), { balance: buy.balance - o.value });
            if (sel) b.update(db.collection('teams').doc(sel.id), { balance: sel.balance + o.value });

            b.update(db.collection('players').doc(p.id), {
                teamId: buy.id,
                loanMeta: firebase.firestore.FieldValue.delete(), 
                status: 'NAO_A_VENDA',
                contract: 3, 
                history: firebase.firestore.FieldValue.arrayUnion({ 
                    date: Date.now(), from: sel ? sel.name : 'EMPRÉSTIMO', to: buy.name, type: 'COMPRA_DEFINITIVA', value: o.value 
                })
            });
            b.delete(db.collection('offers').doc(o.id));
            await b.commit();
            postNews(`✅ **OPÇÃO EXERCIDA**\nO **${buy.name}** contratou **${p.name}** em definitivo!`, 'transfer');
            alert("Compra realizada!");
            return;
        }

        // =================================================================================
        // LÓGICA DE NEGOCIAÇÃO INTELIGENTE (ACEITE BIDIRECIONAL)
        // =================================================================================

        const iAmBuyer = user.type === 'USER' && user.data.id === o.buyerId;
        const iAmSeller = user.type === 'USER' && user.data.id === o.sellerId;
        const iAmPlayer = user.type === 'PLAYER' || (isFreeAgent && !iAmBuyer);

        // --- FASE 1: ACORDO ENTRE CLUBES ---
        if (!isFreeAgent && !o.sellerAccepted && (iAmSeller || iAmBuyer)) {
            if (iAmBuyer) {
                if (!confirm(`Aceitar a pedida do clube vendedor (${fmt(o.value)}) e negociar com o jogador?`)) return;
            } else {
                if (!confirm("Aceitar os valores propostos? O jogador decidirá o contrato agora.")) return;
            }
            
            await db.collection('offers').doc(o.id).update({
                recipientId: o.playerId, 
                sellerAccepted: true,     
                status: 'PENDING'
            });
            
            postNews(`💰 **ACORDO ENTRE CLUBES**\n${buy.name} e ${sel.name} chegaram a um acordo por **${p.name}**. Falta o "Sim" do atleta!`, 'transfer');
            alert("Acordo financeiro selado! A proposta foi enviada para o jogador.");
            return;
        }

        // --- FASE 2: ACORDO FINAL ---
        const readyForContract = isFreeAgent || o.sellerAccepted;

        if (readyForContract && (iAmPlayer || iAmBuyer)) {
            if (!buy || !p) return alert("Erro: Dados incompletos.");

            const valorEntrada = o.meta?.installments > 1 ? (o.value / o.meta.installments) : o.value;
            const luvas = parseFloat(o.meta?.signingBonus) || 0;
            const custoTotalImediato = valorEntrada + luvas;

            if (buy.balance < custoTotalImediato) {
                return alert(`Saldo insuficiente no caixa do comprador!\nNecessário: ${fmt(custoTotalImediato)}`);
            }

            if (iAmBuyer) {
                if (!confirm(`Aceitar a pedida salarial do jogador e fechar a contratação?\nCusto Imediato: ${fmt(custoTotalImediato)}`)) return;
            } else {
                if (!confirm(`Deseja assinar com o ${buy.name}?`)) return;
            }

            // --- EXECUÇÃO DA TRANSFERÊNCIA ---
            const b = db.batch();
            
            // 1. Paga o Clube Vendedor (se houver) E processa cláusula de revenda ANTIGA
            if (sel) {
                let valorParaVendedor = valorEntrada;

                // >>>> LÓGICA DE REVENDA (SELL-ON FEE) AUTOMÁTICA <<<<
                // Se o jogador tem uma cláusula salva, calcula a parte do antigo dono
                if (p.sellOnClause && p.sellOnClause.percentage > 0) {
                    const beneficiaryId = p.sellOnClause.beneficiaryId;
                    
                    // Só executa se o beneficiário ainda existir e não for o mesmo que está comprando
                    if (beneficiaryId && beneficiaryId !== buy.id) {
                        const shareAmount = (valorEntrada * p.sellOnClause.percentage) / 100;
                        
                        // Desconta do vendedor atual
                        valorParaVendedor -= shareAmount;
                        
                        // Paga ao dono original (Beneficiário)
                        b.update(db.collection('teams').doc(beneficiaryId), { 
                            balance: firebase.firestore.FieldValue.increment(shareAmount) 
                        });
                    }
                }

                // Paga o vendedor (já descontado a revenda, se houve)
                b.update(db.collection('teams').doc(sel.id), { balance: sel.balance + valorParaVendedor });

                // Cria dívida se parcelado
                if (o.meta?.installments > 1) {
                    const debtRef = db.collection('debts').doc();
                    b.set(debtRef, {
                        buyerId: buy.id, buyerName: buy.name,
                        sellerId: sel.id, sellerName: sel.name,
                        playerName: p.name, installmentVal: valorEntrada,
                        weeksRemaining: parseInt(o.meta.installments) - 1, date: Date.now()
                    });
                }
            }

            // 2. Desconta do Comprador
            b.update(db.collection('teams').doc(buy.id), { balance: buy.balance - custoTotalImediato });

            // 3. Paga Luvas ao Jogador
            if (luvas > 0) {
                b.update(db.collection('players').doc(p.id), { balance: firebase.firestore.FieldValue.increment(luvas) });
            }

            // 4. Atualiza o Jogador (Move de time e Grava NOVA Cláusula)
            
            // Prepara a NOVA cláusula se foi negociada agora (0 a 80%)
            const newSellOnClause = (o.meta && o.meta.sellOn > 0 && sel) ? {
                beneficiaryId: sel.id,
                percentage: o.meta.sellOn
            } : firebase.firestore.FieldValue.delete(); // Se não tem revenda nova, apaga a antiga para limpar o histórico

            b.update(db.collection('players').doc(p.id), {
                teamId: buy.id,
                status: 'NAO_A_VENDA',
                contract: o.type === 'EMPRESTIMO' ? (parseInt(o.meta.loanDuration) || 1) : (parseInt(o.offerContract) || 1),
                salary: parseFloat(o.meta?.newSalary) || p.salary,
                role: o.meta?.role || 'ROTACAO',
                loanMeta: o.type === 'EMPRESTIMO' ? { 
                    ownerId: sel?.id, 
                    salarySplit: o.meta.salarySplit || 100,
                    hasBuyOption: o.meta.hasBuyOption || false,
                    buyOpt: o.meta.buyOpt || 0,
                    originalContract: p.contract 
                } : null,
                // AQUI GRAVA A NOVA CLÁUSULA NO JOGADOR
                sellOnClause: newSellOnClause,

const rejectOffer = async (o) => {
    try {
        // --- CASO 1: RECUSA DE OPÇÃO DE COMPRA (FIM DE EMPRÉSTIMO) ---
        if (o.type === 'COMPRA_DEFINITIVA' && o.isLoanOption) {
            const p = players.find(x => x.id === o.playerId);
            const ownerId = o.sellerId; 
            const ownerTeam = teams.find(t => t.id === ownerId);

            if (!confirm("Deseja recusar a compra? O jogador retornará ao clube de origem.")) return;

            const b = db.batch();
            const pRef = db.collection('players').doc(p.id);

            // --- CORREÇÃO DE SEGURANÇA PARA DADOS ANTIGOS ---
            let originalDuration = 0;
            
            if (p.loanMeta && p.loanMeta.originalContract) {
                originalDuration = parseInt(p.loanMeta.originalContract);
            } else {
                console.warn("Contrato original não encontrado. Usando fallback de 6 anos.");
                originalDuration = 6; 
            }
            
            let remainingContract = originalDuration - 1;
            if (remainingContract < 0) remainingContract = 0;

            if (remainingContract <= 0) {
                const renewalReqRef = db.collection('offers').doc();
                b.set(renewalReqRef, {
                    type: 'RENOVACAO_URGENTE',
                    playerId: p.id,
                    playerName: p.name,
                    buyerId: ownerId, 
                    buyerName: ownerTeam?.name || 'Clube de Origem',
                    sellerId: 'SISTEMA',
                    recipientId: ownerId,
                    status: 'PENDING',
                    description: `⚠️ **URGENTE: FIM DE CONTRATO**\nO empréstimo de **${p.name}** acabou e o contrato dele com você expirou.\n\nRenove ou libere para os passes livres.`,
                    date: Date.now()
                });

                b.update(pRef, {
                    teamId: ownerId,
                    loanMeta: firebase.firestore.FieldValue.delete(),
                    status: 'INTRANSFERIVEL',
                    contract: 0
                });

                postNews(`🔙 **RETORNO CRÍTICO**\nO empréstimo de ${p.name} acabou e o contrato expirou!`, 'rumor');
            } else {
                const notifRef = db.collection('offers').doc();
                b.set(notifRef, {
                    type: 'NOTIFICACAO',
                    playerId: p.id,
                    playerName: p.name,
                    buyerName: 'Sistema',
                    recipientId: ownerId,
                    status: 'PENDING',
                    description: `🔙 **RETORNO DE EMPRÉSTIMO**\nA opção de compra foi recusada.\n**${p.name}** voltou ao seu elenco.\n\n📄 Contrato Restante: ${remainingContract} temporada(s).`,
                    date: Date.now()
                });

                b.update(pRef, {
                    teamId: ownerId,
                    loanMeta: firebase.firestore.FieldValue.delete(),
                    status: 'NAO_A_VENDA',
                    contract: remainingContract 
                });
                
                postNews(`🔙 **RETORNO**\n${p.name} retornou ao ${ownerTeam?.name} (${remainingContract} anos rest.).`, 'transfer');
            }

            b.delete(db.collection('offers').doc(o.id));
            await b.commit();
            alert("Opção recusada. Jogador devolvido ao clube de origem.");
            return;
        }

        // --- CASO 2: RECUSA DE RENOVAÇÃO URGENTE ---
        if (o.type === 'RENOVACAO_URGENTE') {
            if (!confirm("Tem certeza? O jogador perderá o vínculo com o clube e irá para os Agentes Livres.")) return;
            
            const b = db.batch();
            b.update(db.collection('players').doc(o.playerId), {
                teamId: 'FREE',
                status: 'VENDA',
                mood: '😐',
                contract: 0
            });
            b.delete(db.collection('offers').doc(o.id));
            await b.commit();
            
            postNews(`🆓 **AGENTE LIVRE**\nO vínculo de **${o.playerName}** expirou e ele está livre no mercado!`, 'transfer');
            alert("Jogador enviado para os Agentes Livres.");
            return;
        }

        // --- CASO 3: RECUSA NORMAL DE PROPOSTAS ---
        if (!confirm("Deseja recusar e encerrar esta negociação?")) return;
        await db.collection('offers').doc(o.id).delete();
        
        if (o.type !== 'NOTIFICACAO') {
            postNews(`❌ **NEGOCIAÇÃO ENCERRADA**\nO acordo por **${o.playerName}** não avançou.`, 'transfer');
        }

    } catch (e) {
        console.error(e);
        alert("Erro técnico ao processar a recusa.");
    }
};

           const saveMatchStats = async (dataPayload, legacyMatch, legacyXp, homeTeam = null, matchDataObj = null) => {

                xp += (match.tackles || 0) * R.TACKLE;
                xp += (match.saves || 0) * R.SAVE;
                xp += (match.yellows || 0) * R.YELLOW;
                xp += (match.reds || 0) * R.RED;
                if (match.result === 'VITORIA') xp += R.WIN;
                if (match.result === 'EMPATE') xp += R.DRAW;

                xp += (parseFloat(match.rating) || 0) * R.RATING_MULT;
            }

                tackles: (player.stats?.tackles||0) + (match.tackles||0),

                yellows: (player.stats?.yellows||0) + (match.yellows||0), 
                reds: (player.stats?.reds||0) + (match.reds||0) 
            };

            const currentCount = player.pressRatingCount || 0; 
            const newSum = currentSum + parseFloat(match.rating || 0);
            const newCount = currentCount + 1;
            const newAvg = newSum / newCount; 
            
            const updateData = { 
                stats: newStats, 
                pendingXP: (player.pendingXP || 0) + xpGained,
                pressRatingSum: newSum,
                pressRatingCount: newCount,
                pressRatingAvg: parseFloat(newAvg.toFixed(1)),

            const rngFactor = (Math.floor(Math.random() * 41) + 80) / 100;
            let attendance = Math.floor(sDb.cap * priceFactor * rngFactor);

            const ticketRevenue = attendance * ticPrice;
            const baseConversionRate = [0, 0.05, 0.10, 0.15, 0.20, 0.25][lvl] || 0.05;

                let priceDifficulty = 1;

                const potentialBuyers = Math.floor(attendance * baseConversionRate * priceDifficulty);
                const itemsSold = Math.min(potentialBuyers, prod.stock);
                totalStoreRevenue += (itemsSold * prod.price);
                return { ...prod, stock: prod.stock - itemsSold };
            });

            const teamRef = db.collection('teams').doc(homeTeam.id);

                    let form = tObj.recentForm || [];
                    form.unshift(teamResults[tid]);

                        if (isEstadualMatch) {

                            updatesToTeam.stats = newStats;

                    }

                    b.update(db.collection('teams').doc(tid), updatesToTeam);

        if (matchDataObj && matchDataObj.id && submittedTeamId) {

    const subscribeToChat = (chatId) => {
        return db.collection('chats').doc(chatId).collection('messages')
            .orderBy('date', 'desc').limit(50) // Só as últimas 50
            .onSnapshot(snap => {
                const msgs = snap.docs.map(d => ({id: d.id, ...d.data()})).reverse(); // Inverte para ficar cronológico
                setChatMessages(msgs);
            });
    };

    const sendChatMessage = async (chatId, text) => {
        if(!text.trim()) return;
        const msgRef = db.collection('chats').doc(chatId).collection('messages');
        
        await msgRef.add({
            text: text,
            authorId: user.data.id,
            authorName: user.data.name,
            authorType: user.type, // Para colorir o nome (Admin, Jogador, etc)
            date: Date.now()
        });

        // Limpeza automática (Anti-peso)
        // Nota: Em produção real faríamos via Cloud Function, aqui faremos "Lazy Cleanup"
        // Se a lista local estiver muito grande, deleta as antigas do banco
        if(chatMessages.length > 60) {
            const oldSnap = await msgRef.orderBy('date', 'asc').limit(10).get();
            const b = db.batch();
            oldSnap.docs.forEach(doc => b.delete(doc.ref));
            b.commit();
        }
    };

            // Deixar de Seguir
            await myRef.update({ following: firebase.firestore.FieldValue.arrayRemove(targetId) });
            alert("Deixou de seguir.");
        } else {
            // Seguir
            await myRef.update({ following: firebase.firestore.FieldValue.arrayUnion(targetId) });
            alert("Seguindo!");
        }

        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
            const img = new Image();
            img.src = event.target.result;
            img.onload = async () => {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                
                // TAMANHO REDUZIDO PARA 150px (Suficiente para Logo)
                const MAX_SIZE = 150; 
                let width = img.width, height = img.height;
                if (width > height) { if (width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; } } 
                else { if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; } }
                canvas.width = width; canvas.height = height;
                ctx.drawImage(img, 0, 0, width, height);
                
                // FORMATO WEBP + QUALIDADE 60% (Extremamente leve)
                const dataUrl = canvas.toDataURL('image/webp', 0.6);
                
                if(confirm("Atualizar logo da empresa?")) {
                    await db.collection('companies').doc(company.id).update({ logo: dataUrl });
                    alert("Logo atualizado!");
                }
            };
        };
    };

                    <button className="btn btn-green" onClick={async ()=>{
                        const uCost = getProdCost(editP.cat, editP.power);
                        const qty = parseInt(editP.stock) || 1;
                        const tCost = uCost * qty;
                        const price = parseFloat(editP.price);
                        
                        if(uCost > 0 && price < uCost) return alert(`🚫 ANTI-CHEAT: O preço (${fmt(price)}) não pode ser menor que o custo de produção (${fmt(uCost)})!`);
                        if((company.balance || 0) < tCost) return alert("A empresa não tem saldo para esta produção!");

                        try {
                            // 1. Debita o valor total do saldo da empresa no Firebase
                            if(tCost > 0) {
                                await db.collection('companies').doc(company.id).update({
                                    balance: firebase.firestore.FieldValue.increment(-tCost)
                                });
                            }

                            // 2. Calcula o estoque final somando com o que já existe se for edição
                            const oldProd = products.find(x => x.id === editP.id);
                            const finalStock = editP.id ? (parseInt(oldProd.stock || 0) + qty) : qty;

                            // 3. Salva o produto
                            onSaveProd({
                                ...editP,
                                stock: finalStock,
                                productionCost: uCost
                            });
                            
                            setEditP(null);
                        } catch(e) { alert("Erro ao produzir: " + e.message); }
                    }}>
                        {editP.id ? `FABRICAR (+${editP.stock})` : `PAGAR E LANÇAR (-${fmt(getProdCost(editP.cat, editP.power) * (editP.stock||1))})`}
                    </button>
                    <button className="btn" onClick={()=>setEditP(null)}>CANCELAR</button>
                </div>
            </div></div>}
        </div>
    );
};

        const reader = new FileReader();
        reader.readAsDataURL(file);
        
        reader.onload = (event) => {
            const img = new Image();
            img.src = event.target.result;
            
            img.onload = async () => {
                // 2. Cria um Canvas para redimensionar (Compressão)
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                
                // Define tamanho máximo para ícone (200px é perfeito e leve)
                const MAX_SIZE = 200;
                let width = img.width;
                let height = img.height;

                // Redimensiona mantendo a proporção
                if (width > height) {
                    if (width > MAX_SIZE) {
                        height *= MAX_SIZE / width;
                        width = MAX_SIZE;
                    }
                } else {
                    if (height > MAX_SIZE) {
                        width *= MAX_SIZE / height;
                        height = MAX_SIZE;
                    }
                }

                canvas.width = width;
                canvas.height = height;
                
                // Desenha a imagem redimensionada no canvas
                ctx.drawImage(img, 0, 0, width, height);

                // 3. Converte para Texto Base64 leve (JPEG qualidade 0.8)
                const dataUrl = canvas.toDataURL('image/jpeg', 0.8);

                if (confirm("Salvar esta foto de perfil?")) {

    const progress = ((assistant.xp || 0) / xpNext) * 100;

    const availablePerks = ASSISTANT_PERKS.filter(p => !(assistant.perks || []).some(cp => cp.id === p.id));
    const perkOptions = React.useMemo(() => availablePerks.sort(() => 0.5 - Math.random()).slice(0, 3), [assistant.pendingPerks]);
